<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>青帆社区 · 管理后台</title>
<style>




*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#4facfe;--pri-d:#2d8bc9;--pri-dd:#1a6fa0;--pri-l:#e8f4ff;
  --coral:#ff6b6b;--coral-d:#e84545;--coral-l:#fff0f0;
  --green:#00b894;--green-l:#e6f9f3;
  --orange:#ffa502;--orange-l:#fff5e6;
  --purple:#6c5ce7;--purple-l:#f0eeff;
  --bg:#f0f2f5;--white:#fff;--card:#fff;
  --text:#2d3436;--text2:#636e72;--text3:#b2bec3;
  --border:#e8ecf1;--shadow:0 2px 12px rgba(0,0,0,.06);
  --font:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --r:8px;--r2:12px;
  --side-w:240px;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{border:none;background:none;font-family:var(--font);cursor:pointer}
input,textarea,select{font-family:var(--font);outline:none;border:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d0d5dd;border-radius:3px}

/* ===== LOGIN ===== */
#loginPage{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a6fa0 0%,#4facfe 50%,#7ec8ff 100%);overflow:hidden}
#loginPage.hidden{display:none}
.login-deco{position:absolute;border-radius:50%;opacity:.1;background:#fff}
.login-deco:nth-child(1){width:400px;height:400px;top:-100px;right:-80px}
.login-deco:nth-child(2){width:300px;height:300px;bottom:-80px;left:-60px}
.login-deco:nth-child(3){width:200px;height:200px;top:40%;left:15%}
.login-box{position:relative;z-index:2;width:400px;background:#fff;border-radius:20px;padding:48px 40px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.login-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.login-logo svg{flex-shrink:0}
.login-title{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--pri-d),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-sub{text-align:center;color:var(--text3);font-size:13px;margin-bottom:32px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500}
.login-input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;transition:border .2s;background:var(--bg)}
.login-input:focus{border-color:var(--pri);background:#fff}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--pri),var(--pri-d));border-radius:10px;color:#fff;font-size:15px;font-weight:700;margin-top:8px;transition:all .15s;box-shadow:0 4px 15px rgba(79,172,254,.3)}
.login-btn:hover{box-shadow:0 6px 20px rgba(79,172,254,.4);transform:translateY(-1px)}
.login-btn:active{transform:translateY(0) scale(.98)}
.login-hint{text-align:center;margin-top:16px;font-size:12px;color:var(--text3)}
.login-err{color:var(--coral);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* ===== LAYOUT ===== */
#adminApp{display:none;height:100vh}
#adminApp.active{display:flex}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--side-w);height:100vh;background:linear-gradient(180deg,#1a3a5c 0%,#1e4976 100%);display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:10}
.sidebar-header{padding:24px 20px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-header svg{flex-shrink:0}
.sidebar-brand{color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px}
.sidebar-brand span{display:block;font-size:11px;color:rgba(255,255,255,.45);font-weight:400;margin-top:2px}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;color:rgba(255,255,255,.6);font-size:14px;cursor:pointer;transition:all .15s;position:relative;margin:2px 8px;border-radius:8px}
.nav-item:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.05)}
.nav-item.active{color:#fff;background:rgba(79,172,254,.2)}
.nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--pri);border-radius:0 3px 3px 0}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--coral);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-user{display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:34px;height:34px;border-radius:50%;background:rgba(79,172,254,.25);display:flex;align-items:center;justify-content:center}
.sidebar-userinfo{flex:1}
.sidebar-username{color:#fff;font-size:13px;font-weight:600}
.sidebar-userrole{color:rgba(255,255,255,.4);font-size:11px}
.sidebar-logout{color:rgba(255,255,255,.4);cursor:pointer;padding:6px;border-radius:6px;transition:all .15s}
.sidebar-logout:hover{color:#fff;background:rgba(255,255,255,.1)}

/* ===== MAIN ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-time{font-size:12px;color:var(--text3)}
.content{flex:1;overflow-y:auto;padding:24px}
.page{display:none}
.page.active{display:block}

/* ===== STAT CARDS ===== */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:var(--r2);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s}
.stat-card:hover{transform:translateY(-2px)}
.stat-card::after{content:"";position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%;opacity:.06;transform:translate(20px,-20px)}
.stat-card:nth-child(1)::after{background:var(--pri)}
.stat-card:nth-child(2)::after{background:var(--green)}
.stat-card:nth-child(3)::after{background:var(--coral)}
.stat-card:nth-child(4)::after{background:var(--orange)}
.stat-card:nth-child(5)::after{background:var(--purple)}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat-icon.blue{background:var(--pri-l)}
.stat-icon.green{background:var(--green-l)}
.stat-icon.red{background:var(--coral-l)}
.stat-icon.orange{background:var(--orange-l)}
.stat-icon.purple{background:var(--purple-l)}
.stat-value{font-size:28px;font-weight:800;color:var(--text);line-height:1}
.stat-label{font-size:13px;color:var(--text3);margin-top:6px}
.stat-change{display:inline-flex;align-items:center;gap:2px;font-size:11px;margin-top:8px;padding:2px 6px;border-radius:4px;font-weight:600}
.stat-change.up{color:var(--green);background:var(--green-l)}
.stat-change.down{color:var(--coral);background:var(--coral-l)}

/* ===== CHARTS ===== */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:#fff;border-radius:var(--r2);padding:20px;box-shadow:var(--shadow)}
.chart-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.chart-title::before{content:"";width:3px;height:14px;background:var(--pri);border-radius:2px}
.chart-area{height:180px;display:flex;align-items:flex-end;gap:8px;padding:0 4px}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart-bar{width:100%;border-radius:4px 4px 0 0;transition:height .6s ease;min-height:4px;position:relative}
.chart-bar:hover{opacity:.85}
.chart-bar.blue{background:linear-gradient(180deg,var(--pri),var(--pri-d))}
.chart-bar.coral{background:linear-gradient(180deg,var(--coral),var(--coral-d))}
.chart-bar-label{font-size:11px;color:var(--text3)}
.chart-bar-val{font-size:11px;font-weight:600;color:var(--text2)}
.chart-line-area{height:180px;position:relative;padding:0 4px}
.chart-line-svg{width:100%;height:100%}

/* ===== QUICK ACTIONS ===== */
.quick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.quick-card{background:#fff;border-radius:var(--r2);padding:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .15s;border:1.5px solid transparent}
.quick-card:hover{border-color:var(--pri);transform:translateY(-2px)}
.quick-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quick-icon.qi-blue{background:var(--pri-l)}
.quick-icon.qi-red{background:var(--coral-l)}
.quick-icon.qi-green{background:var(--green-l)}
.quick-info h4{font-size:14px;font-weight:700;color:var(--text)}
.quick-info p{font-size:12px;color:var(--text3);margin-top:2px}

/* ===== TABLE ===== */
.table-card{background:#fff;border-radius:var(--r2);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.table-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.table-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.table-title::before{content:"";width:3px;height:16px;background:var(--pri);border-radius:2px}
.table-actions{display:flex;gap:8px}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg)}
th{padding:12px 16px;text-align:left;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
td{padding:14px 16px;font-size:13px;color:var(--text);border-top:1px solid var(--border)}
tr:hover td{background:rgba(79,172,254,.02)}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:600;transition:all .12s;cursor:pointer}
.btn:active{transform:scale(.95)}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri-d)}
.btn-coral{background:var(--coral);color:#fff}
.btn-coral:hover{background:var(--coral-d)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#00a383}
.btn-outline{border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--pri);color:var(--pri)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
.btn-text{color:var(--pri);font-size:12px;padding:4px 8px;border-radius:4px}
.btn-text:hover{background:var(--pri-l)}
.btn-text.danger{color:var(--coral)}
.btn-text.danger:hover{background:var(--coral-l)}
.btn-text.warn{color:var(--orange)}

/* ===== BADGES ===== */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-blue{background:var(--pri-l);color:var(--pri-d)}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-red{background:var(--coral-l);color:var(--coral)}
.badge-orange{background:var(--orange-l);color:var(--orange)}
.badge-purple{background:var(--purple-l);color:var(--purple)}
.badge-gray{background:var(--bg);color:var(--text3)}

/* ===== SEARCH/FILTER BAR ===== */
.filter-bar{display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:200px;max-width:360px}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search-input{width:100%;padding:9px 14px 9px 36px;background:#fff;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;transition:border .2s}
.search-input:focus{border-color:var(--pri)}
.filter-select{padding:9px 32px 9px 12px;background:#fff;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--text);appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23636e72' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;cursor:pointer}
.filter-select:focus{border-color:var(--pri)}

/* ===== POST CARDS (Review) ===== */
.review-list{display:flex;flex-direction:column;gap:12px}
.review-card{background:#fff;border-radius:var(--r2);padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--orange);transition:all .15s}
.review-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.review-card.approved{border-left-color:var(--green)}
.review-card.rejected{border-left-color:var(--coral)}
.review-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.review-author{display:flex;align-items:center;gap:10px}
.review-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.review-name{font-size:13px;font-weight:600}
.review-time{font-size:11px;color:var(--text3)}
.review-title{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text)}
.review-excerpt{font-size:13px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.review-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.review-tags{display:flex;gap:6px}
.review-actions{display:flex;gap:6px}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:520px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:20px 24px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;transition:all .12s}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:20px 24px}
.modal-foot{padding:16px 24px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border)}

/* ===== FORM ===== */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;transition:border .2s}
.form-input:focus{border-color:var(--pri)}
textarea.form-input{min-height:80px;resize:vertical}
.form-select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;appearance:none;background:#fff url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23636e72' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 12px center}

/* ===== TOAST ===== */
.toast-container{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.12);animation:toastIn .3s ease;display:flex;align-items:center;gap:8px}
.toast.success{background:var(--green)}
.toast.error{background:var(--coral)}
.toast.info{background:var(--pri)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}

/* ===== CONFIRM DIALOG ===== */
.confirm-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.confirm-overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;padding:28px 32px;width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.confirm-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.confirm-icon.warn{background:var(--coral-l)}
.confirm-icon.info{background:var(--pri-l)}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-desc{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.5}
.confirm-btns{display:flex;gap:10px;justify-content:center}
.confirm-btns .btn{min-width:100px;justify-content:center}

/* ===== USER AVATAR ===== */
.user-cell{display:flex;align-items:center;gap:10px}
.user-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-state svg{margin-bottom:12px;opacity:.3}
.empty-state p{font-size:14px}

/* ===== RESPONSIVE ===== */
@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.charts-row{grid-template-columns:1fr}.quick-row{grid-template-columns:1fr}}

/* ===== MOBILE: Sidebar Toggle ===== */
.sidebar-toggle{display:none;position:fixed;top:12px;left:12px;z-index:20;width:40px;height:40px;border-radius:10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);align-items:center;justify-content:center;cursor:pointer}
.sidebar-overlay{display:none;position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35)}

/* ===== MOBILE: Responsive Overrides ===== */
@media(max-width:768px){
  .sidebar-toggle{display:flex}
  .sidebar{position:fixed;left:-260px;top:0;z-index:10;transition:left .3s ease;box-shadow:none}
  .sidebar.open{left:0;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .sidebar-overlay.show{display:block}
  .main{width:100%}
  .topbar{padding:0 16px 0 56px}
  .content{padding:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}
  .stat-value{font-size:22px}
  .stat-label{font-size:12px}
  .charts-row{grid-template-columns:1fr}
  .quick-row{grid-template-columns:1fr}
  .chart-area{height:140px}
  /* Tables: scrollable */
  .table-card{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:500px}
  th,td{padding:10px 12px;font-size:13px;white-space:nowrap}
  /* Review cards */
  .review-card{padding:14px}
  .review-title{font-size:14px}
  .review-excerpt{font-size:12px}
  .review-bottom{flex-direction:column;align-items:flex-start;gap:10px}
  .review-actions{width:100%;justify-content:flex-end}
  /* Filters */
  .filter-bar{flex-direction:column;gap:8px}
  .search-box{max-width:100%;min-width:0;width:100%}
  .filter-select{width:100%}
  /* Modal */
  .modal{width:95vw;max-width:95vw;max-height:90vh}
  .modal-head{padding:16px 18px 12px}
  .modal-body{padding:16px 18px}
  .modal-foot{padding:12px 18px 16px}
  /* Confirm */
  .confirm-box{width:90vw;padding:24px 20px}
  /* Login */
  .login-box{width:90vw;max-width:400px;padding:36px 24px}
  .login-title{font-size:20px}
  /* Settings page items */
  #bannerList>div,#announceList>div{flex-direction:column;align-items:flex-start!important;gap:8px}
  /* Buttons */
  .btn{font-size:13px;padding:8px 14px}
  .btn-sm{font-size:12px;padding:5px 10px}
  /* Empty state */
  .empty-state{padding:32px 16px}
}

@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr;gap:8px}
  .stat-card{padding:12px}
  .stat-value{font-size:20px}
  .stat-icon{width:32px;height:32px;margin-bottom:8px}
  .content{padding:12px}
  .topbar{height:50px}
  .review-top{flex-direction:column;align-items:flex-start;gap:8px}
}

/* V5: 表单校验 shake */

ime":"2025-01-20 11:30","excerpt":"学了三个月Python，终于做出了一个能用的东西！","content":"学了三个月Python，终于做出了一个能用的东西！我们村的苹果一直销路不好，我做了一个简单的销售小程序，可以在线下单查看物流。虽然界面还很粗糙，但村里的叔叔阿姨们用得很开心。","status":"approved","tag":"技能打卡","images":["https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=900&q=80"],"likes":302,"comments":[],"cbg":"linear-gradient(135deg,#00cec9,#0984e3)","abg":"linear-gradient(135deg,#00cec9,#0984e3)","icon":"code","featured":true,"pinned":true},{"id":6,"title":"支教日记：孩子们教给我的比我还教的多","author":"赵一诺","time":"2025-01-20 15:00","excerpt":"支教的第15天，一个叫小杰的男孩递给我一张纸条...","content":"支教的第15天，一个叫小杰的男孩递给我一张纸条，上面写着：老师你以后还会来吗？那一刻眼泪差点掉下来。这些孩子让我明白，教育的本质不是灌输知识，而是点燃希望。","status":"approved","tag":"实践感悟","images":[],"likes":176,"comments":[],"cbg":"linear-gradient(135deg,#fab1a0,#e17055)","abg":"linear-gradient(135deg,#fab1a0,#e17055)","icon":"heart","featured":false,"pinned":false},{"id":7,"title":"科普写作入门：把复杂的事说简单","author":"刘子轩","time":"2025-01-21 10:00","excerpt":"加入扬帆科普写作小组一个月了，从最初写得像论文到现在能写出朋友圈爆款...","content":"加入扬帆科普写作小组一个月了，从最初写得像论文到现在能写出朋友圈爆款。秘诀就是先想清楚读者是谁，再用他们听得懂的话讲。比如不要说光合作用是植物利用光能将CO2转化为有机物的过程，而要说植物晒太阳就能吃饱！","status":"approved","tag":"学习分享","images":[],"likes":64,"comments":[],"cbg":"linear-gradient(135deg,#a29bfe,#6c5ce7)","abg":"linear-gradient(135deg,#dfe6e9,#b2bec3)","icon":"edit","featured":false,"pinned":false},{"id":8,"title":"社区公益活动：为老人教智能手机","author":"孙雅琪","time":"2025-01-21 14:30","excerpt":"上周末在社区教老人们使用智能手机...","content":"上周末在社区教老人们使用智能手机。最让我感动的是70岁的王奶奶，学会视频通话后第一件事就是给在外地的孙子打电话。科技不应该成为代沟，而应该成为连接的桥梁。","status":"approved","tag":"志愿服务","images":[],"likes":143,"comments":[],"cbg":"linear-gradient(135deg,#55efc4,#00b894)","abg":"linear-gradient(135deg,#ffeaa7,#fdcb6e)","icon":"users","featured":false,"pinned":false},{"id":9,"title":"从零基础到独立完成纪录片的影像之路","author":"周文博","time":"2025-01-22 08:00","excerpt":"一年前我连手机录像都不会，现在居然独立完成了一部15分钟的乡村纪录片...","content":"一年前我连手机录像都不会，现在居然独立完成了一部15分钟的乡村纪录片。最难忘的是在海拔3000米的山上拍日出，冻得手都僵了，但看到成片的那一刻，值了！","status":"approved","tag":"拍摄日记","images":["https://images.unsplash.com/photo-1492724441997-5dc865305da7?w=900&q=80"],"likes":231,"comments":[],"cbg":"linear-gradient(135deg,#74b9ff,#0984e3)","abg":"linear-gradient(135deg,#81ecec,#00cec9)","icon":"film","featured":true,"pinned":true},{"id":10,"title":"考研经验分享：如何制定科学的复习计划","author":"吴佳怡","time":"2025-01-22 13:00","excerpt":"成功上岸985！分享复习时间线...","content":"成功上岸985！分享复习时间线：3-6月打基础每天6小时；7-9月强化每天8小时；10-12月冲刺每天10小时。关键是每周留出半天休息，保证效率比堆时间重要。","status":"approved","tag":"学习分享","images":["https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=900&q=80"],"likes":189,"comments":[],"cbg":"linear-gradient(135deg,#fd79a8,#e84393)","abg":"linear-gradient(135deg,#fd79a8,#e84393)","icon":"target","featured":true,"pinned":true},{"id":11,"title":"策划校园环保活动，参与人数超预期3倍","author":"黄子豪","time":"2025-01-23 09:30","excerpt":"在扬帆学到了项目策划方法论，决定在学校试一次...","content":"在扬帆学到了项目策划方法论，决定在学校试一次。从立项到执行用了两周，原本预计100人参加，结果来了300多人！成功的秘诀是找到同学们真正关心的切入点。","status":"approved","tag":"实践感悟","images":[],"likes":98,"comments":[],"cbg":"linear-gradient(135deg,#00b894,#00cec9)","abg":"linear-gradient(135deg,#00b894,#55efc4)","icon":"layers","featured":false,"pinned":false},{"id":12,"title":"乡村教育的未来：一个支教老师的深度思考","author":"郑晓峰","time":"2025-01-23 16:00","excerpt":"支教两年，我越来越觉得乡村教育缺的不是硬件而是有热情懂方法的老师...","content":"支教两年，我越来越觉得乡村教育缺的不是硬件而是有热情懂方法的老师。扬帆计划正在做的就是培养这样的火种。我希望更多年轻人能加入进来，哪怕只是短暂的陪伴，也能照亮孩子们的路。","status":"approved","tag":"成长思考","images":["https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=900&q=80"],"likes":267,"comments":[],"cbg":"linear-gradient(135deg,#6c5ce7,#a29bfe)","abg":"linear-gradient(135deg,#6c5ce7,#a29bfe)","icon":"globe","featured":true,"pinned":true},{"id":13,"title":"我的第一次社会实践经历","author":"李明","time":"2025-01-24 14:30","excerpt":"这个暑假我参加了扬帆计划的社会实践活动，第一次走进社区...","content":"这个暑假我参加了扬帆计划的社会实践活动，第一次走进社区，和居民面对面交流。感触很深，也更加坚定了自己投身公益的决心。","status":"approved","tag":"实践感悟","images":[],"likes":45,"comments":[],"cbg":"linear-gradient(135deg,#4facfe,#7ec8ff)","abg":"linear-gradient(135deg,#4facfe,#00 for(var k in seeds){if(!_yfLoad(k)){_yfSave(k,seeds[k]);}}
}else{
var configKeys=['banners','tags','bad_words'];
for(var ck=0;ck<configKeys.length;ck++){_yfSave(configKeys[ck],seeds[configKeys[ck]]);}
for(var k2 in seeds){if(!_yfLoad(k2)){_yfSave(k2,seeds[k2]);}}
if(curVer<6){
try{
var _u6=_yfLoad('users')||[];

if(!_u6[_ui].signature)_u6[_ui].signature='';
if(!_u6[_ui].mood)_u6[_ui].mood='';

if(!_u6[_ui].following)_u6[_ui].following=[];

}
_yfSave('users',_u6);
var _p6=_yfLoad('posts')||[];
for(var _pi=0;_pi<_p6.length;_pi++){
if(!_p6[_pi].reactions)_p6[_pi].reactions={};
if(!_p6[_pi].edited)_p6[_pi].edited=false;
if(!_p6[_pi].challengeTag)_p6[_pi].challengeTag='';
if(!_p6[_pi].userId)_p6[_pi].userId=0;
}
_yfSave('posts',_p6);
}catch(e){console.warn('V6 migration error:',e);}
}
if(curVer<9){
try{
var _p9a=_yfLoad('posts')||[];
var _seedIds9=[3,5,9,10,12];
for(var _pi9=0;_pi9<_p9a.length;_pi9++){
if(_seedIds9.indexOf(_p9a[_pi9].id)>=0){_p9a[_pi9].featured=true;_p9a[_pi9].pinned=true;}
}
_yfSave('posts',_p9a);
}catch(e){console.warn('V9 admin migration error:',e);}
}
if(curVer<10){
try{
localStorage.removeItem('yf_rid_map_posts');
localStorage.removeItem('yf_rid_map_users');
var _p10a=_yfLoad('posts')||[];
var _seedIds10=[3,5,9,10,12];
for(var _pi10=0;_pi10<_p10a.length;_pi10++){
if(_seedIds10.indexOf(_p10a[_pi10].id)>=0){_p10a[_pi10].featured=true;_p10a[_pi10].pinned=true;}
}
_yfSave('posts',_p10a);
}catch(e){console.warn('V10 admin migration error:',e);}
}
}
localStorage.setItem('yf_growth_config',JSON.stringify(_YF_SEED_growth_config));
localStorage.setItem('yf_medals_config',JSON.stringify(_YF_SEED_medals));
localStorage.setItem(_YF_VER,_YF_CUR_VER);
}

function _yfLoadAll(){
for(var i=0;i<_YF_TABLES.length;i++){var k=_YF_TABLES[i];_YF_cache[k]=_yfLoad(k)||[];}
_YF_inited=true;
}

function _yfNextId(table){
var arr=_YF_cache[table]||[];if(!arr.length)return 1;var mx=0;
for(var i=0;i<arr.length;i++){if(arr[i].id>mx)mx=arr[i].id;}return mx+1;
}

function _yfLog(action,detail){
var log=_YF_cache.audit_logs||[];
log.unshift({id:log.length+1,action:action,detail:detail,time:_yfNow()});
if(log.length>200)log=log.slice(0,200);
_YF_cache.audit_logs=log;_yfSave('audit_logs',log);
}

// ---- Posts ----
getPosts:function(filter){
var posts=_YF_cache.posts||[];
if(filter){
if(filter.status)posts=posts.filter(function(p){return p.status===filter.status;});
if(filter.tag)posts=posts.filter(function(p){return p.tag===filter.tag;});
if(filter.author)posts=posts.filter(function(p){return p.author===filter.author;});
if(filter.search){var q=filter.search.toLowerCase();posts=posts.filter(function(p){return p.title.toLowerCase().indexOf(q)>-1||p.author.toLowerCase().indexOf(q)>-1;});}
if(filter.pinned!==undefined)posts=posts.filter(function(p){return !!p.pinned===filter.pinned;});
}
return JSON.parse(JSON.stringify(posts));
},
getPost:function(id){var posts=_YF_cache.posts||[];for(var i=0;i<posts.length;i++){if(posts[i].id===id)return JSON.parse(JSON.stringify(posts[i]));}return null;},
createPost:function(data){
var posts=_YF_cache.posts||[];
var np={id:_yfNextId('posts'),title:data.title||'',author:data.author||'匿名用户',time:data.time||_yfNow(),excerpt:data.excerpt||'',content:data.content||'',status:data.status||'approved',tag:data.tag||'成长思考',images:data.images||[],likes:0,comments:data.comments||[],cbg:data.cbg||'linear-gradient(135deg,#4facfe,#00f2fe)',abg:data.abg||'linear-gradient(135deg,#4facfe,#00f2fe)',icon:data.icon||'star',featured:false,pinned:false};

return np;
},
updatePost:function(id,data){
var posts=_YF_cache.posts||[];
for(var i=0;i<posts.length;i++){if(posts[i].id===id){for(var k in data){posts[i][k]=data[k];}break;}}
_YF_cache.posts=posts;_yfSave('posts',posts);

return posts.find(function(p){return p.id===id;});
},
deletePost:function(id){

},

}
}

var today=_yfToday();
var todayActive=0,newUsers=0,todayPosts=0;
var activeUserSet={};
for(var i=0;i<posts.length;i++){
var p=posts[i];
var pDay=(p.time||'').substring(0,10);
if(pDay===today){
todayPosts++;
if(p.author)activeUserSet[p.author]=1;
}
// Check comments for active users today
if(p.comments){for(var j=0;j<p.comments.length;j++){}}
}
for(var i=0;i<users.length;i++){
if((users[i].created||'').substring(0,10)===today)newUsers++;
}

var userChart=[0,0,0,0,0,0,0],postChart=[0,0,0,0,0,0,0];

for(var i=0;i<7;i++){

for(var j=0;j<users.length;j++){if((users[j].created||'').substring(0,10)===ds)userChart[i]++;}

}

};

}

// P1-4: 加精/置顶 —— 改动后自动推送到飞书，学生端30秒内同步
function _adminPushPost(id){
  try{
    if(!FEISHU_CONFIG.proxyUrl||!FEISHU_CONFIG.baseToken)return;
    var p=YangFanData.getPost(id);
    if(!p)return;
    var tableId=FEISHU_CONFIG.tables.posts;
    var apiPath='/bitable/v1/apps/'+FEISHU_CONFIG.baseToken+'/tables/'+tableId+'/records';
    var fields=FEISHU_CONFIG.mapToFeishuFields('posts',p);
    // 按post_id字段搜索云端记录
    proxyFetch(apiPath+'/search?page_size=200','POST',{filter:{conjunction:'and',conditions:[{field_name:'post_id',operator:'is',value:[String(id)]}]}}).then(function(d){
      var items=(d&&d.data&&d.data.items)||[];
      if(items.length>0){
        var rid=items[0].record_id;
        return proxyFetch(apiPath+'/'+rid,'PUT',{fields:fields});
      }else{
        return proxyFetch(apiPath,'POST',{fields:fields});
      }
    }).then(function(){
      console.log('[ADMIN] 帖子 '+id+' 已推送到云端');
    }).catch(function(e){
      console.warn('[ADMIN] 帖子推送失败（本地已生效，下次全量推送会同步）:',e.message);
    });
  }catch(e){console.warn('[ADMIN] _adminPushPost error:',e);}
}

function unfeaturePostAdmin(id){YangFanData.unfeaturePost(id);_adminPushPost(id);renderReview();showToast('已取消精华','info');}
function pinPostAdmin(id){YangFanData.pinPost(id);_adminPushPost(id);renderReview();showToast('已置顶，已同步','success');}
function unpinPostAdmin(id){YangFanData.unpinPost(id);_adminPushPost(id);renderReview();showToast('已取消置顶','info');}

function _adminDeletePostCloud(id){
  try{
    if(!FEISHU_CONFIG.proxyUrl||!FEISHU_CONFIG.baseToken)return Promise.resolve();
    var tableId=FEISHU_CONFIG.tables.posts;
    var apiPath='/bitable/v1/apps/'+FEISHU_CONFIG.baseToken+'/tables/'+tableId+'/records';
    return proxyFetch(apiPath+'/search?page_size=200','POST',{filter:{conjunction:'and',conditions:[{field_name:'post_id',operator:'is',value:[String(id)]}]}}).then(function(d){
      var items=(d&&d.data&&d.data.items)||[];
      if(items.length>0){

'linear-gradient(135deg,#6c5ce7,#a29bfe)',

function handleBannerImg(input){
try{
var f=input.files[0];if(!f)return;
if(f.size>5*1024*1024){showToast('图片不能超过5MB','warn');input.value='';return;}
var reader=new FileReader();
reader.onload=function(e){
var img=new Image();
img.onload=function(){
var canvas=document.createElement('canvas');
var W=1200,ratio=img.height/img.width;
canvas.width=W;canvas.height=Math.max(200,Math.round(W*ratio*0.5));
var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
try{
_bannerEditImg=canvas.toDataURL('image/jpeg',0.82);
var pv=document.getElementById('bPreview');if(pv){pv.style.background='url('+_bannerEditImg+') center/cover no-repeat';}
var st=document.getElementById('bImgStatus');if(st){st.textContent='已上传 '+Math.round(f.size/1024)+'KB';st.style.color='#00b894';}
if(_bSelGrad!=null){var _gr2=_getBannerGrads();for(var gi=0;gi<_gr2.length;gi++){var gel=document.getElementById('bGrad'+gi);if(gel)gel.style.borderColor='transparent';}}
_bSelGrad=-1;
var cb=document.getElementById('bClearBtn');if(cb)cb.style.display='inline-flex';
}catch(err){showToast('图片过大，请压缩后重试','error');}
};
img.onerror=function(){showToast('图片加载失败','error');};
img.src=e.target.result;
};
reader.onerror=function(){showToast('图片读取失败','error');};
reader.readAsDataURL(f);
}catch(e){console.error('handleBannerImg error:',e);showToast('上传失败：'+e.message,'error');}
}
function saveBanner(id){
try{
var titleEl=document.getElementById('bTitle');

var grads=_getBannerGrads();
var gradIdx=(_bSelGrad!=null&&_bSelGrad>=0)?_bSelGrad:0;
var payload={title:title,desc:desc,color:'#4facfe',gradient:_bannerEditImg?'':(grads[gradIdx]||grads[0]),image:_bannerEditImg};
var saveBtn=document.getElementById('bSaveBtn');if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='保存中...';}

// ===== 数据同步 (飞书 · Cloudflare Worker 代理 V5) =====

// Cloudflare Worker 脚本（ES module 格式，供用户复制部署）
var CF_WORKER_SCRIPT = `// 青帆社区 · 飞书多维表格代理 Worker
// 部署后在 Worker 设置 → Variables 中添加（值见部署文档或向管理员获取）：
//   APP_ID     = 你的飞书应用 App ID
//   APP_SECRET = 你的飞书应用 App Secret
const FEISHU_BASE = 'https://open.feishu.cn/open-apis';
let _token = null;
let _tokenExp = 0;

async function getToken(env) {
  if (_token && Date.now() < _tokenExp) return _token;
  const r = await fetch(FEISHU_BASE + '/auth/v3/tenant_access_token/internal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ app_id: env.APP_ID, app_secret: env.APP_SECRET })
  });
  const d = await r.json();
  if (d.tenant_access_token) {
    _token = d.tenant_access_token;
    _tokenExp = Date.now() + (d.expire - 300) * 1000;
    return _token;
  }
  throw new Error(d.msg || 'token 获取失败');
}

function corsHeaders() {
  return {
    'Access-Control-Allow-Origin': '*',
    'Access-Control-Allow-Methods': 'GET,POST,OPTIONS',
    'Access-Control-Allow-Headers': 'Content-Type'
  };
}

export default {
  async fetch(request, env) {
    // CORS 预检
    if (request.method === 'OPTIONS') {
      return new Response(null, { status: 204, headers: corsHeaders() });
    }
    const url = new URL(request.url);

    // 健康检查
    if (url.pathname === '/' || url.pathname === '/ping') {
      return new Response(JSON.stringify({ ok: true, service: 'yangfan-feishu-proxy' }), {
        headers: { 'Content-Type': 'application/json', ...corsHeaders() }
      });
    }

    try {
      const token = await getToken(env);
      // 统一代理：POST body = { path, method, body }
      const payload = await request.json().catch(() => ({}));
      const apiPath = payload.path || '/bitable/v1/apps';
      const method = (payload.method || 'GET').toUpperCase();
      const apiUrl = FEISHU_BASE + apiPath;
      const opt = {
        method: method,
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        }
      };
      if (method !== 'GET' && payload.body) {
        opt.body = JSON.stringify(payload.body);
      }
      const resp = await fetch(apiUrl, opt);
      const text = await resp.text();
      return new Response(text, {
        status: resp.status,
        headers: { 'Content-Type': 'application/json', ...corsHeaders() }
      });
    } catch (e) {
      return new Response(JSON.stringify({ code: -1, msg: e.message }), {
        status: 502,
        headers: { 'Content-Type': 'application/json', ...corsHeaders() }
      });
    }
  }
};`;

// 统一代理请求（10秒超时）
function proxyFetch(apiPath, method, body){
  var proxy=FEISHU_CONFIG.proxyUrl;
  if(!proxy)return Promise.reject(new Error('未配置云同步代理'));
  var base=proxy.replace(/\/+$/,'');
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},10000);
  return fetch(base+'/',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path:apiPath,method:method||'GET',body:body||null}),
    signal:ctrl.signal
  }).then(function(r){
    clearTimeout(timer);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).catch(function(e){
    clearTimeout(timer);
    if(e.name==='AbortError')throw new Error('请求超时（10秒）');
    throw e;
  });
}

// 从飞书拉取单表数据（走代理，merge 策略）
function pullTable(tableKey){
  var tableId=FEISHU_CONFIG.tables[tableKey];
  var path='/bitable/v1/apps/'+FEISHU_CONFIG.baseToken+'/tables/'+tableId+'/records/search?page_size=200';
  return proxyFetch(path,'POST',{}).then(function(d){
    if(d.code!==0||!d.data||!d.data.items){
      if(d.msg)throw new Error(d.msg);
      return [];
    }
    return d.data.items.map(function(item){
      return FEISHU_CONFIG.mapFromFeishuRecord(tableKey,item);
    });
  });
}

// 推送本地数据到飞书（全量覆盖单表：先删后增）
function pushTable(tableKey,localData){
  var tableId=FEISHU_CONFIG.tables[tableKey];
  var apiPath='/bitable/v1/apps/'+FEISHU_CONFIG.baseToken+'/tables/'+tableId+'/records';
  // 逐条 upsert：按 ID 搜索云端记录，存在则更新，不存在则新建
  // 避免「先删后建」导致的云端数据清空风险
  var success=0,fail=0;
  return localData.reduce(function(p,item){
    return p.then(function(){
      var fields=FEISHU_CONFIG.mapToFeishuFields(tableKey,item);
      var idField=null;
      var idVal=null;
      if(tableKey==='posts'){idField='post_id';idVal=String(item.id);}
      else if(tableKey==='users'){idField='user_id';idVal=String(item.id);}
      else if(tableKey==='stars'){idField='star_id';idVal=String(item.id);}
      else if(tableKey==='groups'){idField='group_id';idVal=String(item.id);}
      else if(tableKey==='opps'){idField='opp_id';idVal=String(item.id);}
      else if(tableKey==='announces'){idField='ann_id';idVal=String(item.id);}
      else if(tableKey==='shop_items'){idField='item_id';idVal=String(item.id);}
      else if(tableKey==='bad_words'){idField='word_id';idVal=String(item.id);}
      else if(tableKey==='notifications'){idField='notif_id';idVal=String(item.id);}
      else if(tableKey==='exchanges'){idField='exchange_id';idVal=String(item.id);}
      else if(tableKey==='reports'){idField='report_id';idVal=String(item.id);}
      else if(tableKey==='messages'){idField='msg_id';idVal=String(item.id);}
      if(!idField||idVal==null)return Promise.resolve();
      return proxyFetch(apiPath+'/search?page_size=10','POST',{filter:{conjunction:'and',conditions:[{field_name:idField,operator:'is',value:[idVal]}]}}).then(function(d){
        var items=(d&&d.data&&d.data.items)||[];
        if(items.length>0){
          return proxyFetch(apiPath+'/'+items[0].record_id,'PUT',{fields:fields}).then(function(){success++;}).catch(function(){fail++;});
        }else{
          return proxyFetch(apiPath,'POST',{fields:fields}).then(function(){success++;}).catch(function(){fail++;});
        }
      });
    });
  },Promise.resolve()).then(function(){
    syncLog(tableKey+' 推送完成：成功'+success+'条'+(fail>0?'，失败'+fail+'条':''));
    return {success:success,fail:fail};
  });
}

var _workerScriptShown=false;
function toggleWorkerScript(){
  var pre=document.getElementById('workerScriptPre');
  if(!pre)return;
  _workerScriptShown=!_workerScriptShown;
  pre.style.display=_workerScriptShown?'block':'none';
  if(_workerScriptShown){
    // 尝试选中脚本方便复制
    try{
      var range=document.createRange();
      range.selectNodeContents(pre);
      var sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
    }catch(e){}
    // 同时提供复制按钮
    if(!document.getElementById('copyWorkerBtn')){
      var btn=document.createElement('button');
      btn.id='copyWorkerBtn';
      btn.className='btn btn-sm btn-pri';
      btn.style.cssText='margin-top:8px';
      btn.innerHTML='复制脚本到剪贴板';
      btn.onclick=copyWorkerScript;
      pre.parentNode.insertBefore(btn,pre.nextSibling);
    }
  }
}

function copyWorkerScript(){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(CF_WORKER_SCRIPT).then(function(){
        showToast('Worker 脚本已复制到剪贴板','success');
      }).catch(function(){
        fallbackCopy(CF_WORKER_SCRIPT);
      });
    }else{
      fallbackCopy(CF_WORKER_SCRIPT);
    }
  }catch(e){showToast('复制失败，请手动选择文本复制','error');}
}

function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast('Worker 脚本已复制','success');}
  catch(e){showToast('复制失败，请手动复制','error');}
  document.body.removeChild(ta);
}

    syncLog('开始全量推送到飞书...');
    var tableKeys=['posts','users','stars','groups','opps','announces','shop_items','exchanges','notifications','reports','bad_words'];
    var tableGetters={posts:YangFanData.getPosts,users:YangFanData.getUsers,stars:YangFanData.getStars,groups:YangFanData.getGroups,opps:YangFanData.getOpps,announces:YangFanData.getAnnounces,shop_items:YangFanData.getShopItems,exchanges:YangFanData.getExchanges,notifications:YangFanData.getNotifications,reports:YangFanData.getReports,bad_words:YangFanData.getBadWords};
    var idx=0;
    function next(){
      if(idx>=tableKeys.length){syncLog('全部推送完成！');showToast('全部推送完成','success');return;}
      var key=tableKeys[idx++];
      var data=[];
      try{data=tableGetters[key].call(YangFanData)||[];}catch(e){syncLog('  '+key+': 无getter，跳过');setTimeout(next,300);return;}
      syncLog('  '+key+': 上传 '+data.length+' 条...');
      pushTable(key,data).then(function(){syncLog('  ✓ '+key+': 完成');setTimeout(next,500);}).catch(function(e){syncLog('  ✗ '+key+': '+e.message);setTimeout(next,500);});
    }
    next();
  });
}

// 从飞书拉取（云端作为唯一真相，直接替换本地）
function pullAll(){
  var proxy=FEISHU_CONFIG.proxyUrl;
  if(!proxy){showToast('未配置云同步代理','info');return;}
  syncLog('从飞书拉取数据...');
  var tableKeys=['posts','users','stars','groups','opps','announces','shop_items','exchanges','notifications','reports','bad_words'];
  var idx=0;
  function next(){
    if(idx>=tableKeys.length){
      syncLog('拉取完成，刷新视图...');
      try{YangFanData.refresh();}catch(e){}
      var active=document.querySelector('.nav-item.active');
      if(active){try{switchPage(active.getAttribute('data-page'));}catch(e){}}
      showToast('飞书数据已同步到本地','success');
      return;
    }
    var key=tableKeys[idx++];
    pullTable(key).then(function(records){
      if(records&&records.length>0){
        // 云端有数据：直接替换本地
        _yfSave(key,records);
        if(_YF_cache)_YF_cache[key]=records;
        syncLog('  '+key+': 同步 '+records.length+' 条');
      }else{
        syncLog('  '+key+': 飞书无数据（保留本地）');
      }
      setTimeout(next,300);
    }).catch(function(e){
      syncLog('  '+key+': '+e.message);
      setTimeout(next,300);
    });
  }
  next();
}

// 单表同步：拉取飞书数据合并到本地
function syncTable(tableKey){
  var proxy=FEISHU_CONFIG.proxyUrl;
  if(!proxy){showToast('未配置云同步代理','info');return;}
  syncLog('同步 '+tableKey+' ...');
  pullTable(tableKey).then(function(records){
    if(records&&records.length>0){
      // 云端有数据：直接替换本地
      _yfSave(tableKey,records);
      if(_YF_cache)_YF_cache[tableKey]=records;
      try{YangFanData.refresh();}catch(e){}
      var active=document.querySelector('.nav-item.active');
      if(active){try{switchPage(active.getAttribute('data-page'));}catch(e){}}
      syncLog('  ✓ '+tableKey+': 已同步 '+records.length+' 条');
      showToast(tableKey+' 同步成功（'+records.length+'条）','success');
    }else{
      syncLog('  '+tableKey+': 飞书无数据（保留本地）');
      showToast(tableKey+' 飞书无数据','info');
    }
  }).catch(function(e){
    syncLog('  ✗ '+tableKey+': '+e.message);
    showToast(tableKey+' 同步失败：'+e.message,'error');
  });
}

function handleReport(id,action){
var reports=YangFanData.getReports();
var r=reports.find(function(x){return x.id===id;});
if(!r)return;
if(action==='delete'){
if(r.targetType==='post')YangFanData.deletePost(r.targetId);
YangFanData.updateReport(id,{status:'resolved',action:'delete',handledAt:new Date().toISOString()});
if(r.reporterId)YangFanData.createNotification({userId:r.reporterId,type:'system',text:'你举报的内容已被删除，感谢反馈'});
showToast('内容已删除','success');
}else if(action==='warn'){
YangFanData.updateReport(id,{status:'resolved',action:'warn',handledAt:new Date().toISOString()});
// Notify reported user (find by target)
if(r.targetType==='post'){
var p=YangFanData.getPost(r.targetId);
if(p){var au=YangFanData.getUsers().find(function(u){return u.name===p.author;});if(au)YangFanData.createNotification({userId:au.id,type:'system',text:'你发布的内容收到举报警告，请遵守社区规范'});}
}
showToast('已发送警告','success');
}else if(action==='ban'){
if(r.targetType==='post'){
var p2=YangFanData.getPost(r.targetId);
if(p2){var au2=YangFanData.getUsers().find(function(u){return u.name===p2.author;});if(au2){YangFanData.updateUser(au2.id,{status:'banned'});YangFanData.createNotification({userId:au2.id,type:'system',text:'因违规行为，你的账号已被封禁'});}}
}
YangFanData.updateReport(id,{status:'resolved',action:'ban',handledAt:new Date().toISOString()});
if(r.reporterId)YangFanData.createNotification({userId:r.reporterId,type:'system',text:'你举报的账号已被封禁'});
showToast('用户已封禁','success');
}else if(action==='dismiss'){
YangFanData.updateReport(id,{status:'dismissed',handledAt:new Date().toISOString()});
showToast('举报已驳回','info');
}
closeModal();
if(typeof renderReports==='function')renderReports();
}

// ---- Enhanced Dashboard Stats (A15) ----
function getV6Stats(){
var users=YangFanData.getUsers();
var posts=YangFanData.getPosts();
var today=_yfToday();
var yesterday=new Date(Date.now()-86400000);
var ys=yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');
// DAU
var dauUsers={};
for(var i=0;i<posts.length;i++){if((posts[i].time||'').substring(0,10)===today)dauUsers[posts[i].author]=1;}
var dau=Object.keys(dauUsers).length;
// MAU (30 days)
var mauSet={};
for(var i=0;i<posts.length;i++){
var d=(posts[i].time||'').substring(0,10);
var diff=(new Date(today)-new Date(d))/86400000;
if(diff<=30)mauSet[posts[i].author]=1;
}
var mau=Object.keys(mauSet).length;
// New users yesterday (for retention)
var newYesterday=users.filter(function(u){return (u.created||'').substring(0,10)===ys;});
var retained=0;
for(var i=0;i<newYesterday.length;i++){
for(var j=0;j<posts.length;j++){
if(posts[j].author===newYesterday[i].name&&(posts[j].time||'').substring(0,10)===today){retained++;break;}
}
}
var retentionRate=newYesterday.length?Math.round(retained/newYesterday.length*100):0;
// Post conversion
var activePosters={};
for(var i=0;i<posts.length;i++){if((posts[i].time||'').substring(0,10)===today)activePosters[posts[i].author]=1;}
var todayNewUsers=users.filter(function(u){return (u.created||'').substring(0,10)===today;}).length;
var postConversion=todayNewUsers?Math.round(Object.keys(activePosters).length/todayNewUsers*100):0;
// Checkin rate
var ci=yfSafeGet('checkin',{lastDate:''});
var checkinRate=users.length?Math.round(1/users.length*100):0; // simplified
// Blind box participation
var bb=yfSafeGet('blindbox',{count:0});
var bbRate=users.length?Math.round(bb.count/users.length*100):0;
// Top posts by likes
var topPosts=posts.filter(function(p){return p.status==='approved';}).sort(function(a,b){return (b.likes||0)-(a.likes||0);}).slice(0,10);
// Top active users
var userPostCount={};
for(var i=0;i<posts.length;i++){userPostCount[posts[i].author]=(userPostCount[posts[i].author]||0)+1;}
var topUsers=Object.keys(userPostCount).map(function(name){return{name:name,count:userPostCount[name]};}).sort(function(a,b){return b.count-a.count;}).slice(0,10);
return{dau:dau,mau:mau,retentionRate:retentionRate,postConversion:postConversion,checkinRate:checkinRate,bbRate:bbRate,topPosts:topPosts,topUsers:topUsers};
}

// ---- Storage cleanup (A11) ----
function cleanStorage(){
try{
var ns=YangFanData.getNotifications();
var cutoff=Date.now()-7*86400000;
var cleaned=0;
ns=ns.filter(function(n){
var t=new Date(n.time||'').getTime();
if(isNaN(t)||t>cutoff)return true;
cleaned++;return false;
});
// Clean via direct cache
var raw=_yfLoad('notifications')||[];
raw=raw.filter(function(n){var t=new Date(n.time||'').getTime();return isNaN(t)||t>cutoff;});
_yfSave('notifications',raw);_YF_cache.notifications=raw;
// Clean image cache
var imgKeys=[];
for(var i=0;i<localStorage.length;i++){
var k=localStorage.key(i);
if(k&&k.indexOf('yf_img_')===0)imgKeys.push(k);
}
for(var i=0;i<imgKeys.length;i++){try{localStorage.removeItem(imgKeys[i]);}catch(e){}}
showToast('清理完成：删除'+cleaned+'条旧通知, '+(imgKeys.length)+'个图片缓存','success');
}catch(e){showToast('清理失败: '+e.message,'error');}
}
