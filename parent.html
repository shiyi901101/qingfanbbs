/* ============================================================
   2 · YfData —— 数据层抽象
   ------------------------------------------------------------
   两种模式，同一套函数签名（全部返回 Promise<信封>）：
     本地演示模式（默认，当前）：读内置种子，零网络
     云端模式（预留，未实现）：走 CloudBase 云函数 parentHome
   信封与 Phase2 云函数契约一致：
     { code:0|40101|40301|... , message, data, server_ts }
   ============================================================ */
var YfData=(function(){
  /* ---- 运行模式与 API 基址（上架改造 2026-10-26） ----
     默认进云端态：基址缺省为 CloudBase 云接入域名（parentHome/parentAdmin/adminAuth 三函数共用路由根）。
     优先级：① URL ?mode=local → 本地演示态（唯一进演示的入口，演示码 888888/TL2026 仅 local 可用）
             ② window.__PARENT_API_BASE__（部署注入，覆盖缺省基址）
             ③ URL ?api=<baseUrl>（调试用）
             ④ 缺省云端基址 DEFAULT_API_BASE。
     有基址 → 云端模式（POST <base>/parentHome）；仅显式 ?mode=local → 本地演示模式（零网络）。 */
  var DEFAULT_API_BASE='https://qingfan-parent-d6gloe72ka6ed4b27.service.tcloudbase.com';
  var API_BASE=DEFAULT_API_BASE;
  var MODE='cloud';
  (function(){
    var base='', forceLocal=false;
    if(typeof location!=='undefined'&&location.search){
      var q=String(location.search).replace(/^\?/,'').split('&');
      for(var i=0;i<q.length;i++){
        var kv=q[i].split('=');
        var k=decodeURIComponent(kv[0]||'');
        if(k==='mode'&&decodeURIComponent(kv[1]||'')==='local'){ forceLocal=true; }
        else if(k==='api'){ base=decodeURIComponent(kv[1]||''); }
      }
    }
    if(forceLocal){ MODE='local'; API_BASE=''; return; }   /* 演示态仅显式 ?mode=local */
    if(!base&&typeof window!=='undefined'&&window.__PARENT_API_BASE__){ base=String(window.__PARENT_API_BASE__); }
    if(base){ API_BASE=String(base).replace(/\/+$/,''); }
    MODE='cloud';
  })();
  /* 云接入三函数路由（同一路由根，路径区分函数）：parentHome=家长端数据面 / parentAdmin=管理端写入通道 / adminAuth=管理端鉴权 */
  var CLOUD_URLS={
    parentHome:(/\/parentHome$/.test(API_BASE)?API_BASE:API_BASE+'/parentHome'),
    parentAdmin:(/\/parentAdmin$/.test(API_BASE)?API_BASE:API_BASE+'/parentAdmin'),
    adminAuth:(/\/adminAuth$/.test(API_BASE)?API_BASE:API_BASE+'/adminAuth')
  };
  var READ_DELAY=0;        /* 读：本地即时 */
  var WRITE_DELAY=380;     /* 写/鉴权：给按钮 loading 态留出真实节奏 */
  var MEM={                /* 会话内存态（不落 localStorage：演示数据不入持久层） */
    logged:false, parent:null, bound:false, childId:null, boundPhone:null,
    voices:[], homeLetters:[], onboarded:false
  };

  function ok(data,delay){
    return new Promise(function(res){ setTimeout(function(){
      res({code:0,message:'OK',data:data,server_ts:Date.now()});
    },delay||READ_DELAY); });
  }
  function fail(code,message,delay){
    return new Promise(function(res){ setTimeout(function(){
      res({code:code,message:message,data:null,server_ts:Date.now()});
    },delay||READ_DELAY); });
  }
  function child(id){
    for(var i=0;i<SEED.children.length;i++){
      if(SEED.children[i].student_id===id){return SEED.children[i];}
    }
    return null;
  }
  function cur(){
    return child(MEM.childId)||SEED.children[0];
  }
  /* 家校本地桥接：读取学生端「让爸妈看到」写入同浏览器 localStorage 的作品表（yf_shared_works） */
  /* [2026-10-20] 同作用域桥接出口：作品详情页（YfData 闭包外）需要「种子+家校桥」的合并列表，
     否则 shPlayer 取不到学生端上传的作品。此处仅暴露只读列表，不新增 YfData 方法、不改契约。 */
  function mergedWorksList(){
    try{ return mergeSharedWorks(curChild().works.slice()); }catch(e){ return curChild().works||[]; }
  }

  function mergeSharedWorks(seed){
    try{
      var raw=localStorage['yf_shared_works'];
      if(!raw) return seed;
      var table=JSON.parse(raw);
      var shared=Array.isArray(table)?table:(table&&Array.isArray(table.works)?table.works:[]);
      shared.forEach(function(d){
        if(d&&d.type==='student_work'&&d.student_phone===(MEM.boundPhone||SEED.roster.student_phone)){
          if(!seed.some(function(s){return s.id===d.id;})) seed.push(d);
        }
      });
    }catch(e){}
    seed.sort(function(a,b){ return (b.created_at||0)-(a.created_at||0); });
    return seed;
  }

  /* 管理端本地桥接：读取「站点录入」（parent_admin.html）写入同浏览器 localStorage 的录入表（yf_shared_admin）
     - 不联网，仅供本地演示；云端模式由 CloudClient.adminXxx 经 parentHome action 拉取
     - 按 student_id 与 SEED 孩子对齐，同构 mergeSharedWorks / yf_shared_letters 的桥接语义
     - child 浅克隆（letters / checkins 数组一并克隆），避免污染 SEED 原始对象 */
  function mergeSharedAdmin(c){
    if(!c) return c;
    var cc=Object.assign({},c);
    cc.letters=(c.letters||[]).slice();
    cc.checkins=(c.checkins||[]).slice();
    try{
      var raw=localStorage['yf_shared_admin'];
      if(!raw) return cc;
      var table=JSON.parse(raw);
      var records=Array.isArray(table)?table:(table&&Array.isArray(table.records)?table.records:[]);
      records.forEach(function(rec){
        if(!rec||rec.student_id!==cc.student_id) return;
        var p=rec.payload||{};
        if(rec.type==='coach_note'){
          if(cc.letters.some(function(s){return s.id==='a_'+rec.created_at;})) return;  /* 按 id 去重 */
          cc.letters.unshift({id:'a_'+rec.created_at,type:'coach_note',author_name:p.author_name,time_txt:p.time_txt,content:p.content});
        }else if(rec.type==='checkin'){
          if(cc.checkins.some(function(s){return s.created_at===rec.created_at;})) return;  /* 按 created_at 去重 */
          cc.checkins.push({date:p.date,in_at:p.in_at,out_at:p.out_at,stay_minutes:p.stay_minutes,status:p.status,created_at:rec.created_at});
        }else if(rec.type==='goal_line'){
          if(p.value!==undefined&&p.value!==''){ cc.goal_line=p.value; }
        }
      });
    }catch(e){ /* JSON 损坏则忽略，仅展示种子数据 */ }
    return cc;
  }

  /* ---- 云端客户端：真实网络请求（POST 云函数 parentHome） ----
     - 与本地模式同一套函数签名，一律返回 Promise<信封>；
     - 调用点给位置实参，此处按 CLOUD_PARAMS 映射为契约字段名（与 backend/core/actions/*.js 一致）；
     - 后端信封 { code, message, data, server_ts } 原样透传，前端不做二次加工；
     - 网络异常 / 非 2xx / 非 JSON / 无 code → fail(50001,'网络异常，请稍后重试')；
     - action 白名单与 backend/core/constants.js ACTION 逐一对齐
       （docs / adminReviewVoice / listSites / parentReviewStudentLetter 为后端侧或管理端专用，家长端不直调；
        parentLetters 为家长端信笺聚合专用 action，学生归属服务端反查）。 */
  var CLOUD_ACTIONS=['sendCode','login','logout','me','bindByStudentPhone','bindByRoster',
                     'switchChild','setChild','home','works','growth','letters','checkins',
                     'voiceList','voiceSubmit','parentLetters','parentWriteLetter',
                     'adminCoach','adminCheckin','adminGoal'];
  var CLOUD_PARAMS={
    sendCode:['phone'],
    login:['phone','code'],
    logout:[],
    me:[],
    bindByStudentPhone:['studentPhone','code'],
    bindByRoster:['rosterCode'],
    switchChild:[],
    setChild:['studentId'],
    home:['studentId'],
    works:['studentId'],
    growth:['studentId'],
    letters:['studentId'],
    checkins:['studentId'],
    voiceList:['studentId'],
    voiceSubmit:['studentId','content','client_token'],
    parentLetters:[],              /* [上架改造] 学生归属服务端从家长登录态反查，不再传 studentPhone */
    parentWriteLetter:['studentId','content'],   /* [任务#7/#8] 家长写家信（先审后发） */
    adminCoach:['studentId','authorName','timeTxt','content'],
    adminCheckin:['studentId','date','inAt','outAt','stayMinutes','status'],
    adminGoal:['studentId','value']
  };
  var CloudClient=(function(){
    function netFail(){ return fail(50001,'网络异常，请稍后重试'); }
    function post(action,params){
      var body={action:action}, k;
      for(k in params){
        if(Object.prototype.hasOwnProperty.call(params,k)&&params[k]!==undefined&&params[k]!==null){
          body[k]=params[k];
        }
      }
      var init={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};
      function parse(res){
        if(!res||res.status<200||res.status>=300){ return netFail(); }
        return res.json().then(function(env){
          if(!env||typeof env.code==='undefined'){ return netFail(); }
          return env;                     /* 契约信封原样透传 */
        },function(){ return netFail(); });
      }
      var p;
      try{ p=fetch(CLOUD_URLS.parentHome,init); }
      catch(e){ return netFail(); }
      return p.then(parse,function(){ return netFail(); });
    }
    var api={};
    CLOUD_ACTIONS.forEach(function(name){
      var keys=CLOUD_PARAMS[name]||[];
      api[name]=function(){
        var args=arguments, params={};
        for(var i=0;i<keys.length;i++){ if(args[i]!==undefined){ params[keys[i]]=args[i]; } }
        return post(name,params);
      };
    });
    return api;
  })();

  return {
    /* 模式开关（预留）：'local' | 'cloud' */
    get mode(){ return MODE; },
    setMode:function(m){
      if(m!=='local'&&m!=='cloud'){throw new Error('YfData: 未知模式 '+m);}
      MODE=m; return MODE;
    },
    /* ---- 鉴权（O1：家长独立登录，不复用孩子账号） ---- */
    login:function(phone,code){
      if(MODE==='cloud'){return CloudClient.login(phone,code);}
      if(!/^1\d{10}$/.test(String(phone||''))){return fail(42201,'请输入 11 位手机号',WRITE_DELAY);}
      if(String(code||'')!==SEED.roster.sms_code){return fail(42203,'验证码不正确，请重新输入',WRITE_DELAY);}
      MEM.logged=true; MEM.parent=SEED.parent;
      return ok({parent:SEED.parent,bound:MEM.bound},WRITE_DELAY);
    },
    sendCode:function(phone){
      if(MODE==='cloud'){return CloudClient.sendCode(phone);}
      if(!/^1\d{10}$/.test(String(phone||''))){return fail(42201,'请输入 11 位手机号',200);}
      return ok({sent:true,ttl:60},WRITE_DELAY);
    },
    logout:function(){
      if(MODE==='cloud'){return CloudClient.logout();}
      MEM.logged=false; MEM.parent=null; MEM.bound=false; MEM.childId=null;
      MEM.voices=[]; MEM.homeLetters=[]; MEM.onboarded=false;
      return ok({});
    },
    /* ---- 身份 / 绑定（O2c：T2 学生手机号 + T3 站点名单核准，T1 已移除） ---- */
    me:function(){
      if(MODE==='cloud'){return CloudClient.me();}
      if(!MEM.logged){return fail(40101,'未登录',READ_DELAY);}
      if(!MEM.bound){return fail(40301,'尚未绑定孩子',READ_DELAY);}
      return ok({parent:MEM.parent,children:SEED.children},READ_DELAY);
    },
    bindByStudentPhone:function(studentPhone,code){
      if(MODE==='cloud'){return CloudClient.bindByStudentPhone(studentPhone,code);}
      if(!/^1\d{10}$/.test(String(studentPhone||''))){return fail(42201,'请输入 11 位学生手机号',WRITE_DELAY);}
      if(String(studentPhone)!==SEED.roster.student_phone){
        return fail(40301,'手机号与登记不一致，请联系项目负责人',WRITE_DELAY);
      }
      if(String(code||'')!==SEED.roster.sms_code){
        return fail(42203,'验证码不正确，请重新输入',WRITE_DELAY);
      }
      MEM.bound=true; MEM.childId=SEED.children[0].student_id; MEM.boundPhone=studentPhone;
      return ok({verify_channel:'student_phone',status:'active',student_id:MEM.childId},WRITE_DELAY);
    },
    bindByRoster:function(rosterCode){
      if(MODE==='cloud'){return CloudClient.bindByRoster(rosterCode);}
      if(!String(rosterCode||'').trim()){return fail(42201,'请输入项目负责人提供的核准码',WRITE_DELAY);}
      if(String(rosterCode).trim().toUpperCase()!==SEED.roster.roster_code){
        return fail(40301,'核准码无效，请向项目负责人确认后重试',WRITE_DELAY);
      }
      MEM.bound=true; MEM.childId=SEED.children[0].student_id;
      return ok({verify_channel:'site_roster',status:'active',student_id:MEM.childId},WRITE_DELAY);
    },
    /* ---- 孩子清单 / 切换 ---- */
    switchChild:function(){
      if(MODE==='cloud'){return CloudClient.switchChild();}
      if(!MEM.bound){return fail(40301,'尚未绑定孩子',READ_DELAY);}
      return ok({children:SEED.children.map(function(c){
        return {student_id:c.student_id,name:c.name,avatar_text:c.avatar_text,
                relation_txt:c.relation_txt,site_name:c.site_name};
      })},READ_DELAY);
    },
    setChild:function(id){
      if(MODE==='cloud'){return CloudClient.setChild(id);}
      if(!child(id)){return fail(40401,'该学员信息不存在',READ_DELAY);}
      MEM.childId=id;
      return ok({student_id:id},READ_DELAY);
    },
    currentId:function(){ return MEM.childId||SEED.children[0].student_id; },
    /* ---- 聚合视图（与 parentHome 的 action 一一对应） ---- */
    home:function(id){
      if(MODE==='cloud'){return CloudClient.home(id);}
      var c=mergeSharedAdmin(child(id||MEM.childId));
      if(!c){return fail(40401,'该学员信息不存在',READ_DELAY);}
      var coach=c.letters.filter(function(l){return l.type==='coach_note';})[0]||null;
      return ok({
        student:{id:c.student_id,name:c.name,avatar_text:c.avatar_text,school:c.school,
                 grade:c.grade,site_name:c.site_name,batch:c.batch,points_level:c.points_level},
        today:c.today, metrics:{days_total:c.program_days,days_done:c.checkins.length,
                 days_left:c.program_days-c.checkins.length},
        today_list:c.today_list,
        recentCoach:coach, recentWorks:mergeSharedWorks(c.works.slice()).slice(0,2), worksCount:mergeSharedWorks(c.works.slice()).length,
        checkins:c.checkins, curve:c.curve, goal_line:c.goal_line
      },READ_DELAY);
    },
    works:function(id){
      if(MODE==='cloud'){return CloudClient.works(id);}
      var c=child(id||MEM.childId);
      if(!c){return fail(40401,'该学员信息不存在',READ_DELAY);}
      /* [端到端修复 2026-10-20] 原先此处直接返回 c.works，漏了家校桥合并 ⇒
         学生端新上传的作品只在今日屏（recentWorks 走了 merge）可见，作品屏看不到。
         现与 home() 同构：works / recentWorks / worksCount 三处口径一致。 */
      return ok({works:mergeSharedWorks(c.works.slice())},READ_DELAY);
    },
    growth:function(id){
      if(MODE==='cloud'){return CloudClient.growth(id);}
      var c=mergeSharedAdmin(child(id||MEM.childId));
      if(!c){return fail(40401,'该学员信息不存在',READ_DELAY);}
      return ok({curve:c.curve,checkins:c.checkins,milestones:c.milestones,
                 works:c.works,goal_line:c.goal_line,
                 report:{title:'结营实践报告',desc:'结营后生成'}},READ_DELAY);
    },
    letters:function(id){
      if(MODE==='cloud'){
        /* [上架改造 2026-10-26] 云端：parentLetters 聚合 action（服务端按家长 uid 反查链接学生）。
           返回 {coachNotes:[family_letter 形状的教练捎话], studentLetters:[... status 透出]}，
           前端合并为 letters 列表（type 分流：coach_note → 捎话卡，family_letter → 信笺信封）。 */
        return CloudClient.parentLetters().then(function(env){
          if(!env||env.code!==0||!env.data){ return ok({letters:[]}); }
          var notes=Array.isArray(env.data.coachNotes)?env.data.coachNotes:[];
          var studs=Array.isArray(env.data.studentLetters)?env.data.studentLetters:[];
          var arr=[];
          notes.forEach(function(d){ if(d&&d.type==='coach_note'){ arr.push(d); } });
          studs.forEach(function(d){
            if(!d){ return; }
            var item=Object.assign({},d,{type:'family_letter'});
            if(!Array.isArray(item.lines)||!item.lines.length){
              item.lines=item.content?String(item.content).split(/\n+/).filter(Boolean):[];
            }
            arr.push(item);
          });
          return ok({letters:arr});
        });
      }
      var c=child(id||MEM.childId);
      if(!c){return fail(40401,'该学员信息不存在',READ_DELAY);}
      var seed=c.letters.slice();
      /* 管理端本地桥接：并入「站点录入」的教练捎话（coach_note），按 student_id 过滤，与家书桥接并列 */
      try{
        var araw=localStorage['yf_shared_admin'];
        if(araw){
          var atable=JSON.parse(araw);
          var arecords=Array.isArray(atable)?atable:(atable&&Array.isArray(atable.records)?atable.records:[]);
          arecords.forEach(function(rec){
            if(!rec||rec.type!=='coach_note'||rec.student_id!==c.student_id) return;
            var ap=rec.payload||{};
            if(seed.some(function(s){return s.id==='a_'+rec.created_at;})) return;  /* 按 id 去重 */
            seed.push({id:'a_'+rec.created_at,type:'coach_note',author_name:ap.author_name,time_txt:ap.time_txt,content:ap.content});
          });
        }
      }catch(e){ /* JSON 损坏则忽略，仅展示种子数据 */ }
      /* 家校本地桥接：读取学生端写入同浏览器 localStorage 的家书表（yf_shared_letters） */
      try{
        var raw=localStorage['yf_shared_letters'];
        if(raw){
          var table=JSON.parse(raw);
          var shared=Array.isArray(table)?table:(table&&Array.isArray(table.letters)?table.letters:[]);
          shared.forEach(function(d){
            if(d&&d.type==='family_letter'&&d.student_phone===(MEM.boundPhone||SEED.roster.student_phone)){
              if(seed.some(function(s){return s.id===d.id;})){return;}   /* 按 id 去重 */
              seed.push(d.lines?d:Object.assign({},d,{lines:[]}));
            }
          });
        }
      }catch(e){ /* JSON 损坏则忽略，仅展示种子数据 */ }
      /* 最新写的家书排前面：按 created_at 倒序，种子无时间戳排末尾，确保学生新写的信在信笺信封里顶替旧种子 */
      seed.sort(function(a,b){ return (b.created_at||0)-(a.created_at||0); });
      return ok({letters:seed},READ_DELAY);
    },
    checkins:function(id){
      if(MODE==='cloud'){return CloudClient.checkins(id);}
      var c=mergeSharedAdmin(child(id||MEM.childId));
      if(!c){return fail(40401,'该学员信息不存在',READ_DELAY);}
      return ok({checkins:c.checkins},READ_DELAY);
    },
    /* ---- 站点公告（打通契约 §3.1-C：云端复用 home 的 announcements[] 预留位，零新 action） ---- */
    announces:function(id){
      if(MODE==='cloud'){
        return CloudClient.home(id).then(function(env){
          if(env&&env.code===0&&env.data&&Array.isArray(env.data.announcements)){
            return ok({announcements:env.data.announcements});
          }
          return ok({announcements:[]});
        });
      }
      return ok({announcements:SEED.announcements.slice()},READ_DELAY);
    },
    /* ---- 留声墙（唯一写入通道 · 先审后发 · 80 字上限 · 仅自己可见） ---- */
    voiceList:function(id){
      if(MODE==='cloud'){return CloudClient.voiceList(id);}
      return ok({voices:MEM.voices.slice()},READ_DELAY);
    },
    voiceSubmit:function(id,content){
      if(MODE==='cloud'){return CloudClient.voiceSubmit(id,content);}
      var txt=String(content||'').trim();
      if(!String(txt||'').trim()){return fail(42204,'请先写下想说的话',200);}
      if(Array.from(txt).length>80){return fail(42206,'超过 80 字上限',200);}
      var v={id:'v_'+Date.now(),student_id:id||MEM.childId,content:txt,
             status:'pending',is_mine:true,created_at:Date.now()};
      MEM.voices.unshift(v);
      return ok({status:'pending',id:v.id},WRITE_DELAY);
    },
    /* ---- [上架改造 #7/#8] 写家信（家长→孩子 · 先审后发 · 走 student_letters 契约） ---- */
    writeLetter:function(id,content){
      if(MODE==='cloud'){return CloudClient.parentWriteLetter(id,content);}
      var txt=String(content||'').trim();
      if(!txt){return fail(42204,'请先写下想说的话',WRITE_DELAY);}
      if(Array.from(txt).length>200){return fail(42206,'家书最长 200 字',WRITE_DELAY);}
      var d={id:'hl_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
             student_id:String(id||MEM.childId||''),studentId:String(id||MEM.childId||''),
             from:'parent',content:txt,lines:txt.split('\n'),
             title:'给爸爸妈妈',author_name:'家长',to_txt:'孩子',
             status:'pending',created_at:Date.now()};
      MEM.homeLetters.unshift(d);
      try{
        var raw=localStorage.getItem('yf_shared_home_letters');
        var arr=raw?JSON.parse(raw):[];
        if(!Array.isArray(arr)){arr=[];}
        arr.push(d);
        localStorage.setItem('yf_shared_home_letters',JSON.stringify(arr));
      }catch(e){}
      return ok({id:d.id,status:'pending'},WRITE_DELAY);
    },
    homeLetters:function(id){
      if(MODE==='cloud'){
        return CloudClient.parentLetters().then(function(env){
          if(!env||env.code!==0||!env.data){return ok({letters:[]});}
          var studs=Array.isArray(env.data.studentLetters)?env.data.studentLetters:[];
          return ok({letters:studs.filter(function(d){return d&&d.from==='parent';})});
        });
      }
      var want=String(id||MEM.childId||''), arr=(MEM.homeLetters||[]).slice();
      try{
        var raw=localStorage.getItem('yf_shared_home_letters');
        if(raw){
          var table=JSON.parse(raw);
          (Array.isArray(table)?table:[]).forEach(function(d){
            if(d&&d.from==='parent'&&String(d.student_id)===want&&
               !arr.some(function(x){return x.id===d.id;})){arr.push(d);}
          });
        }
      }catch(e){}
      arr.sort(function(a,b){return (b.created_at||0)-(a.created_at||0);});
      return ok({letters:arr},READ_DELAY);
    },
    /* 演示专用（仅本地模式）：模拟站点负责人审核通过最新一封待审家信 */
    reviewHomeLetter:function(){
      if(MODE!=='local'){return fail(40302,'仅本地演示模式可用',200);}
      var pending=null;
      for(var i=0;i<MEM.homeLetters.length;i++){ if(MEM.homeLetters[i].status==='pending'){pending=MEM.homeLetters[i];break;} }
      try{
        var raw=localStorage.getItem('yf_shared_home_letters');
        if(raw){
          var arr=JSON.parse(raw);
          if(Array.isArray(arr)){
            for(var j=arr.length-1;j>=0;j--){
              if(arr[j]&&arr[j].from==='parent'&&arr[j].status==='pending'){pending=arr[j];break;}
            }
          }
        }
      }catch(e){}
      if(!pending){return fail(42201,'没有待审核的家信',200);}
      pending.status='approved'; pending.reviewed_at=Date.now();
      try{
        var raw2=localStorage.getItem('yf_shared_home_letters');
        if(raw2){
          var arr2=JSON.parse(raw2);
          if(Array.isArray(arr2)){
            arr2.forEach(function(d){ if(d&&d.id===pending.id){d.status='approved';d.reviewed_at=pending.reviewed_at;} });
            localStorage.setItem('yf_shared_home_letters',JSON.stringify(arr2));
          }
        }
      }catch(e){}
      return ok({id:pending.id,status:'approved'},200);
    },
    /* ---- 演示专用（不属云函数契约） ---- */
    reviewVoice:function(voiceId,status){
      for(var i=0;i<MEM.voices.length;i++){
        if(MEM.voices[i].id===voiceId){MEM.voices[i].status=status;}
      }
      return ok({},200);
    },
    markOnboarded:function(){ MEM.onboarded=true; return ok({}); },
    isOnboarded:function(){ return MEM.onboarded; },
    isBound:function(){ return MEM.bound; },
    reset:function(){
      MEM.logged=false;MEM.parent=null;MEM.bound=false;MEM.childId=null;
      MEM.voices=[];MEM.homeLetters=[];MEM.onboarded=false;
      return ok({});
    },
    seed:SEED
  };
})();

/* ---- 成长曲线：由 curve 数据点生成（无数据点即为空态，不画假线） ---- */
function curveSVG(points,target){
  if(!points||!points.length){return '';}
  var W=320,H=142,padL=26,padR=16,padT=20,padB=30;
  var iw=W-padL-padR, ih=H-padT-padB, maxH=6;
  var X=function(i){return padL+iw*(i/(points.length-1));};
  var Y=function(v){return padT+ih*(1-v/maxH);};
  var done=[],future=[];
  points.forEach(function(p,i){ (p.done&&p.hours!=null)?done.push({x:X(i),y:Y(p.hours),v:p.hours,i:i})
                                                   :future.push({x:X(i),y:Y(0),i:i}); });
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="每日实践时长曲线：已记录 '+done.length+' 天，目标每天 '+target+' 小时">';
  [0,3,6].forEach(function(v){
    s+='<line class="gl" x1="'+padL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(v).toFixed(1)+'"/>';
    s+='<text class="gl-t" x="'+(padL-7)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end">'+v+'h</text>';
  });
  if(target){
    s+='<line class="gl-target" x1="'+padL+'" y1="'+Y(target).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(target).toFixed(1)+'"/>';
    s+='<text class="gl-t" x="'+(W-padR)+'" y="'+(Y(target)-4).toFixed(1)+'" text-anchor="end">目标 '+target+'h</text>';
  }
  if(done.length>1){
    s+='<path class="ln" d="M'+done.map(function(p){return p.x.toFixed(1)+' '+p.y.toFixed(1);}).join(' L ')+'"/>';
  }
  done.forEach(function(p){
    s+='<circle class="pt" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4"/>';
    s+='<text class="vl" x="'+p.x.toFixed(1)+'" y="'+(p.y-9).toFixed(1)+'" text-anchor="middle">'+p.v+'</text>';
  });
  future.forEach(function(p){
    s+='<circle class="pt future" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.6"/>';
  });
  if(done.length&&future.length){
    var last=done[done.length-1], nxt=future[0];
    s+='<path class="ln-future" d="M'+last.x.toFixed(1)+' '+last.y.toFixed(1)+' L '+nxt.x.toFixed(1)+' '+nxt.y.toFixed(1)+'"/>';
  }
  points.forEach(function(p,i){
    s+='<text class="xl" x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">第 '+p.day+' 天</text>';
  });
  return s+'</svg>';
}

/* [2026-10-20] 主作用域的「种子 + 家校桥」作品列表（作品详情页用）。
   YfData 内部的 mergeSharedWorks 在闭包里不可见，故此处按同构语义独立实现：
   读 localStorage['yf_shared_works'] → 过滤 type='student_work' 且手机号匹配 → 去重 → created_at 倒序。 */
function mergedWorksList(){
  var c=curChild(), list=(c&&c.works)?c.works.slice():[];
  try{
    var raw=localStorage.getItem('yf_shared_works');
    if(raw){
      var t=JSON.parse(raw), arr=Array.isArray(t)?t:((t&&t.works)||[]);
      var phone=(SEED.roster&&SEED.roster.student_phone)||'';
      arr.forEach(function(d){
        if(d&&d.type==='student_work'&&d.student_phone===phone&&
           !list.some(function(x){return x.id===d.id;})) list.push(d);
      });
      list.sort(function(a,b){return (b.created_at||0)-(a.created_at||0);});
    }
  }catch(e){}
  return list;
}

function screenKey(){ return State.phase==='app'?State.route:State.phase; }

function mount(){
  var key=screenKey(), def=SCR[key]||SCR.today;
  var host=$('#screens');
  host.innerHTML='<section class="scr'+(def.paper?' is-paper':'')+'" data-scr="'+key+'" data-tab="'+def.tab+
    '" aria-label="'+(key==='letter'?'信笺':key)+'">'+def.html()+'</section>';
  var node=host.firstChild;
  requestAnimationFrame(function(){ node.classList.add('active'); });
  var app=$('#app');
  app.classList.remove('settled');
  clearTimeout(settleTimer);
  settleTimer=setTimeout(function(){ app.classList.add('settled'); applyDonut(document,false); },1200);
  applyDonut(node,true);
  var sc=$('.screen',node); if(sc){ sc.scrollTop=0; }
}

function applyDonut(scope,animate){
  $$('[data-donut]',scope).forEach(function(el){
    var p=parseInt(el.getAttribute('data-donut'),10)||0;
    var off=(201*(1-p/100)).toFixed(1);
    if(animate){ setTimeout(function(){ el.style.strokeDashoffset=off; },260); }
    else { el.style.strokeDashoffset=off; }
  });
}

function hasData(route){
  if(route==='me') return !!V.voices;
  if(route==='home'||route==='profile'||route==='contact') return !!V.home;
  if(route==='report') return !!V.growth;
  return !!V[route];
}

function loadRoute(route){
  var id=YfData.currentId();
  var jobs=[YfData.home(id).then(function(r){ if(r.code===0){V.home=r.data;} }),
            YfData.announces(id).then(function(r){ if(r.code===0){V.announces=(r.data&&r.data.announcements)||[];} })];
  if(route==='works'){ jobs.push(YfData.works(id).then(function(r){ if(r.code===0){V.works=r.data.works;} })); }
  if(route==='growth'||route==='report'){ jobs.push(YfData.growth(id).then(function(r){ if(r.code===0){V.growth=r.data;} })); }
  if(route==='letter'){ jobs.push(YfData.letters(id).then(function(r){ if(r.code===0){V.letters=r.data.letters;} })); }
  if(route==='me'){ jobs.push(YfData.voiceList(id).then(function(r){ if(r.code===0){V.voices=r.data.voices;} })); }
  return Promise.all(jobs);
}

function go(route){
  State.phase='app'; State.route=route;
  clearPlay();
  if(hasData(route)){ mount(); loadRoute(route); return Promise.resolve(); }
  mount();                                  /* 无缓存：先渲染 loading 态，数据到达后重挂 */
  return loadRoute(route).then(function(){ mount(); });
}

function enterApp(){
  if(!YfData.isOnboarded()){ State.phase='onboard'; mount(); return; }
  var r=(State.route==='works'||State.route==='growth'||State.route==='letter'||State.route==='me')?State.route:'today';
  return go(r);
}

var SHEET_IDS=['sheet-player','sheet-voice','sheet-homeletter','sheet-child','sheet-kid','sheet-demo','sheet-confirm','sheet-tip'];
function ensureSheet(id){
  var el=document.getElementById(id);
  if(!el){
    el=document.createElement('div');
    el.className='sheet-wrap'; el.id=id;
    el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
    $('#app').insertBefore(el,$('#toast'));
  }
  return el;
}
function renderSheet(id){
  var el=ensureSheet(id), html='';
  if(id==='sheet-player'){ html=shPlayer(); }
  else if(id==='sheet-voice'){ html=shVoice(); }
  else if(id==='sheet-homeletter'){ html=shHomeLetter(); }
  else if(id==='sheet-child'){ html=shChild(); }
  else if(id==='sheet-kid'){ html=shKid(); }
  else if(id==='sheet-demo'){ html=shDemo(); }
  else if(id==='sheet-confirm'){ html=shConfirm(TIP.confirmText); }
  else if(id==='sheet-tip'){ html=TIP.html; }

function openSheet(id){
  /* 演示控制面板仅本地模式可见：云端模式无任何演示口令/演示入口 */
  if(id==='sheet-demo'&&YfData.mode!=='local'){ return; }
  SHEET_IDS.forEach(function(x){
    var n=document.getElementById(x);
    if(n&&x!==id){ n.classList.remove('open'); n.innerHTML=''; }
  });
  var el=renderSheet(id);
  el.classList.add('open');
  var b=$('.sheet-body',el); if(b){ b.scrollTop=0; }
  lastFocus=document.activeElement;
  var c=$('.sheet-head .icon-btn',el); if(c){ try{c.focus();}catch(e){} }

function closeSheet(id){
  var el=document.getElementById(id);
  if(el){ el.classList.remove('open'); el.innerHTML=''; }
  if(id==='sheet-player'){ clearPlay(); }
  if(lastFocus&&lastFocus.focus){ try{lastFocus.focus();}catch(e){} }

function closeAllSheets(){
  SHEET_IDS.forEach(function(id){

document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.shiftKey&&(e.key==='D'||e.key==='d')){ e.preventDefault(); openSheet('sheet-demo'); return; }
  if(e.key==='Escape'){ closeAllSheets(); return; }
  if(e.key!=='Enter'||!e.target||e.target.tagName!=='INPUT'){ return; }
  var m=e.target.getAttribute('data-model')||'';
  if(m==='login.phone'){ doLoginSend(); }
  else if(m==='login.code'){ doLoginSubmit(e.target); }
  else if(m==='bind.phone'){ doBindSend(); }
  else if(m==='bind.code'||m==='bind.roster'){ doBindSubmit(e.target); }
});

  },
  dialog:function(){
    var d=document.querySelector('.sheet-wrap.open');
    if(!d){ return null; }
    var sc=d.querySelector('.sheet-scrim');
    var sh=d.querySelector('.sheet');
    return {scrim:!!sc,sheet:!!sh,
            sheetWidth:sh?Math.round(sh.getBoundingClientRect().width):0,
            bodyText:(sh?sh.textContent:'').replace(/\s+/g,' ').slice(0,200)};
  },
  /* 自检：几何与溢出量测 */
  audit:function(){
    var app=$('#app'), w=innerWidth, out={width:w,scrollW:document.documentElement.scrollWidth,
      overflowX:document.documentElement.scrollWidth>w,clipped:[],emoji:0,extLinks:0,mode:YfData.mode,
      screen:screenKey(),sheetsOpen:SHEET_IDS.filter(function(id){var n=document.getElementById(id);return n&&n.classList.contains('open');}).length};
    $$('.scr.active *').forEach(function(el){
      if(el.children.length){ return; }
      if(el.namespaceURI&&el.namespaceURI.indexOf('svg')>=0){ return; }   /* SVG <text> 的 scrollWidth 无意义，排除误报 */
      if(el.tagName==='SVG'||el.tagName==='svg'){ return; }
      var t=(el.textContent||'').trim();
      if(!t){ return; }
      if(el.scrollWidth>el.clientWidth+1&&getComputedStyle(el).overflowX!=='auto'&&getComputedStyle(el).overflowX!=='scroll'){
        out.clipped.push({txt:t.slice(0,28),sw:el.scrollWidth,cw:el.clientWidth,cls:el.className});
      }
    });
    out.clipped=out.clipped.slice(0,8);
    out.env={};
    var chk=document.getElementById('openLetter');
    function R(e){ if(!e){return null;} var b=e.getBoundingClientRect();
      return {t:Math.round(b.top),b:Math.round(b.bottom),h:Math.round(b.height),l:Math.round(b.left),w:Math.round(b.width)}; }
    if(chk){
      var pp=document.querySelector('.env-stage .paper');
      out.env.checkbox=!!chk; out.env.checked=chk.checked;
      out.env.paperOpacity=pp?getComputedStyle(pp).opacity:null;
      out.env.paperPos=pp?getComputedStyle(pp).position:null;
      out.env.stageH=document.querySelector('.env-stage')?document.querySelector('.env-stage').style.height||getComputedStyle(document.querySelector('.env-stage')).height:null;
    }
    /* 信笺几何断言用：信纸必须完全落在「说明行之下」且「不高于滚动视口顶」 */
    var st=$('.env-stage'), pp2=$('.env-stage .paper'), note=$('.letter-note'), head=$('.letter-head'), sc=$('.scr.active .screen');
    var envb=$('.env-stage .env'), footb=$('.env-foot'), tb=$('.scr.active .tabbar');
    if(st&&pp2){
      out.envGeom={ stage:R(st), paper:R(pp2), note:R(note), head:R(head), viewport:R(sc),
        env:R(envb), foot:R(footb), tabbar:R(tb),
        paperTopVsNoteBottom: note?Math.round(pp2.getBoundingClientRect().top-note.getBoundingClientRect().bottom):null,
        paperTopVsViewportTop: sc?Math.round(pp2.getBoundingClientRect().top-sc.getBoundingClientRect().top):null,
        paperOverflowsStage: Math.round(pp2.getBoundingClientRect().height-st.getBoundingClientRect().height),
        envBottomVsTabbarTop: (envb&&tb)?Math.round(tb.getBoundingClientRect().top-envb.getBoundingClientRect().bottom):null,
        footBottomVsTabbarTop: (footb&&tb)?Math.round(tb.getBoundingClientRect().top-footb.getBoundingClientRect().bottom):null
      };
    } else { out.envGeom=null; }
    out.tabs=$$('.tabbar .tab').length;
    out.donut=$$('[data-donut]').map(function(e){return e.getAttribute('data-donut')+'@'+e.style.strokeDashoffset;});
    out.counts={sec:$$('.scr').length,fadeUp:$$('.fade-up').length};
    out.appHeight=app.getBoundingClientRect().height;
    return out;
  }
};

State.phase='login';
mount();
})();
</script>
<script id="yan-ui">
/* 颜好看 · v11 纯 UI 交互（独立脚本；不触碰既有 <script> / YfData / 登录绑定 / 信封 3D CSS） */
(function(){
  'use strict';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 收合头：滚动时给当前屏加 .is-scrolled（sticky-bar 背景由既有 CSS 保持不透明） */
  function bindScroll(scr){
    var sc = scr.querySelector('.screen');
    if(!sc) return;
    var onScroll = function(){
      if(sc.scrollTop > 8){ scr.classList.add('is-scrolled'); }
      else { scr.classList.remove('is-scrolled'); }
    };
    sc.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
  }

  /* 数字滚动计数：v12 去肿已删除（与「大数字收口」冲突，见家长端_去肿重设计方案.md §6） */

  var screens = document.getElementById('screens');
  if(screens){
    var mo = new MutationObserver(function(muts){
      Array.prototype.forEach.call(muts, function(m){
        if(m.type === 'childList'){
          Array.prototype.forEach.call(m.addedNodes, function(node){
            if(node.nodeType === 1 && node.classList && node.classList.contains('scr')){
              bindScroll(node);
            }
          });
        } else if(m.type === 'attributes' && m.attributeName === 'class'){
          if(m.target.classList && m.target.classList.contains('scr') && m.target.classList.contains('active')){
            bindScroll(m.target);
          }
        }
      });
    });
    mo.observe(screens, {childList:true, attributes:true, subtree:false, attributeFilter:['class']});
    var first = screens.querySelector('.scr');
    if(first){ bindScroll(first); }
  }
})();
</script>
