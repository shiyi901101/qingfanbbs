<!DOCTYPE html>
<html lang="zh-CN" data-theme="parent">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16324F">
<link rel="icon" href="icon-192.png">
<meta name="description" content="青帆社区 · 家长端 · 孩子的成长档案室 · 只读 · 仅您本人可见">
<title>青帆社区 · 家长端</title>
<style>
/* ============================================================
   青帆社区 · 家长端（可运行单文件应用）
   ------------------------------------------------------------
   基线：设计稿 v8（7 屏 · 深海军蓝 #16324F / 主操作 #1F5FA8 / 火漆 #8A2E2E + 金 #C9A85A）
   v8 Token 原样沿用，未改一个数值；本文件只在其上「加壳 + 加状态 + 加数据层」。

   [纪律] 青帆蓝 #00AEEC 仅 3 处：
          ① 顶部品牌标识（.brand-mark / .brand-lockup .bm-lg / .brand-flag / .auth-logo）
          ②「孩子端视角」入口（.btn-brand）
          ③ 功能图标底板（.tile .tile-ico，≤36px）
          边界：禁作主按钮填充 / 页面背景 / 卡片底色。
   火漆 #8a2e2e 是封蜡材质色，不计品牌锚点。
   手写体（--font-hand，楷体系）仅用于：信纸正文 / 抬头 / 落款 + 信封抬头。

   零外链 · 零 emoji · 零脚本外链 · 断网可用 · 320—414px 移动优先
   数据层：YfData（本地种子 / 云端同一函数签名预留）
   ============================================================ */
:root{
  /* ---------- A1-id 表面 ---------- */
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-sunken:#EDF1F6;
  --surface-tint:linear-gradient(180deg,#F7FAFD 0%,#FFFFFF 46%);
  --surface-tint-2:linear-gradient(180deg,#EFF5FB 0%,#FFFFFF 60%);
  /* ---------- 牛皮纸 / 信纸色系 ---------- */
  --paper-base:#f4f1ea;
  --paper-bg:linear-gradient(180deg,#f4f1ea,#ece6db);
  --kraft:#fdfaf2; --kraft-flap:#f2ead9; --kraft-line:#d8cbb2;
  --kraft-shadow:0 10px 24px rgba(80,60,30,.18);
  --ink-brown:#8a7a5c; --ink-brown-2:#9a8d74;
  /* ---------- 真实蜡红火漆（材质色，非品牌锚点） ---------- */
  --wax:#8a2e2e;
  --wax-lo:color-mix(in srgb,var(--wax) 66%,#3d0f0f);
  --wax-hi:color-mix(in srgb,var(--wax) 72%,#ffffff);
  --gold:#c9a85a; --gold-hi:#e8c98a;
  /* ---------- A1-id 前景 / 强调 / 边框 ---------- */
  --fg:#16324F; --muted:#5D6B78;
  --accent:#1F5FA8; --accent-hover:#1A5292; --accent-active:#16467D; --accent-on:#FFFFFF;
  --border:#DCE3EB;
  /* ---------- C-ext 品牌连接色（仅 3 处） ---------- */
  --brand-connect:#00AEEC;
  /* ---------- A2 语义色 ---------- */
  --success:#1F9D6B; --warn:#B58A3C; --danger:#C0504D;
  /* ---------- B-slot ---------- */
  --fg-2:var(--fg); --surface-warm:var(--surface-sunken); --meta:var(--muted); --border-soft:#EDF1F6;
  /* ---------- A1-str 字体（iOS 系统原生栈，零外链字体） ---------- */
  --font-display:-apple-system,"SF Pro SC","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --font-body:-apple-system,"SF Pro SC","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  --font-num:-apple-system,ui-monospace,"SF Mono","Menlo",monospace;
  /* 手写 / 楷体系 —— 仅信件正文 / 抬头 / 落款 + 信封抬头 */
  --font-hand:"Kaiti SC","STKaiti","KaiTi","楷体","simkai","KaiTi_GB2312",serif;
  /* ---------- A1-str 字号 ---------- */
  --text-xs:12px; --text-sm:13px; --text-base:14px; --text-lg:15px;
  --text-xl:16px; --text-2xl:18px; --text-3xl:20px; --text-4xl:23px; --text-5xl:27px;
  --w-read:400; --w-emph:500; --w-announce:600;
  --leading-body:1.50; --leading-tight:1.25; --tracking-body:0; --tracking-small:0.04em;
  --tracking-display:-0.02em; --tracking-caps:0.08em;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;
  --gap-sec:22px; --gap-card:12px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-pill:9999px;
  --container-max:430px;
  --elev-flat:none; --elev-ring:0 0 0 1px var(--border);
  --elev-raised:0 1px 2px rgba(22,50,79,0.04);
  --focus-ring:0 0 0 3px rgba(31,95,168,0.35);
  --motion-fast:120ms; --motion-base:150ms; --motion-slow:240ms; --motion-flip:560ms;
  --ease-standard:cubic-bezier(0.2,0,0,1); --ease-spring:cubic-bezier(0.34,1.32,0.42,1);
  --touch-min:44px; --icon-sm:16px; --icon-md:20px; --icon-lg:24px;
  /* ---------- v5「原生 APP 质感」 ---------- */
  --hairline:0 0 0 0.5px rgba(22,50,79,.055);
  --elev-soft:0 1px 2px rgba(22,50,79,.04), 0 6px 18px rgba(22,50,79,.055), 0 0 0 0.5px rgba(22,50,79,.045);
  --elev-card:0 1px 2px rgba(22,50,79,.05), 0 10px 26px rgba(22,50,79,.07), 0 0 0 0.5px rgba(22,50,79,.05);
  --glass-nav:rgba(244,246,249,.84);
  --glass-bar:rgba(255,255,255,.82);
  --blur-nav:blur(14px) saturate(170%);
  --blur-bar:blur(20px) saturate(180%);
  --home-bar:rgba(22,50,79,.32);
  --press:.985;
  --cover-ink:#2F73C0;
  --scene-panel:#C6E3FA;
  --scene-panel-2:#6CB3EC;
  --scene-sand:#E9A22E;
  --scene-kraft:#F7DC93;
  --tabbar-h:56px;
  --tabbar-inset:12px;
  --tabbar-bottom:calc(22px + env(safe-area-inset-bottom, 0px));
  /* 信笺舞台高度：v8 的固定 396px 是照 940px 高的演示机框定的。
     在真机 100dvh 上，396px 会把信封（210px）连同「点击信封」提示一起压到悬浮 TabBar 之下，
     信封底边看起来像被裁断。这里按视口高度自适应：
       ≥ 876px 高的屏幕 = v8 原值 396px；矮屏按需收缩，下限 240px（保住信封 + 提示的完整可见）。
     chrome 预算=480px：状态栏 + 顶栏 + 吸顶标题(letter) + 说明行 + 信封上方留白 + 悬浮 TabBar(56+22)
     在 320 窄屏上会被文字换行撑高，取 480 可保证「点击信封」提示底边仍高于 TabBar 顶边。
     定位模型（absolute + bottom:0）与 3D 翻转动画一个字未动；展开态几何另见下方修正块。 */
  --env-chrome:480px;
  --env-stage-h:clamp(240px, calc(100dvh - var(--env-chrome)), 396px);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:#E8ECF1;color:var(--fg);font-family:var(--font-body);
  font-size:var(--text-base);line-height:var(--leading-body);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums}
button{font-family:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ===================== 应用外壳（移动优先 · 单文件） ===================== */
body{display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;max-width:var(--container-max);height:100dvh;background:var(--bg);overflow:hidden;isolation:isolate}
.app::after{content:"";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:134px;height:5px;border-radius:100px;background:var(--home-bar);z-index:60;pointer-events:none;display:none}
@media (min-width:480px){
  body{padding:18px}
  .app{height:min(calc(100dvh - 36px),900px);border-radius:26px;border:1px solid var(--border);
    box-shadow:0 18px 48px rgba(22,50,79,.18), inset 0 0 0 .5px rgba(255,255,255,.6)}
  .app::after{display:block}
}
@media (max-width:340px){ .app{--space-4:14px} }

/* 屏容器（切换 = display + 轻微位移入场，不用 opacity 门控，无头渲染也可见） */
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:1}
.scr.active{display:flex;animation:scrIn 260ms var(--ease-standard)}
@keyframes scrIn{from{transform:translateY(6px)}to{transform:none}}
/* 信笺屏：机身承纸色。注意用 is-paper，不可用 .paper —— 会撞上信纸元素 .paper{opacity:0} */
.scr.is-paper{background:var(--paper-base)}

/* ===================== 真机状态栏（全内联 SVG） ===================== */
.device-status{flex:none;display:flex;align-items:center;
  padding:calc(var(--space-2) + env(safe-area-inset-top, 6px)) var(--space-5) var(--space-1);
  font-size:var(--text-sm);font-weight:var(--w-announce);color:var(--fg);background:transparent}
.device-status .ds-time{font-variant-numeric:tabular-nums;min-width:46px}
.device-status .ds-right{margin-left:auto;display:inline-flex;align-items:center;gap:5px}
.device-status .ds-ico{display:block}
.ds-signal{width:17px;height:11px}
.ds-wifi{width:15px;height:11px}
.ds-batt{width:25px;height:12px}
.scr.is-paper .device-status{color:var(--ink-brown)}

/* ===================== 屏内骨架 ===================== */
.appbar{flex:none;background:var(--surface);border-bottom:0.5px solid var(--border);
  padding:var(--space-2) var(--space-4);display:flex;align-items:center;gap:var(--space-2)}
.appbar .brand-mark{width:20px;height:20px;flex:none;color:var(--brand-connect)}   /* 青帆蓝锚点 1 */
.appbar .brand-txt{font-size:var(--text-xs);color:var(--muted);letter-spacing:var(--tracking-small)}
.appbar .page-title{margin-left:auto;font-size:var(--text-lg);font-weight:var(--w-announce);color:var(--fg)}
.appbar.letter{background:var(--paper-base);border-bottom:0.5px solid var(--kraft-line)}
.appbar.letter .brand-txt,.appbar.letter .page-title{color:var(--ink-brown)}
.appbar.detail{gap:var(--space-2);padding:var(--space-2) var(--space-3)}
.appbar.detail .detail-title{flex:1;text-align:center;font-size:var(--text-lg);
  font-weight:var(--w-announce);color:var(--fg);letter-spacing:var(--tracking-display)}
.brand-hot{display:inline-flex;align-items:center;gap:var(--space-2);min-height:36px;border-radius:var(--radius-sm);
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.icon-btn{width:var(--touch-min);height:var(--touch-min);flex:none;display:inline-flex;align-items:center;justify-content:center;
  background:none;border:0;color:var(--accent);cursor:pointer;border-radius:var(--radius-pill);font-family:inherit;
  transition:background var(--motion-base) var(--ease-standard),transform var(--motion-fast) var(--ease-standard)}
.icon-btn svg{width:var(--icon-lg);height:var(--icon-lg)}
.icon-btn:active{background:var(--surface-sunken);transform:scale(.94)}
.appbar.has-back{gap:var(--space-1);padding-left:var(--space-2)}

/* 当前孩子胶囊（多孩子切换 · 支撑首屏「这是谁的？」判断） */
.child-pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 10px 3px 4px;
  border-radius:var(--radius-pill);background:var(--surface-sunken);border:.5px solid var(--border);
  color:var(--fg);font-size:var(--text-xs);font-weight:var(--w-emph);cursor:pointer;
  transition:background var(--motion-base) var(--ease-standard),transform var(--motion-fast) var(--ease-standard)}
.child-pill:active{transform:scale(.96)}
.child-pill .av{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);font-size:11px;font-weight:var(--w-announce)}
.child-pill .cv{width:12px;height:12px;color:var(--muted)}
.appbar.letter .child-pill{background:rgba(216,203,178,.28);border-color:var(--kraft-line);color:var(--ink-brown)}
.appbar.letter .child-pill .av{background:rgba(255,255,255,.6);color:var(--ink-brown)}

/* 业务提示条 */
.statusbar{flex:none;display:flex;align-items:center;gap:var(--space-2);
  padding:var(--space-2) var(--space-4);background:rgba(181,138,60,.09);color:var(--fg);font-size:var(--text-sm);min-height:38px}
.statusbar.ok{background:rgba(31,157,107,.09)}
.statusbar.warn{background:rgba(181,138,60,.12)}
.statusbar .dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex:none}
.statusbar .dot.warn{background:var(--warn)}
.statusbar .spacer{margin-left:auto;color:var(--accent);font-size:var(--text-sm);background:none;border:0;cursor:pointer;font-family:inherit}

.screen{flex:1;overflow-y:auto;padding:0 var(--space-4) calc(var(--tabbar-h) + var(--tabbar-bottom) + 16px);overscroll-behavior:contain}
.screen::-webkit-scrollbar{width:0}
.screen.letter{background:var(--paper-bg)}
.scr[data-tab="0"] .screen{padding-bottom:calc(var(--space-8) + env(safe-area-inset-bottom,0px))}

/* ===================== Large Title 吸顶条 ===================== */
.sticky-bar{position:sticky;top:0;z-index:5;
  margin:0 calc(-1 * var(--space-4)) var(--space-3);padding:var(--space-2) var(--space-4) var(--space-3);
  background:var(--surface);
  box-shadow:0 0.5px 0 rgba(22,50,79,.07)}
.sticky-bar h1{font-size:var(--text-3xl);font-weight:var(--w-announce);line-height:1.15;
  letter-spacing:-0.02em;color:var(--fg)}
.sticky-bar .sb-note{font-size:var(--text-xs);color:var(--muted);margin-top:2px}
.sticky-bar.letter{background:linear-gradient(180deg,#f6f3ec,#efe9dd);box-shadow:0 0.5px 0 rgba(216,203,178,.7)}
.sticky-bar.letter h1{color:var(--ink-brown)}
.sticky-bar.letter .sb-note{color:var(--ink-brown-2)}

.sec{margin-bottom:var(--gap-sec)}
.sec:last-child{margin-bottom:0}
.sec-head{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.sec-head h2{font-size:var(--text-lg);font-weight:var(--w-announce);color:var(--fg);letter-spacing:var(--tracking-display)}
.sec-head .more{margin-left:auto;color:var(--accent);font-size:var(--text-sm);font-weight:var(--w-emph);
  display:inline-flex;align-items:center;gap:2px;background:none;border:0;font-family:inherit;cursor:pointer}
.sec-head .more:active{transform:translateY(1px)}

/* ===================== 卡片 ===================== */
.card{background:var(--surface);border-radius:var(--radius-lg);
  padding:var(--space-4);box-shadow:var(--elev-card);position:relative;overflow:hidden;
  transition:transform var(--motion-fast) var(--ease-standard),filter var(--motion-fast) var(--ease-standard)}
.card:active{transform:scale(var(--press));filter:brightness(.985)}
.card.tinted{background:var(--surface-tint)}
.card + .card{margin-top:var(--gap-card)}
.card.rule::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 30%,transparent))}
.card.plain{box-shadow:var(--elev-soft)}
.card.plain:active{transform:none;filter:none}

.hero-card{background:var(--surface-tint-2);border-radius:var(--radius-lg);
  padding:var(--space-4) var(--space-5) var(--space-5);position:relative;overflow:hidden;
  box-shadow:var(--elev-card);
  transition:transform var(--motion-fast) var(--ease-standard),filter var(--motion-fast) var(--ease-standard)}
.hero-card:active{transform:scale(var(--press));filter:brightness(.985)}
.hero-card::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(31,95,168,.10),transparent 68%);pointer-events:none}
.hero-top{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);flex-wrap:wrap}
.hero-num{display:flex;align-items:baseline;gap:var(--space-1)}
.hero-num b{font-family:var(--font-num);font-size:var(--text-5xl);font-weight:var(--w-announce);
  line-height:1;color:var(--fg);letter-spacing:var(--tracking-display)}
.hero-num span{font-size:var(--text-lg);font-weight:var(--w-emph);color:var(--muted)}
.hero-body{display:flex;align-items:center;gap:var(--space-4);margin-top:var(--space-3)}
.hero-sub{font-size:var(--text-sm);color:var(--muted);margin-top:var(--space-1)}

.donut{width:80px;height:80px;flex:none;position:relative}
.donut svg{width:80px;height:80px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:7}
.donut .trk{stroke:var(--surface-sunken)}
/* 目标环：终值由 JS 按数据算好后写进 inline style，用 transition 收口
   —— 不用 @keyframes 固定终值（多个孩子的完成率不同），也不做 opacity 门控 */
.donut .val{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201;
  transition:stroke-dashoffset 1180ms var(--ease-standard) 260ms}
.donut .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .lab b{font-family:var(--font-num);font-size:var(--text-lg);font-weight:var(--w-announce);color:var(--fg);line-height:1}
.donut .lab span{font-size:var(--text-xs);color:var(--muted);margin-top:1px}

.axis{margin-top:var(--space-4);position:relative}
.axis .rail{position:absolute;left:11px;top:12px;bottom:12px;width:2px;background:var(--border);border-radius:2px;overflow:hidden}
.axis .rail i{position:absolute;inset:0;background:var(--accent);transform-origin:top;
  transform:scaleY(0);animation:railgrow 900ms var(--ease-standard) 320ms forwards}
@keyframes railgrow{to{transform:scaleY(1)}}
.axis .step{display:flex;align-items:center;gap:var(--space-3);position:relative;padding:6px 0}
.axis .step .tick{width:24px;height:24px;flex:none;border-radius:50%;background:var(--surface);
  border:2px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:var(--accent)}
.axis .step .tick svg{width:13px;height:13px;opacity:0;transform:scale(.4);
  transition:opacity var(--motion-base) var(--ease-standard),transform var(--motion-slow) var(--ease-spring)}
.axis .step.done .tick{border-color:var(--accent)}
.axis .step .st b{font-family:var(--font-num);font-size:var(--text-base);font-weight:var(--w-emph);color:var(--fg)}
.axis .step .st span{font-size:var(--text-sm);color:var(--muted);margin-left:var(--space-2)}
@keyframes tickpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.anim-done-1{animation:tickpop 420ms var(--ease-spring) 620ms both}
.anim-done-2{animation:tickpop 420ms var(--ease-spring) 780ms both}
.anim-done-3{animation:tickpop 420ms var(--ease-spring) 940ms both}
.anim-done-1 .tick svg,.anim-done-2 .tick svg,.anim-done-3 .tick svg{opacity:1;transform:scale(1)}
.anim-done-1 .tick,.anim-done-2 .tick,.anim-done-3 .tick{border-color:var(--accent)}

.bar{height:8px;border-radius:var(--radius-pill);background:var(--surface-sunken);overflow:hidden;margin-top:var(--space-2)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-pill);
  transform-origin:left;animation:bargrow 1000ms var(--ease-standard) 300ms both}
@keyframes bargrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:var(--w-emph);
  border-radius:var(--radius-pill);padding:3px 10px;border:0.5px solid transparent}
.pill.ok{color:var(--success);border-color:var(--success)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.danger{color:var(--danger);border-color:var(--danger)}
.pill.info{color:var(--muted);border-color:var(--border);background:var(--surface-sunken)}
.pill.gold{color:var(--wax);border-color:var(--gold);background:rgba(201,168,90,.12)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.live .d{animation:breathe 1800ms var(--ease-standard) infinite}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}

.list{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--elev-soft)}
.li{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);
  min-height:var(--touch-min);border-bottom:0.5px solid var(--border-soft);
  transition:background var(--motion-base) var(--ease-standard)}
.li:last-child{border-bottom:0}

.quote{background:var(--surface-sunken);border-left:3px solid var(--accent);

.metrics{display:flex;border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);box-shadow:var(--elev-soft)}

.metric:last-child{border-right:0}
.metric b{display:block;font-family:var(--font-num);font-size:var(--text-xl);font-weight:var(--w-announce);color:var(--fg);line-height:1.1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);

             box-shadow var(--motion-base) var(--ease-standard),border-color var(--motion-base) var(--ease-standard),
             color var(--motion-base) var(--ease-standard)}

.btn-primary{background:var(--accent);color:var(--accent-on);box-shadow:0 1px 2px rgba(31,95,168,.22)}

.btn-brand{background:var(--surface);color:var(--accent);border-color:var(--brand-connect)}   /* 青帆蓝锚点 2 */

.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none;filter:none}

.btn .spin{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;

/* ===================== 作品 ===================== */
.works-inline{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-card)}
.wtabs{display:flex;gap:var(--space-2);margin-bottom:var(--space-3);flex-wrap:wrap}
.wtab{font-size:var(--text-sm);font-weight:var(--w-emph);color:var(--muted);

.wtab:hover{border-color:var(--accent)}
.wtab:active{transform:scale(.97)}
.wtab.on{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}

.work-card{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;

.wv,.player,.work .thumb{
  background-image:
    radial-gradient(rgba(255,255,255,.55) .6px,transparent .8px),
    radial-gradient(120% 92% at 16% 4%,rgba(255,255,255,.85),transparent 56%),
    radial-gradient(88% 78% at 84% 24%,rgba(31,95,168,.20),transparent 64%),
    radial-gradient(70% 62% at 26% 96%,rgba(22,50,79,.16),transparent 72%),
    var(--wv-tint,linear-gradient(140deg,#E7EEF6 0%,#D6E2EF 55%,#EAF1F8 100%));
  background-size:3px 3px,100% 100%,100% 100%,100% 100%,100% 100%}
.wv.t-green{--wv-tint:linear-gradient(140deg,#EDF3EA,#DCE8DA 60%,#F1F6EF)}
.wv.t-paper{--wv-tint:linear-gradient(140deg,#F3EFE6,#E9E1D0 60%,#F7F3EA)}
.cover{position:absolute;inset:0;width:100%;height:100%;color:var(--cover-ink);opacity:.92;stroke-width:2.4;z-index:0}
.cover .p-panel{fill:var(--scene-panel)}
.cover .p-panel2{fill:var(--scene-panel-2)}
.cover .p-sand{fill:var(--scene-sand)}
.cover .p-kraft{fill:var(--scene-kraft)}
.cover .p-ink{fill:var(--cover-ink)}
.wv{position:relative;aspect-ratio:16/9;overflow:hidden}
.wv::before,.player::before,.work .thumb::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.5) 50%,transparent 68%);
  transform:translateX(-120%);animation:sheen 3600ms var(--ease-standard) 1200ms infinite}
@keyframes sheen{0%{transform:translateX(-120%)}55%{transform:translateX(120%)}100%{transform:translateX(120%)}}
.wv::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;

.badge{position:absolute;left:var(--space-3);bottom:var(--space-3);top:auto;z-index:2;

  background:rgba(22,50,79,.5);border-radius:var(--radius-pill);padding:3px 9px;letter-spacing:var(--tracking-small)}
.star{position:absolute;right:var(--space-3);top:var(--space-3);z-index:2;font-size:var(--text-xs);font-weight:var(--w-announce);

.dur{position:absolute;right:var(--space-3);bottom:var(--space-3);z-index:2;

.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:44px;height:44px;border-radius:50%;

.wcap{padding:var(--space-3) var(--space-4)}
.wcap b{display:block;font-size:var(--text-base);font-weight:var(--w-emph);color:var(--fg)}

.works{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-card)}
.work{background:var(--surface);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--elev-soft);cursor:pointer;
  transition:transform var(--motion-slow) var(--ease-standard),box-shadow var(--motion-slow) var(--ease-standard)}
.work:hover{transform:translateY(-3px);box-shadow:var(--elev-card)}
.work:active{transform:translateY(-1px) scale(.99)}
.work .thumb{aspect-ratio:16/11;display:flex;align-items:center;justify-content:center;
  color:var(--muted);position:relative;overflow:hidden}
.work .meta{padding:var(--space-2) var(--space-3) var(--space-3)}

.tl{position:relative;padding-left:var(--space-6)}

.tl .rail2 i{position:absolute;inset:0;background:var(--accent);transform-origin:top;

.tl .node{position:relative;padding-bottom:var(--space-4);opacity:0;transform:translateY(6px);

/* ===================== 信笺 ===================== */
.letter-head{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.letter-head h2{font-family:var(--font-hand);font-size:var(--text-2xl);font-weight:var(--w-announce);color:var(--ink-brown)}
.letter-head .hint{margin-left:auto;font-size:var(--text-xs);color:var(--ink-brown);font-weight:var(--w-emph);
  display:inline-flex;align-items:center;gap:4px}
.letter-head .hint svg{width:14px;height:14px}
.letter-note{font-size:var(--text-sm);color:var(--ink-brown-2);margin-bottom:var(--space-4)}

.env-wrap{position:relative;margin-top:var(--space-5)}
.env-tap{display:block;cursor:pointer;border:0;background:none;padding:0;font-family:inherit;
  width:100%;text-align:left;border-radius:var(--radius-lg);perspective:1500px}
.env-tap:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.env-stage{position:relative;width:100%;height:396px;transform-style:preserve-3d}
.env-stage{height:var(--env-stage-h)}   /* 视口自适应覆盖；不支持 clamp/dvh 的老浏览器保留上面的 396px */

.env{position:absolute;left:0;right:0;bottom:0;height:210px;border-radius:6px;
  background:var(--kraft);border:1px solid var(--kraft-line);
  box-shadow:var(--kraft-shadow), 0 1px 2px rgba(80,60,30,.10);
  transform-origin:bottom center;
  transition:opacity var(--motion-slow) var(--ease-standard) 300ms,
             transform var(--motion-slow) var(--ease-standard) 300ms,
             filter var(--motion-slow) var(--ease-standard) 300ms}
.env::before,.env::after{content:"";position:absolute;top:0;bottom:0;width:56%;pointer-events:none}
.env::before{left:0;background:linear-gradient(90deg,rgba(120,95,55,.10),transparent);
  clip-path:polygon(0 0,100% 50%,0 100%)}
.env::after{right:0;background:linear-gradient(270deg,rgba(120,95,55,.10),transparent);
  clip-path:polygon(100% 0,0 50%,100% 100%)}
.env .flap{position:absolute;left:-1px;right:-1px;top:-2px;height:94px;
  background:linear-gradient(180deg,#f6efdf,#f2ead9 72%,#e9dfc9);
  border:1px solid var(--kraft-line);border-bottom:0;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;transform:rotateX(0deg);
  transition:transform var(--motion-flip) var(--ease-spring),box-shadow var(--motion-flip) var(--ease-standard);
  box-shadow:inset 0 -7px 12px -9px rgba(120,95,55,.45);z-index:3;
  border-radius:6px 6px 0 0}
.env .flap-shadow{position:absolute;left:0;right:0;top:88px;height:12px;z-index:2;
  background:linear-gradient(180deg,rgba(120,95,55,.16),transparent);
  clip-path:polygon(0 0,100% 0,50% 100%);transition:opacity var(--motion-base) var(--ease-standard)}
.env .head{position:absolute;left:var(--space-4);bottom:14px;z-index:4;max-width:180px;
  transition:opacity var(--motion-base) var(--ease-standard) 180ms}
.env .head .to{font-size:var(--text-xs);line-height:1.6;color:var(--ink-brown-2);letter-spacing:var(--tracking-caps)}
.env .head .who{font-family:var(--font-hand);font-size:var(--text-xl);line-height:1.45;font-weight:var(--w-announce);color:var(--ink-brown);margin-top:2px}
.stamp{position:absolute;right:var(--space-4);top:calc(94px + var(--space-2));width:40px;height:48px;
  background:radial-gradient(circle at 0 50%, transparent 2.2px, #fbf6ea 2.7px) 0 0/8px 8px repeat-y,
             radial-gradient(circle at 100% 50%, transparent 2.2px, #fbf6ea 2.7px) 100% 0/8px 8px repeat-y,
             #fbf6ea;
  border:1px solid var(--kraft-line);border-radius:2px;z-index:4;
  display:flex;align-items:center;justify-content:center;color:var(--wax);
  box-shadow:0 1px 2px rgba(120,95,55,.12)}
.stamp svg{width:20px;height:20px}
.env .fold{position:absolute;left:0;right:0;bottom:0;height:52px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(120,95,55,.05));
  clip-path:polygon(0 100%,50% 0,100% 100%);opacity:.7}

.seal{position:absolute;left:50%;top:70px;transform:translate(-50%,0);z-index:6;
  width:44px;height:44px;
  border-radius:52% 48% 46% 54% / 50% 54% 46% 50%;
  background:radial-gradient(circle at 34% 28%, var(--wax-hi) 0%, var(--wax) 44%, var(--wax-lo) 100%);
  border:2px solid var(--gold);
  box-shadow:
    0 1px 1px rgba(255,235,200,.5) inset,
    0 -2px 5px rgba(40,8,8,.45) inset,
    0 5px 13px rgba(90,20,20,.42),
    0 0 0 3px rgba(201,168,90,.14);
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--motion-slow) var(--ease-spring),opacity var(--motion-base) var(--ease-standard);
  animation:sealpress 520ms var(--ease-spring) 240ms both}
.seal::before{content:"";position:absolute;inset:-3px;z-index:-1;
  border-radius:44% 56% 58% 42% / 54% 46% 54% 46%;
  background:radial-gradient(circle at 62% 72%, var(--wax-lo), color-mix(in srgb,var(--wax) 84%,#3d0f0f) 72%);
  transform:rotate(18deg);box-shadow:0 4px 11px rgba(90,20,20,.34)}
.seal::after{content:"";position:absolute;left:13%;top:10%;width:42%;height:33%;
  border-radius:50%;background:radial-gradient(circle,rgba(255,240,210,.55),transparent 70%);
  transform:rotate(-20deg);pointer-events:none}
.seal .imp{width:21px;height:21px;color:var(--gold-hi);position:relative;z-index:1;
  filter:drop-shadow(0 1px 0 rgba(60,10,10,.55)) drop-shadow(0 -1px 0 rgba(255,235,200,.30))}
.seal .imp svg{width:21px;height:21px}
@keyframes sealpress{0%{transform:translate(-50%,0) scale(1.14)}60%{transform:translate(-50%,0) scale(.97)}100%{transform:translate(-50%,0) scale(1)}}

.paper{position:absolute;left:6px;right:6px;bottom:0;min-height:212px;max-height:calc(100% - 12px);overflow:hidden;
  background:var(--paper-bg);border:1px solid var(--kraft-line);border-radius:4px;
  padding:var(--space-5) var(--space-5) var(--space-4);
  box-shadow:0 12px 30px rgba(80,60,30,.24);
  transform:translateY(24px) scale(.985) rotateX(6deg);transform-origin:bottom center;
  opacity:0;pointer-events:none;z-index:2;
  transition:transform var(--motion-flip) var(--ease-spring) 120ms,
             opacity var(--motion-slow) var(--ease-standard) 160ms}
.paper .lines{position:absolute;inset:var(--space-4) var(--space-5);pointer-events:none;
  background-image:repeating-linear-gradient(180deg,transparent 0 30px,rgba(120,95,55,.16) 30px 31px);border-radius:2px}
.paper .dt{font-family:var(--font-hand);font-size:var(--text-base);color:var(--ink-brown-2);position:relative}
.paper .salut{font-family:var(--font-hand);font-size:var(--text-2xl);font-weight:var(--w-announce);
  color:var(--ink-brown);margin-top:var(--space-3);position:relative}
.paper .body{font-family:var(--font-hand);font-size:var(--text-xl);color:#4a4436;
  margin-top:var(--space-3);position:relative;line-height:2.0;letter-spacing:.01em}
.paper .sign{margin-top:var(--space-4);text-align:right;position:relative;opacity:0;transform:translateY(5px);
  transition:opacity var(--motion-slow) var(--ease-standard),transform var(--motion-slow) var(--ease-standard)}
.paper .sign .nm{font-family:var(--font-hand);font-size:var(--text-2xl);font-weight:var(--w-announce);color:var(--ink-brown)}
.paper .sign .dt2{font-family:var(--font-hand);font-size:var(--text-sm);color:var(--ink-brown-2);margin-top:2px}

/* [!] 信封展开：input 必须在 label 内部、紧挨 .env-stage 之前（此层级不可改，改则规则永不命中） */
.env-check{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.env-check:checked ~ .env-stage .env{opacity:0;transform:translateY(30px) scale(.94);filter:blur(1px)}
.env-check:checked ~ .env-stage .env .flap{transform:rotateX(-168deg);box-shadow:0 10px 22px rgba(80,60,30,.16)}
.env-check:checked ~ .env-stage .env .flap-shadow{opacity:0}
.env-check:checked ~ .env-stage .env .head{opacity:0}
.env-check:checked ~ .env-stage .seal{transform:translate(-50%,32px) rotate(26deg);opacity:0}
.env-check:checked ~ .env-foot .env-hint{opacity:0;animation:none}
.env-check:checked ~ .env-stage .paper{opacity:1;transform:translateY(0) scale(1) rotateX(0deg);pointer-events:auto}
.env-check:checked ~ .env-stage .paper .sign{opacity:1;transform:translateY(0);transition-delay:520ms}
/* ============================================================
   [!] 展开态几何修正（修「长信纸向上溢出」缺陷）
   ------------------------------------------------------------
   闭合态：.env-stage 定高 396px，.paper 是 absolute + bottom:0 —— 这是 3D 翻转入场动画需要的几何，
           原样保留，一个字不动。
   展开态：信纸高度由内容决定（长信可达 ~600px），若仍 absolute + bottom:0，它只能「向上长」，
           顶部会被 .screen 的滚动容器裁掉，并盖住上方 .sec 里的「家书」标题与说明行。
   修法：展开时把舞台还给正常流、高度自适应，信纸改为相对定位；.env 在展开态本就 opacity:0，
         位置变化不可见。层级（.env-tap 的 perspective / .env-stage 的 preserve-3d）未动。
   ============================================================ */
.env-check:checked ~ .env-stage{height:auto;min-height:var(--env-stage-h)}
.env-check:checked ~ .env-stage .paper{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:0 6px;max-height:none;overflow:visible}

.env-foot{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);
  margin-top:var(--space-3);text-align:center}
.env-hint{font-size:var(--text-xs);color:var(--ink-brown-2);display:inline-flex;align-items:center;gap:5px;
  white-space:nowrap;animation:floaty 2200ms var(--ease-standard) infinite;transition:opacity var(--motion-base) var(--ease-standard)}
.env-hint svg{width:14px;height:14px;color:var(--wax)}
.env-from{font-family:var(--font-hand);font-size:var(--text-xs);color:var(--ink-brown-2);letter-spacing:var(--tracking-small)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.vis-tag{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--ink-brown-2);
  background:rgba(216,203,178,.24);border:0.5px solid var(--kraft-line);border-radius:var(--radius-pill);padding:3px 10px}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;
  animation:breathe 1800ms var(--ease-standard) infinite}
.quote.onpaper{background:rgba(255,255,255,.55);border-left-color:var(--kraft-line)}

/* ===================== 我的 ===================== */
.profile{display:flex;align-items:center;gap:var(--space-3);background:var(--surface-tint);
  border-radius:var(--radius-lg);padding:var(--space-4);box-shadow:var(--elev-soft)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--surface-sunken);
  display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;box-shadow:0 0 0 0.5px var(--border)}
.voice{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);box-shadow:var(--elev-soft)}
.voice.pending{border:0.5px solid var(--warn)}
.voice.rejected{border:0.5px solid var(--danger)}
.voice .top{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2);flex-wrap:wrap}
.voice .top .sign{font-size:var(--text-xs);color:var(--muted);background:var(--surface-sunken);border-radius:var(--radius-pill);padding:2px 8px}
.voice .top .pill{margin-left:auto}
.voice p{font-size:var(--text-base);color:var(--fg)}
.voice .vis{font-size:var(--text-xs);color:var(--muted);margin-top:var(--space-2)}

/* ===================== 首次引导 ===================== */
.onboard{flex:1;display:flex;flex-direction:column;padding:var(--space-6) var(--space-5);background:var(--bg);text-align:center;overflow-y:auto}
.onboard .art{margin:var(--space-6) auto var(--space-5);position:relative}
.onboard .art .ring{position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(31,95,168,.28);
  animation:spin 26s linear infinite}
.onboard h2{font-size:var(--text-2xl);font-weight:var(--w-announce);color:var(--fg);letter-spacing:var(--tracking-display)}
.onboard .lead{font-size:var(--text-base);color:var(--muted);margin-top:var(--space-2)}
.onboard .skip{position:absolute;right:var(--space-4);top:var(--space-2);z-index:2}
.steps{margin:var(--space-6) 0;text-align:left}
.step{display:flex;gap:var(--space-3);padding:var(--space-2) 0}
.step .num{width:26px;height:26px;flex:none;border-radius:50%;background:var(--surface);border:0.5px solid var(--accent);
  color:var(--accent);font-size:var(--text-sm);font-weight:var(--w-emph);display:flex;align-items:center;justify-content:center;font-family:var(--font-num)}
.step b{font-size:var(--text-base);color:var(--fg);font-weight:var(--w-emph);display:block}
.step span{font-size:var(--text-sm);color:var(--muted)}
.onboard .foot{margin-top:auto}

.bigtext{font-size:var(--text-3xl);font-weight:var(--w-announce);color:var(--fg);letter-spacing:var(--tracking-display)}

/* ===================== 作品播放（半屏） ===================== */
.player{position:relative;aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;
  box-shadow:var(--elev-card);--wv-tint:linear-gradient(150deg,#DAE4F0,#BFD0E4 58%,#E5ECF5)}
.player::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,transparent 42%,rgba(22,50,79,.66))}
.player .big-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:58px;height:58px;border-radius:50%;background:rgba(22,50,79,.55);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;color:#fff;border:0;cursor:pointer;
  box-shadow:0 6px 18px rgba(22,50,79,.28)}
.player .big-play svg{width:24px;height:24px;margin-left:3px}
.player .pbar{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-4);z-index:2;
  display:flex;align-items:center;gap:var(--space-2);color:#fff}
.player .pbar .t{font-family:var(--font-num);font-size:var(--text-xs);font-variant-numeric:tabular-nums;flex:none}
.player .pbar .rail{flex:1;height:3px;border-radius:var(--radius-pill);background:rgba(255,255,255,.32);position:relative;overflow:hidden}
.player .pbar .rail i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:var(--radius-pill);
  transition:width 220ms linear}
.player .pbar .pico{display:inline-flex;align-items:center;gap:var(--space-3);flex:none}
.player .pbar .pico svg{width:16px;height:16px}

.tag-day{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:var(--w-emph);
  color:var(--accent);background:rgba(31,95,168,.10);border-radius:var(--radius-pill);padding:4px 10px;letter-spacing:var(--tracking-small)}
.wmeta{margin-top:var(--space-3)}
.wmeta h2{font-size:var(--text-xl);font-weight:var(--w-announce);color:var(--fg);letter-spacing:var(--tracking-display);margin-top:var(--space-2)}
.wmeta .line{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2);font-size:var(--text-xs);color:var(--muted)}
.wmeta .line .kind{font-family:var(--font-num);border:0.5px solid var(--border);border-radius:var(--radius-pill);padding:1px 8px}
.wmeta .line .num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ===================== TabBar（4 Tab · 悬浮毛玻璃胶囊） ===================== */
.tabbar{position:absolute;left:var(--tabbar-inset);right:var(--tabbar-inset);bottom:var(--tabbar-bottom);
  height:var(--tabbar-h);z-index:10;
  background:var(--glass-bar);-webkit-backdrop-filter:var(--blur-bar);backdrop-filter:var(--blur-bar);
  border-radius:var(--radius-pill);
  box-shadow:0 8px 28px rgba(22,50,79,.16), 0 0 0 0.5px rgba(22,50,79,.06);
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 var(--space-2)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--space-1) 0;color:var(--muted);
  background:none;border:0;font-family:inherit;font-size:var(--text-xs);cursor:pointer;
  transition:color var(--motion-base) var(--ease-standard)}
.tab .tab-ico{position:relative;display:flex;align-items:center;justify-content:center;
  width:42px;height:28px;border-radius:var(--radius-pill);
  transition:background var(--motion-base) var(--ease-standard),transform var(--motion-base) var(--ease-spring)}
.tab svg{width:var(--icon-md);height:var(--icon-md);transition:transform var(--motion-base) var(--ease-spring)}
.tab:active .tab-ico{transform:scale(.92)}
.tab.active{color:var(--accent);font-weight:var(--w-emph)}
.tab.active .tab-ico{background:rgba(31,95,168,.12)}
.tab.active svg{color:var(--accent)}
.tab .tab-ico .unread-dot{position:absolute;top:3px;right:8px}

.fade-up{animation:fadeup 640ms var(--ease-standard) both}
.d1{animation-delay:80ms}.d2{animation-delay:170ms}.d3{animation-delay:260ms}
.d4{animation-delay:350ms}.d5{animation-delay:440ms}.d6{animation-delay:530ms}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* [!] 安全网：入场动画无论如何在 1.2s 内「落定」。
   防止无头/隐藏标签页把内容冻结在 opacity:0，导致把「动画没播完」误判成「内容缺失」。 */
.app.settled .fade-up,.app.settled .tl .node{animation:none;opacity:1;transform:none}
.app.settled .donut .val{animation:none;stroke-dashoffset:49}
.app.settled .axis .rail i,.app.settled .tl .rail2 i{animation:none;transform:scaleY(1)}
.app.settled .bar i{animation:none;transform:none}
.app.settled .seal{animation:none}
.app.settled .wv::before,.app.settled .player::before,.app.settled .work .thumb::before{animation:none;transform:translateX(-120%)}

/* ===================== v6 图标底卡片行 ===================== */
.tiles{display:flex;flex-direction:column;gap:var(--space-2)}
.tile{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);min-height:var(--touch-min);
  background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--elev-soft);cursor:pointer;text-align:left;
  border:0;width:100%;font-family:inherit;
  transition:transform var(--motion-fast) var(--ease-standard),filter var(--motion-fast) var(--ease-standard)}
.tile:active{transform:scale(var(--press));filter:brightness(.985)}
.tile .tile-ico{width:36px;height:36px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--brand-connect) 16%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand-connect) 32%,transparent);color:color-mix(in srgb,var(--brand-connect) 60%,var(--fg))}
.tile .tile-ico svg{width:20px;height:20px}
.tile .tx{flex:1;min-width:0}
.tile .tx b{display:block;font-size:var(--text-base);font-weight:var(--w-emph);color:var(--fg)}
.tile .tx span{display:block;font-size:var(--text-sm);color:var(--muted);margin-top:1px}
.tile .tail{color:var(--border);flex:none;font-size:var(--text-lg)}

/* ===================== v6 教练捎话头像 / 品牌标识 ===================== */
.quote.coach{display:flex;gap:var(--space-3);align-items:flex-start}
.coach-av{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface);color:var(--accent);box-shadow:0 0 0 0.5px rgba(31,95,168,.24)}
.coach-av svg{width:20px;height:20px}
.coach-b{min-width:0}
.coach-b .who{margin-bottom:var(--space-1)}

.brand-lockup{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.brand-lockup .bm-lg{width:22px;height:22px;flex:none;color:var(--brand-connect)}
.brand-lockup .bm-name{font-size:var(--text-sm);font-weight:var(--w-emph);color:var(--muted);letter-spacing:var(--tracking-small)}
.brand-flag{display:inline-flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);
  padding:5px 12px;border-radius:var(--radius-pill);
  background:color-mix(in srgb,var(--brand-connect) 10%,transparent);
  box-shadow:inset 0 0 0 0.5px color-mix(in srgb,var(--brand-connect) 38%,transparent)}
.brand-flag svg{width:20px;height:20px;color:var(--brand-connect);flex:none}
.brand-flag span{font-size:var(--text-xs);font-weight:var(--w-emph);color:var(--accent);letter-spacing:var(--tracking-small)}
.sb-note{font-size:var(--text-xs);color:var(--muted);margin-top:2px}

/* ============================================================
   应用新增层（登录 / 绑定 / 表单 / 分段 / 空态 / 曲线 / 半屏 / 演示控制）
   全部走 Token，无硬编码色值
   ============================================================ */

/* ---------- 登录 / 绑定：品牌与表单 ---------- */
.auth-hero{text-align:center;padding:var(--space-8) var(--space-2) var(--space-6)}
.auth-logo{width:52px;height:52px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--brand-connect) 12%,var(--surface));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand-connect) 34%,transparent)}
.auth-logo svg{width:28px;height:28px;color:var(--brand-connect)}   /* 青帆蓝锚点 1 */
/* 非品牌场景的图标底板：走主操作色，不占用青帆蓝锚点 */
.auth-logo.accent{background:color-mix(in srgb,var(--accent) 10%,var(--surface));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.auth-logo.accent svg{color:var(--accent)}
.auth-hero h1{font-size:var(--text-2xl);font-weight:var(--w-announce);color:var(--fg);
  letter-spacing:var(--tracking-display);margin-top:var(--space-4)}
.auth-hero p{font-size:var(--text-sm);color:var(--muted);margin-top:var(--space-2);max-width:28ch;margin-left:auto;margin-right:auto}

.field{margin-bottom:var(--space-4)}
.field:last-child{margin-bottom:0}
.field > label,.field .flabel{display:block;font-size:var(--text-sm);font-weight:var(--w-emph);color:var(--fg);margin-bottom:var(--space-2)}
.input{width:100%;min-height:var(--touch-min);border-radius:var(--radius-md);border:.5px solid var(--border);
  background:var(--surface);padding:10px var(--space-4);font-family:inherit;font-size:var(--text-base);color:var(--fg);
  transition:border-color var(--motion-base) var(--ease-standard),box-shadow var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.input::placeholder{color:var(--muted)}
.input:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.input:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus-ring)}
.input:disabled{background:var(--surface-sunken);color:var(--muted);cursor:not-allowed}
.input.mono{letter-spacing:.14em;font-variant-numeric:tabular-nums}
.input.invalid{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 22%,transparent)}
textarea.input{min-height:104px;resize:none;line-height:1.7;padding-top:10px}
.code-row{display:flex;gap:var(--space-2);align-items:stretch}
.code-row .input{flex:1;min-width:0}
.btn-code{flex:none;white-space:nowrap;padding:0 var(--space-4);min-height:var(--touch-min);border-radius:var(--radius-md);
  background:var(--surface);color:var(--accent);border:.5px solid var(--accent);font-family:inherit;font-size:var(--text-sm);
  font-weight:var(--w-emph);cursor:pointer;font-variant-numeric:tabular-nums;
  transition:background var(--motion-base) var(--ease-standard),color var(--motion-base) var(--ease-standard),
             border-color var(--motion-base) var(--ease-standard),transform var(--motion-fast) var(--ease-standard)}
.btn-code:hover{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.btn-code:active{transform:scale(.97)}
.btn-code:disabled{color:var(--muted);border-color:var(--border);background:var(--surface-sunken);cursor:not-allowed}

.stepper{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-4)}
.stepper span{width:24px;height:24px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-num);font-size:var(--text-xs);font-weight:var(--w-emph);
  background:var(--surface-sunken);color:var(--muted);box-shadow:inset 0 0 0 .5px var(--border)}
.stepper span.on{background:var(--accent);color:var(--accent-on);box-shadow:none}
.stepper span.done{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);
  box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--accent) 40%,transparent)}
.stepper i{flex:1;height:2px;background:var(--border);border-radius:2px}
.stepper i.on{background:var(--accent)}
.stepper em{margin-left:auto;font-style:normal;font-size:var(--text-xs);color:var(--muted);white-space:nowrap}

.seg{display:flex;gap:var(--space-1);padding:3px;background:var(--surface-sunken);border-radius:var(--radius-md);margin-bottom:var(--space-4)}
.seg button{flex:1;min-height:38px;border:0;border-radius:calc(var(--radius-md) - 2px);background:transparent;
  font-family:inherit;font-size:var(--text-sm);font-weight:var(--w-emph);color:var(--muted);cursor:pointer;
  transition:background var(--motion-base) var(--ease-standard),color var(--motion-base) var(--ease-standard)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--elev-soft)}
.seg button:active{transform:scale(.985)}

.alert{display:flex;gap:var(--space-2);align-items:flex-start;border-radius:var(--radius-md);padding:var(--space-3);
  font-size:var(--text-sm);line-height:1.6;margin-top:var(--space-3);color:var(--fg)}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
.alert.err{background:color-mix(in srgb,var(--danger) 9%,var(--surface));
  border:.5px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.alert.err svg{color:var(--danger)}
.alert.info{background:color-mix(in srgb,var(--accent) 7%,var(--surface));
  border:.5px solid color-mix(in srgb,var(--accent) 26%,transparent)}
.alert.info svg{color:var(--accent)}
.alert.ok{background:color-mix(in srgb,var(--success) 9%,var(--surface));
  border:.5px solid color-mix(in srgb,var(--success) 34%,transparent)}
.alert.ok svg{color:var(--success)}
.alert b{font-weight:var(--w-emph)}

.hintline{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--text-xs);color:var(--muted);line-height:1.65}
.hintline svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--muted)}

.bullets{list-style:none;display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-3)}
.bullets li{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--text-sm);color:var(--fg)}
.bullets li svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--accent)}

.foot-note{margin-top:var(--space-5);font-size:var(--text-xs);color:var(--muted);line-height:1.7;text-align:center}
.foot-note .row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:var(--space-2)}
.foot-note svg{width:13px;height:13px;color:var(--muted)}

/* ---------- 空态 ---------- */
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);text-align:center;
  padding:var(--space-8) var(--space-5);background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--elev-soft)}
.empty .ei{width:50px;height:50px;border-radius:50%;background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:var(--space-1)}
.empty .ei svg{width:24px;height:24px}
.empty b{font-size:var(--text-base);font-weight:var(--w-emph);color:var(--fg)}
.empty span{font-size:var(--text-sm);color:var(--muted);max-width:28ch}
.empty .btn{margin-top:var(--space-3)}

/* ---------- 成长曲线 ---------- */
.curve{margin-top:var(--space-2)}
.curve svg{width:100%;height:auto;display:block;overflow:visible}
.curve .gl{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4}
.curve .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.curve .ln-future{fill:none;stroke:var(--border);stroke-width:2;stroke-dasharray:4 5;stroke-linecap:round}
.curve .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2.4}
.curve .pt.future{stroke:var(--border);stroke-dasharray:3 3;fill:var(--surface)}
.curve .vl{font-family:var(--font-num);font-size:10px;fill:var(--muted)}
.curve .xl{font-size:10px;fill:var(--muted)}
.curve .gl-t{font-size:10px;fill:var(--muted);font-family:var(--font-num)}
.curve-legend{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-3);
  font-size:var(--text-xs);color:var(--muted)}
.curve-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:middle}
.curve-legend i.dash{background:repeating-linear-gradient(90deg,var(--border) 0 4px,transparent 4px 8px)}

/* ---------- 半屏（Sheet） ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:50;display:none}
.sheet-wrap.open{display:block}
.sheet-scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--fg) 44%,transparent);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:scrimIn 200ms var(--ease-standard)}
@keyframes scrimIn{from{opacity:.02}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;background:var(--bg);
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -14px 40px rgba(22,50,79,.30);animation:sheetUp 320ms var(--ease-standard)}
@keyframes sheetUp{from{transform:translateY(18px)}to{transform:none}}
.sheet-grip{flex:none;padding:10px 0 4px;display:flex;justify-content:center;background:var(--bg)}
.sheet-grip i{width:38px;height:4px;border-radius:2px;background:var(--border)}
.sheet-head{flex:none;display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-4) var(--space-3);background:var(--bg)}
.sheet-head h2{font-size:var(--text-xl);font-weight:var(--w-announce);color:var(--fg);letter-spacing:var(--tracking-display)}
.sheet-head .sh-note{font-size:var(--text-xs);color:var(--muted);margin-top:1px}
.sheet-head .icon-btn{margin-left:auto}
.sheet-body{flex:1;overflow-y:auto;padding:0 var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet-body::-webkit-scrollbar{width:0}
.sheet-foot{flex:none;padding:var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:.5px solid var(--border);display:flex;gap:var(--space-2);align-items:center}

/* ---------- 当前孩子切换 / 演示控制 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.chip{display:inline-flex;align-items:center;gap:var(--space-2);padding:8px 14px;min-height:40px;border-radius:var(--radius-pill);
  background:var(--surface);border:.5px solid var(--border);font-family:inherit;font-size:var(--text-sm);
  font-weight:var(--w-emph);color:var(--fg);cursor:pointer;
  transition:background var(--motion-base) var(--ease-standard),color var(--motion-base) var(--ease-standard),
             border-color var(--motion-base) var(--ease-standard)}
.chip .av{width:20px;height:20px;border-radius:50%;background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:var(--w-announce);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}

.chip:active{transform:scale(.97)}

.drow{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:.5px solid var(--border-soft)}
.drow:last-child{border-bottom:0}
.drow .dtx{flex:1;min-width:0}
.drow .dtx b{display:block;font-size:var(--text-base);font-weight:var(--w-emph);color:var(--fg)}
.drow .dtx span{display:block;font-size:var(--text-sm);color:var(--muted);margin-top:1px}
.drow .act{flex:none}
.jumpgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-2)}
.jump{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:var(--space-3);min-height:56px;
  border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--elev-soft);border:.5px solid transparent;
  font-family:inherit;cursor:pointer;text-align:left;
  transition:transform var(--motion-fast) var(--ease-standard),border-color var(--motion-base) var(--ease-standard)}
.jump b{font-size:var(--text-sm);font-weight:var(--w-emph);color:var(--fg)}
.jump span{font-size:var(--text-xs);color:var(--muted)}
.jump:active{transform:scale(.98)}
.jump[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.jump[aria-pressed="true"] b{color:var(--accent)}

/* ---------- 留声墙 ---------- */
.counter{display:flex;justify-content:space-between;align-items:center;font-size:var(--text-xs);color:var(--muted);margin-top:var(--space-2)}
.counter b{font-family:var(--font-num);font-weight:var(--w-emph);color:var(--muted)}
.counter b.over{color:var(--danger)}

/* ---------- Toast ---------- */
.toast{position:absolute;left:50%;transform:translateX(-50%) translateY(8px);
  bottom:calc(var(--tabbar-h) + var(--tabbar-bottom) + 10px);z-index:80;max-width:calc(100% - 40px);
  background:color-mix(in srgb,var(--fg) 94%,transparent);color:#fff;font-size:var(--text-sm);line-height:1.5;
  padding:10px 16px;border-radius:var(--radius-pill);text-align:center;pointer-events:none;
  opacity:0;transition:opacity var(--motion-base) var(--ease-standard),transform var(--motion-base) var(--ease-standard)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.aboveSheet{bottom:auto;top:calc(var(--space-6) + env(safe-area-inset-top,6px))}

/* ---------- 加载（数据层 Promise 的中间态） ---------- */
.loading{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-12) 0;color:var(--muted);font-size:var(--text-sm)}
.loading .sp{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);animation:spin 760ms linear infinite}

/* ============================================================
   颜好看 · v9 视觉加壳（纯视觉增强 · 零逻辑改动）
   信封 CSS（.env / .env-stage / .env-check / .paper / .flap / .seal 的 3D
   transform 与层叠规则）原样保留，本块不触碰其规则；信封展开态不受影响。
   ============================================================ */

/* —— 分段标题：图标锚点 + 左侧品牌短杠，破除「纯文字段」观感 —— */
.sec-head h2{display:inline-flex;align-items:center;gap:7px}
.sec-head h2::before{content:"";width:3px;height:15px;border-radius:2px;flex:none;opacity:.9;
  background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,transparent))}
.sec-head .sh-ico{color:var(--accent);flex:none;display:inline-flex;align-items:center;justify-content:center}

/* —— 分段标签图标化：.wtab / .seg 文字前加细图标 —— */
.wtab{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.wtab svg{width:15px;height:15px;flex:none}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:15px;height:15px;flex:none}

/* —— 空状态：场景色插画底，制造呼吸感与温度 —— */
.empty .ei{background:linear-gradient(140deg,var(--scene-panel) 0%,var(--scene-kraft) 100%);
  color:color-mix(in srgb,var(--accent) 75%,#fff);
  box-shadow:var(--elev-soft), inset 0 0 0 0.5px rgba(255,255,255,.5)}
.empty .ei svg{width:26px;height:26px}
.empty b{margin-top:2px}

/* —— 引导页插画：场景色光晕 + 缓转环，给首屏温度 —— */
.onboard .art{overflow:visible}
.onboard .art::before{content:"";position:absolute;inset:-30px;border-radius:50%;z-index:-2;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 12%,transparent),transparent 62%)}
.onboard .art::after{content:"";position:absolute;inset:-8px;border-radius:50%;z-index:-1;opacity:.55;
  background:conic-gradient(from 200deg,var(--scene-panel),var(--scene-kraft),var(--scene-sand),var(--scene-panel));
  animation:spin 32s linear infinite}

/* —— 认证页（登录/绑定）：顶部场景色柔光，破除纯白 —— */
.auth-hero{position:relative;overflow:hidden}
.auth-hero::before{content:"";position:absolute;top:-46px;left:50%;transform:translateX(-50%);
  width:260px;height:130px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%)}
.auth-hero>*{position:relative;z-index:1}

/* —— 今日 / 成长 大数字信息块：标签小字 + 数字大字 + 单位，层级更清晰 —— */
.metric b{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.metric span{letter-spacing:var(--tracking-small)}
.hero-num b{letter-spacing:-0.02em}

/* —— 列表项 hover / active 微交互（用 --ease-standard，禁用弹跳） —— */
.li{opacity:0;animation:liFade 480ms var(--ease-standard) forwards;
  transition:background var(--motion-base) var(--ease-standard),transform var(--motion-fast) var(--ease-standard)}
.li:active{transform:scale(var(--press))}
.list .li:nth-child(2){animation-delay:70ms}
.list .li:nth-child(3){animation-delay:140ms}
.list .li:nth-child(4){animation-delay:210ms}
.app.settled .li{animation:none;opacity:1}
@keyframes liFade{from{opacity:0}to{opacity:1}}

/* —— 信笺页教练捎话：场景蓝洗涤 + 暖色左标，呼应信笺材质 —— */
.quote.onpaper{background:linear-gradient(180deg,color-mix(in srgb,var(--scene-panel) 40%,transparent),rgba(255,255,255,.5));border-left:3px solid var(--scene-sand)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .env-check ~ .env-stage .env,.env-check ~ .env-stage .paper{transition:none}
  .seal{animation:none}
}

@media (hover:hover){

.m-slate .ic{ background:rgba(74,96,118,.12); box-shadow:inset 0 0 0 .5px rgba(74,96,118,.20) }
.m-slate .ic svg{ stroke:#4A6076 }
.sec-h .dot{ width:7px; height:7px; border-radius:50%; flex:none; margin-top:2px; }

/* ---- 6. 成长：分段控件 + 出勤 + 里程碑配图 ---- */
.seg{ display:inline-flex; background:#E9EFF7; border-radius:var(--radius-pill); padding:3px; gap:2px; }
.seg button{ border:0; background:none; font-family:inherit; cursor:pointer;
  padding:8px 20px; border-radius:var(--radius-pill); font-size:var(--text-sm);
  font-weight:var(--w-emph); color:var(--muted); min-height:40px; }
.seg button.on{ background:var(--fg); color:#fff; box-shadow:0 3px 10px rgba(22,50,79,.20); }
.pbar{ margin-top:var(--space-3); height:8px; border-radius:var(--radius-pill);
  background:#E3E9F1; overflow:hidden; }
.pbar i{ display:block; height:100%; border-radius:var(--radius-pill);
  background:linear-gradient(90deg,#0F8A7A,#3FBF9C); }
.ms{ display:flex; gap:12px; padding:13px 14px; align-items:flex-start; }
.ms + .ms{ border-top:0.5px solid var(--border-soft); }
.ms .mt{ width:62px; height:54px; border-radius:13px; flex:none; overflow:hidden; background:var(--surface-sunken); }
.ms .mt img{ width:100%; height:100%; object-fit:cover; display:block; }
.ms .tx{ min-width:0; flex:1; }
.ms .tx b{ font-size:var(--text-base); font-weight:var(--w-announce); color:var(--fg); display:block; }
.ms .tx .when{ font-size:var(--text-xs); color:var(--muted); display:block; margin-top:2px; }
.ms .tx p{ font-size:var(--text-sm); color:var(--meta); line-height:1.6; margin-top:5px; }
.scr[data-scr="growth"] .bigtext{ font-size:var(--text-4xl); font-weight:800; letter-spacing:-.03em; }

/* ---- 7. 登录：实景头图 + 白色表单卡 ---- */
.auth-real{ position:relative; height:290px; overflow:hidden; background:#DCE7F2; }
.auth-real > img{ width:100%; height:100%; object-fit:cover; display:block; }
.auth-real::after{ content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(8,16,26,.46) 0%,rgba(8,16,26,0) 38%,rgba(244,247,251,.94) 97%); }
.auth-real .txt{ position:absolute; left:var(--space-5); bottom:54px; right:var(--space-5);
  z-index:2; color:#fff; }
.auth-real .txt .nm{ display:flex; align-items:center; gap:8px; font-size:var(--text-base);
  font-weight:var(--w-emph); text-shadow:0 1px 8px rgba(0,0,0,.4); }
.auth-real .txt .nm svg{ width:22px; height:22px; fill:#fff; }
.auth-real .txt h2{ font-size:var(--text-2xl); font-weight:800; letter-spacing:var(--tracking-display);
  margin-top:10px; text-shadow:0 2px 14px rgba(0,0,0,.42); }
.auth-real .txt p{ font-size:var(--text-sm); opacity:.9; margin-top:5px; text-shadow:0 1px 8px rgba(0,0,0,.4); }
.auth-panel{ position:relative; margin-top:-44px; border-radius:24px 24px 0 0;
  background:#F4F7FB; padding:20px var(--space-4) 0; }
.auth-panel .pcard{ background:var(--surface); border-radius:20px; padding:18px 16px;
  box-shadow:0 8px 22px rgba(22,50,79,.08); }

/* ---- 8. 信笺：捎话纸卡（火漆红系）；信封本体 3D 一律不动 ---- */
.scr[data-scr="letter"]{ background:#F2EDE3; }
.scr[data-scr="letter"] .sticky-bar{ margin-top:0 !important; }
.scr[data-scr="letter"] .appbar{ background:#F6F1E7; }
.scr[data-scr="letter"] .brand-txt{ color:#4A3F2E; }
.pv-video{ width:100%; border-radius:16px; display:block; background:#000; aspect-ratio:16/9; }
.pv-cover-img{ position:absolute; inset:0; }
.pv-cover-img img{ width:100%; height:100%; object-fit:cover; display:block; }
.paper-note{ background:#FDFAF2; border-radius:18px; padding:14px 15px;
  box-shadow:0 6px 16px rgba(80,60,30,.10); }
.paper-note + .paper-note{ margin-top:9px; }
.paper-note .who{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
.paper-note .who u{ width:28px; height:28px; border-radius:50%; background:#F1E9D8; text-decoration:none;
  display:flex; align-items:center; justify-content:center; font-size:var(--text-sm);
  font-weight:var(--w-announce); color:var(--ink-brown); }
.paper-note .who b{ font-size:var(--text-base); font-weight:var(--w-announce); color:#3A3125; }
.paper-note .who span{ font-size:var(--text-xs); color:#736349; }
.paper-note p{ font-size:var(--text-base); line-height:1.75; color:#5B4E3B; }

/* ---- 9. TabBar：白毛玻璃 + 品牌蓝选中（信笺屏火漆红） ---- */
.tabbar{ background:rgba(255,255,255,.90); -webkit-backdrop-filter:blur(22px) saturate(160%);
  backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 10px 30px rgba(22,50,79,.16), 0 0 0 .5px rgba(22,50,79,.05); color:var(--meta); }
.tab{ color:var(--meta); font-size:var(--text-xs); min-height:44px; }
.tab.active{ color:var(--accent); font-weight:var(--w-announce); }
.tab.active .tab-ico{ background:rgba(31,95,168,.10); box-shadow:inset 0 0 0 .5px rgba(31,95,168,.22); }
.tab.active .tab-ico svg{ color:var(--accent); }
.scr[data-scr="letter"] .tab.active{ color:var(--wax); }
.scr[data-scr="letter"] .tab.active .tab-ico{ background:rgba(138,46,46,.12);
  box-shadow:inset 0 0 0 .5px rgba(138,46,46,.20); }
.scr[data-scr="letter"] .tab.active .tab-ico svg{ color:var(--wax); }

/* ---- 9.5 吸顶表头（2026-10-20 修复「滚动时表头盖住内容」）
   病根：v15 的 `.scr[data-scr] .sticky-bar{background:transparent}` 特异性高于 v11/v12 的
   收合头白底，把 `.scr.is-scrolled .sticky-bar` 的背景吃掉 ⇒ 滚动时表头全透明，
   正文直接从标题下方穿透，视觉上「表头压着内容」。
   修法：未滚动＝透明（让实景头图露出）；滚动收合＝毛玻璃白底 + 发丝分隔 + 投影，
        高度收到 30px，正文藏在其下方而不是与标题重叠。 */
.scr.is-scrolled .sticky-bar{
  background:rgba(255,255,255,.94)!important;
  -webkit-backdrop-filter:blur(14px) saturate(170%); backdrop-filter:blur(14px) saturate(170%);
  box-shadow:0 1px 0 rgba(22,50,79,.07), 0 10px 24px rgba(22,50,79,.10)!important;
  padding-top:var(--space-1)!important; padding-bottom:var(--space-1)!important;
}
.scr.is-scrolled .sticky-bar h1{ font-size:var(--text-xl); }
.scr.is-scrolled .sticky-bar .sb-note{ display:none; }
/* 信笺屏：收合底色跟随纸感，不用白 */
.scr[data-scr="letter"].is-scrolled .sticky-bar{
  background:rgba(246,241,231,.96)!important;
  box-shadow:0 1px 0 rgba(138,122,92,.22), 0 10px 22px rgba(80,60,30,.12)!important;
}
/* 收合态下正文与吸顶标题留出呼吸位，避免顶到边 */
.scr.is-scrolled .sec:first-of-type{ padding-top:var(--space-2); }

/* ---- 10. 通用：圆角与触控（Apple 44pt） ---- */
.card,.list,.tile{ border-radius:20px; }
.profile{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4);
  background:linear-gradient(140deg,#FFFFFF 0%,#E9F3FE 100%); border-radius:20px;
  box-shadow:0 8px 22px rgba(22,50,79,.08), 0 0 0 .5px rgba(22,50,79,.04); }
.profile b{ font-size:var(--text-lg); font-weight:var(--w-announce); color:var(--fg); }
.profile .avatar{ width:46px; height:46px; border-radius:50%; flex:none; display:flex;
  align-items:center; justify-content:center; font-size:var(--text-xl);
  font-weight:var(--w-announce); color:var(--accent); background:rgba(31,95,168,.12); }
.sec-head .dot{ margin-right:0; }
.sec-head{ display:flex; align-items:center; gap:7px; }
.sec-head h2{ font-size:var(--text-lg); }
.sec-head .more{ font-size:var(--text-sm); color:var(--muted); font-weight:var(--w-emph);
  display:inline-flex; align-items:center; padding:11px 2px 11px 14px; min-height:44px; }
.btn{ min-height:48px; border-radius:14px; font-size:var(--text-lg); }
.btn-primary,.btn.btn-primary{ background:linear-gradient(135deg,#1F5FA8 0%,#2E8FD4 100%);
  border:0; box-shadow:0 10px 24px rgba(31,95,168,.28); }
</style>
