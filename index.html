<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>青帆社区</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#16324F; --sub:#5E6E80; --meta:#8494A6;
  --blue:#1F5FA8; --cyan:#00AEEC; --rose:#F43F5E;
  --orange:#FF7A1A;
  --page:#EEF3FA;
  --line:rgba(22,50,79,.08);
}
html,body{min-height:100%}
body{
  background:var(--page);color:var(--ink);
  font-family:-apple-system,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
}
.page{width:100%;max-width:430px;min-height:100dvh;position:relative;overflow:hidden;
  background:#F4F7FB;
  box-shadow:0 0 60px rgba(22,50,79,.06)}

/* ── 头图 ── */
.hero{position:relative;height:372px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(5,16,29,.70) 0%,
    rgba(5,16,29,.46) 22%,
    rgba(5,16,29,.30) 42%,
    rgba(5,16,29,.66) 60%,
    rgba(5,16,29,.80) 72%,
    rgba(52,68,88,.62) 82%,
    rgba(196,208,222,.34) 90%,
    rgba(244,247,251,.94) 97%,
    #F4F7FB 100%)}

/* 联合标志：扬帆计划 ｜ 青帆社区（居中） */
.hero .mark{position:absolute;top:calc(env(safe-area-inset-top,0px) + 32px);left:0;right:0;z-index:2;
  display:flex;align-items:flex-end;justify-content:center;gap:16px;
  transform:translateX(4.5px) scale(.75);transform-origin:center top;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
.hero .mark::before{content:"";position:absolute;left:50%;top:50%;width:470px;height:170px;
  transform:translate(-50%,-50%);z-index:-1;pointer-events:none;
  background:radial-gradient(52% 50% at 50% 50%,rgba(4,14,26,.44) 0%,rgba(4,14,26,.26) 52%,rgba(4,14,26,.06) 82%,rgba(4,14,26,0) 100%);
  filter:blur(3px)}
.hero .mark .mk-yf{height:40px;width:auto;display:block;flex:none}
.hero .mark .mk-sep{width:1.5px;height:32.3px;background:#fff;flex:none;
  margin-bottom:0px}
.hero .mark .mk-qf{display:block;flex:none;margin-bottom:-1.55px;overflow:visible}
@media (max-width:359px){.hero .mark{transform:translateX(3.6px) scale(.66)}}

.hero .txt{position:absolute;left:22px;right:22px;bottom:96px;z-index:2;color:#fff}
.hero .txt .eyebrow{display:flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:600;letter-spacing:.16em;color:rgba(255,255,255,.86);
  text-shadow:0 1px 8px rgba(0,0,0,.45)}
.hero .txt .eyebrow i{width:16px;height:2px;border-radius:2px;background:var(--orange);flex:none;
  box-shadow:0 0 10px rgba(255,122,26,.6)}
.hero .txt h1{font-size:31px;font-weight:700;letter-spacing:.05em;margin-top:13px;line-height:1.28;
  text-shadow:0 2px 18px rgba(0,0,0,.5)}
.hero .txt h1 em{font-style:normal;color:var(--orange);
  text-shadow:0 2px 20px rgba(255,122,26,.36)}

/* ── 入口卡片（两张独立卡） ── */
.entries{padding:0 20px;margin-top:28px;display:flex;flex-direction:column;gap:16px}
.card{display:block;text-decoration:none;color:inherit;background:#fff;
  border-radius:20px;overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(22,50,79,.04),0 14px 30px -18px rgba(22,50,79,.28);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease}
.card:hover{transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(22,50,79,.05),0 22px 40px -20px rgba(22,50,79,.34)}
.card:active{transform:translateY(0) scale(.995)}

.band{position:relative;display:block;height:112px;padding:16px 18px;overflow:hidden}
.card.p .band{background:linear-gradient(140deg,#0E6FA8 0%,#17497F 100%)}
.card.s .band{background:linear-gradient(140deg,#C22C49 0%,#8A2E2E 100%)}
.band .art{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:138px;height:74px;pointer-events:none}
.band .end{position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:700;letter-spacing:.1em;line-height:1;
  padding:6px 11px;border-radius:999px;background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.15)}
.card.p .band .end{color:#0E6FA8}
.card.s .band .end{color:#AE2740}
.band .end i{width:4px;height:4px;border-radius:50%;background:currentColor;flex:none;opacity:.9}
.band .idx{position:absolute;left:17px;bottom:14px;z-index:1;
  font-size:38px;font-weight:800;line-height:1;letter-spacing:-.03em;
  color:rgba(255,255,255,.22);font-variant-numeric:tabular-nums}

.cbody{display:block;padding:18px 18px 18px}
.cbody h2{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.32;color:var(--ink)}
.cbody p{font-size:13.5px;line-height:1.72;color:var(--sub);margin-top:9px;letter-spacing:.01em}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pills i{font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:4px 9px;border-radius:999px;color:#41525F;background:rgba(22,50,79,.055)}
.card.p .pills i{background:rgba(0,174,236,.10);color:#1A5E80}
.card.s .pills i{background:rgba(244,63,94,.10);color:#8E2A3C}
.go{display:flex;align-items:center;justify-content:space-between;
  margin-top:16px;padding-top:14px;border-top:.5px solid var(--line)}
.go b{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.go .cir{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.card.p .go .cir{background:rgba(0,174,236,.12);color:#0E6FA8}
.card.s .go .cir{background:rgba(244,63,94,.12);color:#B72A44}
.go .cir svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.card:hover .go .cir{transform:translateX(2px);transition:transform .22s ease}

.tail{text-align:center;font-size:11.5px;color:#93A2B8;letter-spacing:.06em;line-height:1.9;
  padding:32px 0 calc(env(safe-area-inset-bottom,0px) + 30px)}

@media (min-width:480px){ .page{border-radius:26px;margin:18px 0;min-height:calc(100dvh - 36px)} }
</style>
</head>
