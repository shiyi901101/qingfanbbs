}

#loginPage{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#F7F8FA 0%,#EEF1F6 100%);overflow-y:auto;overflow-x:hidden;padding:24px 0}

.ln-logo{display:flex;align-items:center;gap:10px;color:#F43F5E;font-size:23px;font-weight:700;letter-spacing:3.2px;z-index:2;margin-top:16px}

.ln-sail:nth-child(2){left:52%;bottom:115px;animation:sf 5s ease-in-out infinite .6s}

.ln-title{font-size:27px;font-weight:800;margin-bottom:8px;z-index:2;letter-spacing:2px;font-family:var(--font);background:linear-gradient(92deg,#00AEEC 0%,#5B7CFA 52%,#FB7299 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.ln-form{width:85%;max-width:320px;z-index:2}
.ln-input{width:100%;padding:14px 16px;margin-bottom:12px;background:#fff;border:1px solid #E5E5EA;border-radius:12px;color:#1C1C1E;font-size:15px;backdrop-filter:none;transition:border .2s}
.ln-input::placeholder{color:#AEAEB2}

.ln-btn:active{transform:scale(.96)}
.ln-foot{color:#AEAEB2;font-size:11px;margin-top:20px;z-index:2}

.ln-tabs{display:flex;gap:0;margin-bottom:18px;z-index:2;width:85%;max-width:320px}

.ln-switch{color:#007AFF;font-size:12px;margin-top:14px;z-index:2;cursor:pointer;text-decoration:underline}

.notif-dd{position:absolute;top:48px;right:8px;width:300px;max-height:400px;background:var(--white);border-radius:var(--r2);box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:999;overflow:hidden;display:none;flex-direction:column}

.notif-item{display:flex;gap:10px;padding:10px 14px;cursor:pointer;transition:background .15s}

#mainContent{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

.hdr{padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#DCEEFB 0%,#F4FAFE 100%);position:sticky;top:0;z-index:10}
.hdr-title{font-size:19px;font-weight:600;background:linear-gradient(135deg,var(--pri),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.ban{padding:6px 16px 10px;position:relative;width:100%;box-sizing:border-box}

.feed{padding:6px 8px 16px;column-count:2;column-gap:6px}

.fc-feat{position:absolute;top:6px;right:6px;z-index:2;background:var(--orange);color:#fff;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700}
/* 引路星光 · 成长阶段导航 */
.st-stage-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.st-stage-bar::-webkit-scrollbar{display:none}
.st-stage{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 6px;background:var(--card);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;min-width:62px;border:1.5px solid transparent;transition:.15s}

.exp-sec-t{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 2px;margin-top:6px}

.exp-more{font-size:12px;color:var(--coral);cursor:pointer;font-weight:600}
.exp-list{padding:8px 14px 16px}
.exp-card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;border-left:3px solid var(--coral)}

.st-stage:active{transform:scale(.94)}
.qa-promo:active{transform:scale(.98)}
.exp-today{display:flex;align-items:center;gap:12px;margin:12px 14px;padding:14px;background:linear-gradient(135deg,#fff,#f3f0ff);border:1px solid #e8e2ff;border-radius:16px;cursor:pointer;transition:transform .15s}

.exp-today.flip{animation:expFlip .3s ease}

.exp-today-ic{font-size:24px}
.exp-today-bd{flex:1;min-width:0}

.ov{position:fixed;top:0;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--white);z-index:100;transform:translateX(100%);transition:transform .28s ease;overflow-y:auto}

.pd-name{font-size:14px;font-weight:600}
.pd-time{font-size:11px;color:var(--text3)}
.pd-title{font-size:17px;font-weight:600;margin-bottom:10px;line-height:1.4}
.pd-text{font-size:14px;line-height:1.8;color:var(--text2);margin-bottom:16px}

.pd-act{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text3);cursor:pointer;transition:color .2s}

.cm-sec h3{font-size:14px;margin-bottom:10px}
.cm-item{display:flex;gap:8px;margin-bottom:12px}

.cm-body{flex:1}
.cm-name{font-size:12px;font-weight:600}
.cm-txt{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.5}

.flw.on{background:var(--bg);color:var(--text3);border-color:var(--border)}

.st-banner::after{content:"";position:absolute;bottom:-30px;left:-10%;width:120%;height:50px;background:var(--bg);border-radius:50%}
.st-banner h2{font-size:20px;font-weight:600;margin-bottom:6px;position:relative;z-index:1}
.st-banner p{font-size:13px;opacity:.85;position:relative;z-index:1}
.st-tabs{display:flex;padding:10px 16px;gap:8px;background:var(--white);border-bottom:1px solid var(--border)}
.st-tab{padding:6px 14px;border-radius:16px;font-size:12px;background:var(--bg);color:var(--text2);cursor:pointer;transition:all .15s;font-weight:500}

/* 统一按钮（之前无任何样式） */

.sync-btn{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#00AEEC,#6BC9F5);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .12s,box-shadow .12s;box-shadow:0 4px 12px rgba(0,174,236,.25)}
.sync-btn:active{transform:scale(.98)}
.sync-btn-ghost{background:#f1f3f5;color:var(--text2);box-shadow:none;margin-top:8px}
.sync-card{padding:14px;border-radius:12px;background:linear-gradient(135deg,#f0f9ff,#e6f7ff);border:1px solid #ccebff;margin-bottom:14px}
.sync-status{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.sync-status-dot{width:10px;height:10px;border-radius:50%;background:#b2bec3}

.sync-switch{width:44px;height:24px;border-radius:12px;background:#dfe6e9;position:relative;cursor:pointer;transition:background .2s}
.sync-switch.on{background:var(--pri)}
.sync-switch::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}

.sync-input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:12px;margin-top:6px}

.srch-results{padding:4px 16px 0;font-size:12px;color:var(--pri-d);display:none}

#chatOv{display:none;flex-direction:column}

.pr-dyn-list{padding:0 0 8px}

.gp-input{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:var(--white);position:sticky;bottom:0}

.msg-full-list{padding:0}

.msg-full-body{flex:1;min-width:0}
.msg-full-body h4{font-size:14px;font-weight:600;margin-bottom:3px}
.msg-full-body p{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-full-right{text-align:right;flex-shrink:0}

.follow-empty{text-align:center;padding:30px 20px;color:var(--text3)}

.brand-title{font-family:var(--font);font-size:19px;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,var(--pri),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block;line-height:1.2}

#yfToast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(45,52,54,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:80%;text-align:center;line-height:1.5;backdrop-filter:blur(6px)}

.yf-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 24px;text-align:center;color:var(--text3)}

.yf-empty button{padding:8px 20px;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;border-radius:18px;font-size:12px;font-weight:500;box-shadow:0 4px 12px rgba(0,174,236,.25)}
.yf-empty button:active{transform:scale(.96)}

.av-wrap{position:relative;display:inline-block}
.av-edit-badge{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--white);box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--white);z-index:10}

.av-frame.f2{display:block;border-color:var(--orange)}
.av-frame.f3{display:block;border-color:#6c5ce7}

.avm-preview{display:flex;justify-content:center;margin:10px 0 16px}

.avm-section{margin-bottom:14px}
.avm-label{font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:500}
.avm-gradients{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avm-grad{aspect-ratio:1;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:transform .12s}

.avm-frames{display:flex;gap:10px;justify-content:center}

.md-row-v5{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 0}

.mw-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}

.md-detail{padding:20px;text-align:center}

.level-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(0,174,236,.08),rgba(108,92,231,.08));border-radius:14px;padding:14px;cursor:pointer;transition:transform .12s}

.ld-list{padding:8px 16px 20px}

.celebrate{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.celebrate.show{opacity:1;pointer-events:auto}
.celebrate-box{background:#fff;border-radius:20px;padding:28px 24px;width:82%;max-width:320px;text-align:center;transform:scale(.8);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}

.celebrate-emoji{width:80px;height:80px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff4d6,#ffd93d);box-shadow:0 8px 24px rgba(255,165,2,.35);animation:bounceIn .6s}
@keyframes bounceIn{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.celebrate-box h3{font-size:18px;font-weight:600;margin-bottom:6px}
.celebrate-box p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:18px}
.celebrate-box button{width:100%;padding:12px;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;border-radius:12px;font-size:14px;font-weight:500}

.ban{position:relative}

.onboard{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.onboard.show{display:flex}
.onboard-spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.7);pointer-events:none;transition:all .35s}
.onboard-tip{position:absolute;background:#fff;border-radius:14px;padding:16px 18px;width:260px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:2}
.onboard-tip h4{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--pri)}

@keyframes yfShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes slideUpSheet{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}

.bg-chip{aspect-ratio:1.6/1;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s;border:1px solid var(--border)}
.bg-chip:active{transform:scale(.94)}
.cm-sticky{position:sticky;bottom:0;background:var(--white);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:5}

.emoji-bar{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--white);border-top:1px solid var(--border);max-height:140px;overflow-y:auto}
.emoji-bar span{font-size:22px;padding:4px 6px;cursor:pointer;border-radius:6px;transition:background .12s;line-height:1}

.cm-emoji-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg);font-size:18px;cursor:pointer;flex-shrink:0}
.cm-emoji-btn:active{transform:scale(.9)}
.cm-stk-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg);color:var(--text2);cursor:pointer;flex-shrink:0;margin-left:-4px}
.cm-stk-btn:active{transform:scale(.9)}
.cm-sticker{max-height:120px;max-width:80%;border-radius:8px;display:block;margin-top:6px;background:var(--bg)}
.like-pop{position:absolute;pointer-events:none;font-size:24px;animation:heartPop .5s ease;z-index:10}
.fc-enter{animation:fcDriftIn .55s cubic-bezier(.22,1,.36,1) both}
@keyframes fcDriftIn{from{opacity:0;transform:translate(26px,-30px) rotate(-2.5deg) scale(.94)}to{opacity:1;transform:none}}
.fc-imgs img,.fc-img{animation:fcFloat 6.5s ease-in-out infinite;will-change:transform}
@keyframes fcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.feed .fc:nth-child(3n) .fc-imgs img,.feed .fc:nth-child(3n) .fc-img{animation-delay:-2.2s}

/* ============ 青帆设计系统 v2 · Apple 向（2026-09-29）============ */
/* 1) 基底：iOS 系统灰，白卡浮于其上 */

.bz-read b{color:#c0392b;font-weight:700}
.bz-read-tag{display:inline-block;font-size:11px;font-weight:700;color:#9b6b1f;background:#f3e9d2;border-radius:4px;padding:1px 7px;margin-right:8px;vertical-align:1px}
.wheel-spin-in{animation:yfWheelIn 1s cubic-bezier(.2,.7,.3,1.08) both;transform-origin:50% 50%}
.wheel-spin-in.slow{animation-duration:1.35s}
@keyframes yfWheelIn{0%{transform:rotate(-150deg) scale(.5);opacity:0}55%{opacity:1}100%{transform:rotate(0deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.wheel-spin-in{animation:none}}

function yfSignDeg(lon){var d=((lon%360)+360)%360%30;return d<0?d+30:d;}

function yfJulianDayFromDate(date){
if(typeof Astronomy!=='undefined'&&Astronomy.JulianDay)return Astronomy.JulianDay(date);
var y=date.getUTCFullYear(),m=date.getUTCMonth()+1,d=date.getUTCDate();
var h=date.getUTCHours()+date.getUTCMinutes()/60;
if(m<=2){y-=1;m+=12;}
var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
var JD=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+h/24+B-1524.5;
return JD;
}

function yfMeanNorthNode(date){
var jd=yfJulianDayFromDate(date);
var T=(jd-2451545.0)/36525;
var omega=125.0445479-1934.1362891*T+0.0020754*T*T+T*T*T/467441-T*T*T*T/60616000;
return ((omega%360)+360)%360;
}

function yfObliquity(date){
var v=Astronomy.GeoVector(Astronomy.Body.Sun,date,true);
var pole={x:0,y:0,z:1,t:v.t};
var e=Astronomy.Ecliptic(pole);
return 90-e.elat;
}

function yfCalculateAscendant(date,lat,lon){
var lst=Astronomy.SiderealTime(date)*15+lon;
lst=((lst%360)+360)%360;
var eps=yfObliquity(date)*Math.PI/180;
var latRad=lat*Math.PI/180;
var lstRad=lst*Math.PI/180;
// 标准上升点公式：tan(λ) = -cos(θ) / ( sin(θ)·cos(ε) + tan(φ)·sin(ε) )
//  θ=地方恒星时  ε=黄赤交角  φ=地理纬度
// 注意：分子是 -cos(θ)，分母首项是 sin(θ)·cos(ε)；
// 早期版本把 sin/cos 写反且漏了负号，导致上升星座整体偏移（已用 PyEphem 对撞验证）。
var y=-Math.cos(lstRad);
var x=Math.sin(lstRad)*Math.cos(eps)+Math.tan(latRad)*Math.sin(eps);
var asc=Math.atan2(y,x)*180/Math.PI;
return ((asc%360)+360)%360;
}

function yfMakeUtcDate(dateStr,timeStr,offsetMinutes){
var p=dateStr.split('-'),t=(timeStr||'12:00').split(':');
var year=parseInt(p[0]),month=parseInt(p[1])-1,day=parseInt(p[2]);
var hour=parseInt(t[0]),minute=parseInt(t[1]||0);
return new Date(Date.UTC(year,month,day,hour,minute)-offsetMinutes*60000);
}

function yfCalculateBirthChart(dateStr,timeStr,lat,lon,offsetMinutes){
var date=yfMakeUtcDate(dateStr,timeStr,offsetMinutes||480);
var bodies={Sun:Astronomy.Body.Sun,Moon:Astronomy.Body.Moon,Mercury:Astronomy.Body.Mercury,Venus:Astronomy.Body.Venus,Mars:Astronomy.Body.Mars,Jupiter:Astronomy.Body.Jupiter,Saturn:Astronomy.Body.Saturn};
var planets={};
for(var k in bodies){
var v=Astronomy.GeoVector(bodies[k],date,true);
var e=Astronomy.Ecliptic(v);
planets[k]={planet:k,longitude:e.elon,sign:yfSignFromLongitude(e.elon),degree:yfSignDeg(e.elon)};
}
var ascLon=yfCalculateAscendant(date,lat,lon);
planets.Ascendant={planet:'Ascendant',longitude:ascLon,sign:yfSignFromLongitude(ascLon),degree:yfSignDeg(ascLon)};
var nodeLon=yfMeanNorthNode(date);
planets.NorthNode={planet:'NorthNode',longitude:nodeLon,sign:yfSignFromLongitude(nodeLon),degree:yfSignDeg(nodeLon)};
return{date:dateStr,time:timeStr,lat:lat,lon:lon,planets:planets,bigThree:{sun:planets.Sun,moon:planets.Moon,asc:planets.Ascendant}};
}

}

// 渲染圆形星盘图（SVG）
// 注意：SVG 呈现属性（XML 属性）不支持 var()，必须放进 style="" 内的 CSS 才生效，
// 否则外圈/连线会被当成非法值而不渲染，星盘看起来“没有图”。
function yfRenderWheelSVG(chart,w,h){
w=w||320;h=h||320;
var cx=Math.round(w/2),cy=Math.round(h/2),R=Math.min(w,h)/2-10;
var rOuter=R,rInner=R-38,rOrbit=R-62,rPlanet=R-78;
var signSymbols=['♈\uFE0E','♉\uFE0E','♊\uFE0E','♋\uFE0E','♌\uFE0E','♍\uFE0E','♎\uFE0E','♏\uFE0E','♐\uFE0E','♑\uFE0E','♒\uFE0E','♓\uFE0E'];
var signColors=['#ff8a8a','#5fe0b0','#ffd76e','#8ecbff','#ffc04d','#b8c4d4','#c0b3ff','#e2e8f0','#ff9e7a','#7cc7ff','#5fe0d0','#ff9ec4'];
function rad(deg){return (deg-90)*Math.PI/180;}
function xy(r,deg){return {x:cx+r*Math.cos(rad(deg)),y:cy+r*Math.sin(rad(deg))};}
var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:'+w+'px;height:auto;display:block;margin:0 auto">';
svg+='<defs>';
svg+='<radialGradient id="natalSky" cx="50%" cy="42%" r="75%"><stop offset="0%" stop-color="#242a4d"/><stop offset="55%" stop-color="#1a1d38"/><stop offset="100%" stop-color="#12142a"/></radialGradient>';
svg+='<radialGradient id="natalGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(140,120,255,.4)"/><stop offset="60%" stop-color="rgba(140,120,255,.08)"/><stop offset="100%" stop-color="rgba(140,120,255,0)"/></radialGradient>';
svg+='</defs>';
svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rOuter+'" fill="url(#natalSky)"/>';
svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(rOrbit+16)+'" fill="url(#natalGlow)"/>';
for(var si=0;si<46;si++){
var ang=(si*137.508)%360;var rr=(rOuter-6)*(((si*89)%100)/100);
var sp=xy(rr,ang);
svg+='<circle cx="'+sp.x.toFixed(1)+'" cy="'+sp.y.toFixed(1)+'" r="'+((si%3===0)?1.3:0.7)+'" fill="rgba(255,255,255,'+(((si*53)%40)/100+0.15).toFixed(2)+')"/>';
}
var lineC='rgba(255,255,255,.28)';
svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rOuter+'" style="fill:none;stroke:'+lineC+';stroke-width:1"/>';
svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rInner+'" style="fill:none;stroke:'+lineC+';stroke-width:1"/>';
svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rOrbit+'" style="fill:none;stroke:rgba(255,255,255,.16);stroke-width:1;stroke-dasharray:2 3"/>';
svg+='<circle cx="'+cx+'" cy="'+cy+'" r="2.4" fill="rgba(255,255,255,.85)"/>';
for(var i=0;i<12;i++){
var start=i*30,end=(i+1)*30,mid=i*30+15;
var a0=xy(rOuter,start),a1=xy(rOuter,end);
svg+='<path d="M '+cx+' '+cy+' L '+a0.x+' '+a0.y+' A '+rOuter+' '+rOuter+' 0 0 1 '+a1.x+' '+a1.y+' Z" fill="'+(i%2===0?'rgba(255,255,255,.035)':'rgba(255,255,255,0)')+'"/>';
var m=xy(rOuter-19,mid);
svg+='<text x="'+m.x+'" y="'+m.y+'" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="'+signColors[i]+'" font-weight="600"> '+signSymbols[i]+'</text>';
var n=xy(rOuter-31,mid);
svg+='<text x="'+n.x+'" y="'+n.y+'" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="rgba(255,255,255,.4)" opacity=".9"> '+((mid+360)%360)+'\u00B0</text>';
}
var showOrder=[{k:'Ascendant',r:90},{k:'Sun',r:90},{k:'Moon',r:90},{k:'Mercury',r:75},{k:'Venus',r:75},{k:'Mars',r:75},{k:'Jupiter',r:60},{k:'Saturn',r:60},{k:'NorthNode',r:60}];
var placed=[];
for(var pi=0;pi<showOrder.length;pi++){
var pk=showOrder[pi].k,p=chart.planets[pk];if(!p)continue;
var deg=p.longitude,meta=yfPlanetMeta(pk),sm=yfSignMeta(p.sign);
var pr=(pk==='Ascendant'||pk==='Sun'||pk==='Moon')?rPlanet+10:rPlanet;
var pos=xy(pr,deg);
for(var ri=0;ri<placed.length;ri++){
var d0=placed[ri];
var dx=d0.x-pos.x,dy=d0.y-pos.y,dist=Math.sqrt(dx*dx+dy*dy);
if(dist<18){pr+=18;pos=xy(pr,deg);ri=-1;}
}
placed.push({x:pos.x,y:pos.y});
var lineTo=xy(rOrbit,deg);
svg+='<line x1="'+lineTo.x+'" y1="'+lineTo.y+'" x2="'+pos.x+'" y2="'+pos.y+'" style="stroke:'+sm.color+';stroke-width:1;opacity:.7"/>';
var isBig=(pk==='Ascendant'||pk==='Sun'||pk==='Moon');
var bg=isBig?sm.color:'rgba(26,29,56,.92)';
var fg=isBig?'#ffffff':'#e8ecf5';
svg+='<circle cx="'+pos.x+'" cy="'+pos.y+'" r="'+(isBig?13:10)+'" style="fill:'+bg+';stroke:'+(isBig?'rgba(255,255,255,.55)':'rgba(255,255,255,.28)')+';stroke-width:1"/>';
svg+='<text x="'+pos.x+'" y="'+pos.y+'" text-anchor="middle" dominant-baseline="middle" font-size="'+(isBig?12:10)+'" style="fill:'+fg+'" font-weight="'+(isBig?'700':'500')+'">'+meta.icon+'</text>';
}
svg+='</svg>';
return svg;
}

var fUser=null,tUser=null;
for(var i=0;i<users.length;i++){
if(users[i].id==followerId){fUser=users[i];}
if(users[i].id==followingId){tUser=users[i];}
}
if(!fUser||!tUser)return false;
if(!fUser.following)fUser.following=[];
if(fUser.following.indexOf(followingId)===-1)fUser.following.push(followingId);
tUser.followers=(tUser.followers||0)+1;
_YF_cache.users=users;_yfSave('users',users);
return true;
},

getStats:function(){
var users=_YF_cache.users||[];
var posts=_YF_cache.posts||[];
var stars=_YF_cache.stars||[];
var today=_yfToday();
var todayActive=0,newUsers=0,todayPosts=0;
var activeUserSet={};
for(var i=0;i<posts.length;i++){
var p=posts[i];
var pDay=(p.time||'').substring(0,10);
if(pDay===today){
todayPosts++;
if(p.author)activeUserSet[p.author]=1;
}
if(p.comments){for(var j=0;j<p.comments.length;j++){}}
}
for(var i=0;i<users.length;i++){
if((users[i].created||'').substring(0,10)===today)newUsers++;
}
todayActive=Object.keys(activeUserSet).length;
var userChart=[0,0,0,0,0,0,0],postChart=[0,0,0,0,0,0,0];
var now=new Date();
for(var i=0;i<7;i++){
var d=new Date(now);d.setDate(d.getDate()-(6-i));
var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
for(var j=0;j<users.length;j++){if((users[j].created||'').substring(0,10)===ds)userChart[i]++;}
for(var j=0;j<posts.length;j++){if((posts[j].time||'').substring(0,10)===ds)postChart[i]++;}
}
return{
totalUsers:users.length,todayActive:todayActive,newUsers:newUsers,
totalPosts:posts.length,todayPosts:todayPosts,
pendingPosts:posts.filter(function(p){return p.status==='pending';}).length,
totalStars:stars.length,
totalGroups:(_YF_cache.groups||[]).length,
totalExchanges:(_YF_cache.exchanges||[]).length,
totalReports:(_YF_cache.reports||[]).filter(function(r){return r.status==='pending';}).length,
userChart:userChart,postChart:postChart
};
},

// ===================== [B2] 纯 JS SHA-256（自实现，禁外部 CDN；用于密码散列与手机号哈希） =====================
function yfSha256(ascii){
  try{
    function rightRotate(v,a){return (v>>>a)|(v<<(32-a));}
    var mathPow=Math.pow,maxWord=mathPow(2,32),result='',i,j;
    var words=[],asciiBitLength=ascii.length*8;
    var hash=[],k=[],primeCounter=0,isComposite={};
    for(var candidate=2;primeCounter<64;candidate++){
      if(!isComposite[candidate]){
        for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
        hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
        k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
      }
    }
    ascii=unescape(encodeURIComponent(ascii));
    ascii+='\x80';
    while(ascii.length%64-56)ascii+='\x00';
    for(i=0;i<ascii.length;i++){
      j=ascii.charCodeAt(i);
      if(j>>8)return '';
      words[i>>2]|=j<<((3-i)%4)*8;
    }
    words[words.length]=(asciiBitLength/maxWord)|0;
    words[words.length]=asciiBitLength;
    for(j=0;j<words.length;){
      var w=words.slice(j,j+=16);
      var oldHash=hash.slice(0);
      for(i=16;i<64;i++){
        var w15=w[i-15],w2=w[i-2];
        var s0=rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3);
        var s1=rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
      }
      var a=hash[0],b=hash[1],c=hash[2],d=hash[3],e=hash[4],f=hash[5],g=hash[6],h=hash[7];
      for(i=0;i<64;i++){
        var S1=rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25);
        var ch=(e&f)^(~e&g);
        var temp1=(h+S1+ch+k[i]+w[i])|0;
        var S0=rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22);
        var maj=(a&b)^(a&c)^(b&c);
        var temp2=(S0+maj)|0;
        h=g;g=f;f=e;e=(d+temp1)|0;d=c;c=b;b=a;a=(temp1+temp2)|0;
      }
      hash[0]=(hash[0]+a)|0;hash[1]=(hash[1]+b)|0;hash[2]=(hash[2]+c)|0;hash[3]=(hash[3]+d)|0;
      hash[4]=(hash[4]+e)|0;hash[5]=(hash[5]+f)|0;hash[6]=(hash[6]+g)|0;hash[7]=(hash[7]+h)|0;
    }
    for(i=0;i<8;i++){
      for(j=3;j+1;j--){
        var b2=(hash[i]>>(j*8))&255;
        result+=((b2>>4).toString(16))+((b2&15).toString(16));
      }
    }
    return result;
  }catch(e){ return ''; }
}
function yfHashPassword(salt,pass){ return yfSha256(String(salt||'')+':'+String(pass||'')); }

// ===================== [家信收件箱] 家长来信检测 + 未读标记（用户级 key） =====================
// 契约：student_letters 集合，from:'parent' 且 status:'approved' = 已送达学生；云端审核侧不写学生通知，
// 故在增量 pull 合并后本地检测新送达的信 → 未读集合（yf_u_<uid>_letter_unread）+ 铃铛通知，点开信箱即清。
function yfIsMyLetter(l){
  try{
    if(!l||typeof currentUser==='undefined'||!currentUser)return false;
    var uid=String(currentUser.uid||currentUser.id||'');
    if(String(l.studentId||'')===uid)return true;
    if(currentUser.id!=null&&String(l.student_id||'')===String(currentUser.id))return true;
    if(l.student_phone&&currentUser.phone&&String(l.student_phone)===String(currentUser.phone))return true;
    return false;
  }catch(e){ return false; }
}
function yfLetterUnreadGet(){ return yfUGetJSON('letter_unread',[])||[]; }

function yfDetectParentLetters(){
  try{
    if(typeof currentUser==='undefined'||!currentUser)return;
    var letters=_YF_cache.letters||[];
    if(!letters.length)return;
    var seen=yfUGetJSON('letter_seen',[])||[];
    var unread=yfLetterUnreadGet();
    var changedS=false,changedU=false;
    for(var i=0;i<letters.length;i++){
      var l=letters[i];
      if(!l||l.from!=='parent'||l.status!=='approved'||!yfIsMyLetter(l))continue;
      var lid=String(l.id!=null?l.id:('t'+(l.created_at||'')));
      if(seen.indexOf(lid)===-1){
        seen.push(lid);changedS=true;
        if(unread.indexOf(lid)===-1){unread.push(lid);changedU=true;}
        // 首次检测到：本地生成铃铛通知（云端审核侧不写学生通知）
        try{YangFanData.createNotification({userId:currentUser.id,type:'letter',text:'你收到一封来自家长的家书「'+(l.title||'家书')+'」'});}catch(e){}
      }
    }
    if(seen.length>500)seen=seen.slice(-500);
    if(changedS)yfUSetJSON('letter_seen',seen);
    if(changedU)yfLetterUnreadSet(unread);
  }catch(e){}
}

// ===================== 后端抽象层 YfBackend =====================
// 设计原则：本地优先（默认） + 腾讯云 CloudBase（可选启用）
// - local      ：数据只存本机 localStorage。最安全（数据不出设备）、零存储成本、无规模上限；
//                社交内容仅本机可见，适合先验证产品 / 隐私优先场景。
// - cloudbase  ：腾讯云开发环境（手机号注册/登录 + 云数据库集合），跨用户数据天然共享、可水平扩展，
//                解决了飞书 Bitable「单一主凭证 + 共享 Base + 行数/存储上限」的扩展与安全隐患。
// 飞书 Bitable 已弃用（数据安全与存储扩展顾虑）。
// 注意：CloudBase SDK 由同目录下的 cloudbase.browser.js 提供（本地文件，非外部 CDN）。
var YfBackend = {
  // [A1] 上云集合：本地表名 letters 的云端集合映射为 student_letters（与家长端 parent_letters 区分）
  COLLECTIONS: ['posts','users','stars','groups','opps','announces','shop_items','bad_words','works','tasks','messages','notifications','reports','exchanges','banners','tags','student_letters'],
  CLOUD_TABLE_MAP:{ letters:'student_letters' },
  localToCloud:function(key){ return this.CLOUD_TABLE_MAP[key]||key; },
  cloudToLocal:function(name){ for(var k in this.CLOUD_TABLE_MAP){ if(this.CLOUD_TABLE_MAP[k]===name) return k; } return name; },
  get backend(){ try{ return localStorage.getItem('yf_backend')||'cloudbase'; }catch(e){ return 'cloudbase'; } },
  get cbEnv(){ try{ return localStorage.getItem('yf_cb_env')||'qingfan-parent-d6gloe72ka6ed4b27'; }catch(e){ return 'qingfan-parent-d6gloe72ka6ed4b27'; } },

  pushDoc:function(table, doc){

  _filterPulled:function(key, recs){
    try{
      var me=this.myUid(), site=this.mySiteId();
      if(key==='messages'){
        return recs.filter(function(m){ return String(m.fromId)===me||String(m.toId)===me; });
      }
      if(key==='notifications'){
        return recs.filter(function(n){ return !n.toUid||String(n.toUid)===me; });

      if(key==='posts'||key==='groups'||key==='letters'||key==='works'){
        return recs.filter(function(d){
          if(!d) return false;
          if(d.siteId&&String(d.siteId)!==String(site)&&String(d.uid||'')!==String(me)) return false;
          if(key==='posts'&&d.status==='pending'&&!(d.author_uid&&String(d.author_uid)===String(me))) return false;

  _mergeLocal:function(key, recs){

        var cr=recs[r]; if(!cr||cr.id==null)continue;
        var lr=localMap[String(cr.id)];
        var merged = lr ? this._mergeDoc(key, lr, cr) : cr;
        out.push(merged); seen[String(cr.id)]=true;
      }
      for(var i2=0;i2<local.length;i2++){
        if(local[i2]&&local[i2].id!=null && !seen[String(local[i2].id)]) out.push(local[i2]);

  _mergeDoc:function(key, local, remote){
    var m=JSON.parse(JSON.stringify(remote));

    if(key==='posts'){
      m.comments = this._unionBy(local.comments, remote.comments);
      m.likedBy = this._unionArr(local.likedBy, remote.likedBy);
      m.images = (remote.images&&remote.images.length)?remote.images:(local.images||[]);
    }
    return m;
  },
  _unionBy:function(a,b){
    a=a||[]; b=b||[]; var map={}; var out=[];
    a.concat(b).forEach(function(x){

      var id=(x.cid!=null)?x.cid:(x.id!=null?x.id:null);

      var key=String(id);
      if(!map[key]){map[key]=true; out.push(x);}

    return out;
  },
  _unionArr:function(a,b){
    a=a||[]; b=b||[]; var s={}; var out=[];

function yfToggleCat(el,cat){

else{

function yfCalcRecommend(){
var interests=_rgData.interests;
var posts=YangFanData.getPosts({status:'approved'});
var counts={},order=[];
for(var i=0;i<posts.length;i++){
var p=posts[i];
if(!p.author||interests.indexOf(p.tag)===-1)continue;
if(currentUser&&p.author===currentUser.name)continue;
if(!counts[p.author]){counts[p.author]={cnt:0,tags:{}};order.push(p.author);}
counts[p.author].cnt++;
counts[p.author].tags[p.tag]=1;
}
var users=YangFanData.getUsers();
var byName={};
for(var j=0;j<users.length;j++)byName[users[j].name]=users[j];
var recs=[];
for(var k=0;k<order.length;k++){
var nm=order[k];
var u=byName[nm];
if(!u||String(u.id)===String(currentUser?currentUser.id:''))continue;
var tagArr=[];
for(var t in counts[nm].tags)tagArr.push(t);
recs.push({id:u.id,name:nm,cnt:counts[nm].cnt,tags:tagArr});
}
recs.sort(function(a,b){return b.cnt-a.cnt;});
return recs.slice(0,6);
}

inboxLetters.sort(function(a,b){return (b.created_at||0)-(a.created_at||0);});
var inboxUnreadN=inboxLetters.filter(function(l){return unreadIds.indexOf(String(l.id!=null?l.id:('t'+(l.created_at||''))))>-1;}).length;
var listHtml='';
if(inboxLetters.length){
listHtml+='<div class="card" style="margin-top:14px"><div class="card-t">收到的家书'+(inboxUnreadN?'<span style="float:right;font-size:10px;color:#fff;background:#ff6b6b;border-radius:8px;padding:1px 7px">'+inboxUnreadN+' 封未读</span>':'')+'</div>';
for(var _ii=0;_ii<inboxLetters.length;_ii++){
var il=inboxLetters[_ii];
var ilPrev=(il.lines&&il.lines.length)?il.lines[0]:'(无内容)';
var ilUnread=unreadIds.indexOf(String(il.id!=null?il.id:('t'+(il.created_at||''))))>-1;
listHtml+='<div class="row" style="padding:10px 4px;border-top:1px solid #eee"><div style="font-weight:600;color:'+(ilUnread?'#8A2E2E':'#4a3a22')+'">'+(ilUnread?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff6b6b;margin-right:5px;vertical-align:2px"></span>':'')+'家长的信 · '+ltEsc(il.title||'家书')+'</div><div style="font-size:12px;color:#999;margin:2px 0">'+ltEsc(il.time_txt||il.created||'')+'</div><div style="font-size:13px;color:#666">'+ltEsc(ilPrev)+'</div></div>';
}
listHtml+='</div>';
}
// 我寄出的信：pending=待家长审核 / approved=家长已阅 / rejected=未通过
var myLetters=letters.filter(function(l){return l&&l.from!=='parent'&&yfIsMyLetter(l);});

listHtml+='<div class="card" style="margin-top:14px"><div class="card-t">我寄出的家书</div>';

// [家书审核状态] 云端回传 status：approved=家长已阅 / rejected=未通过 / pending=待家长审核；本地新写无 status 不显示角标

function startBanner(){
stopBanner();
bannerIdx=0;
var tk=document.getElementById("banTrack");
if(!tk)return;
var slides=tk.querySelectorAll(".ban-slide");
if(slides.length<2)return;
// ensure first is visible
for(var i=0;i<slides.length;i++){slides[i].classList.remove("on");slides[i].style.left="0";slides[i].style.opacity="0";slides[i].style.zIndex="0";}
slides[0].classList.add("on");slides[0].style.opacity="1";slides[0].style.zIndex="2";
bannerTmr=setInterval(function(){
try{
var tk2=document.getElementById("banTrack");if(!tk2)return;
var ss=tk2.querySelectorAll(".ban-slide");var bc=ss.length;if(bc<2)return;
var cur=bannerIdx;
var nxt=(bannerIdx+1)%bc;
// prepare next slide off-screen to the right
ss[nxt].style.transition="none";
ss[nxt].style.left="100%";
ss[nxt].style.opacity="1";
ss[nxt].style.zIndex="2";
ss[cur].style.zIndex="1";
// force reflow
void ss[nxt].offsetWidth;
// animate both: current slides left, next slides in
ss[nxt].style.transition="left .5s ease-out";
ss[cur].style.transition="left .5s ease-out";
ss[nxt].style.left="0";
ss[cur].style.left="-100%";
// update dots
var ds=document.querySelectorAll("#banDots .ban-dot");
for(var d=0;d<ds.length;d++){if(d===nxt)ds[d].classList.add("on");else ds[d].classList.remove("on");}
// after animation, clean up
setTimeout(function(){
ss[cur].classList.remove("on");
ss[cur].style.opacity="0";
ss[cur].style.zIndex="0";
ss[cur].style.transition="none";
ss[nxt].classList.add("on");
},520);
bannerIdx=nxt;
}catch(e){console.warn('banner error:',e);}
},4000);
}
function _setBanner(idx){
var tk=document.getElementById("banTrack");if(!tk)return;
var slides=tk.querySelectorAll(".ban-slide");if(slides.length===0)return;
var ds=document.querySelectorAll("#banDots .ban-dot");
if(idx<0)idx=0;if(idx>=slides.length)idx=slides.length-1;
for(var i=0;i<slides.length;i++){
if(i===idx){slides[i].classList.add("on");slides[i].style.opacity="1";slides[i].style.zIndex="2";slides[i].style.left="0";}
else{slides[i].classList.remove("on");slides[i].style.opacity="0";slides[i].style.zIndex="0";}
}
for(var j=0;j<ds.length;j++){if(j===idx)ds[j].classList.add("on");else ds[j].classList.remove("on");}
}
function goBanner(i){
var tk=document.getElementById("banTrack");if(!tk)return;
var slides=tk.querySelectorAll(".ban-slide");var bc=slides.length;if(bc===0)return;
var idx=((i%bc)+bc)%bc;
// jump to target without animation
for(var k=0;k<slides.length;k++){slides[k].style.transition="none";}
_setBanner(idx);
bannerIdx=idx;
// restart auto-play
stopBanner();
// force reflow then restart
void tk.offsetWidth;
startBanner();
}

function _yfStickerKey(){return 'yf_my_stickers_'+((currentUser&&currentUser.id)||'guest');}
function getMyStickers(){try{return JSON.parse(localStorage.getItem(_yfStickerKey())||'[]');}catch(e){return [];}}
function addMySticker(dataUrl){var s=getMyStickers();s.unshift(dataUrl);if(s.length>50)s=s.slice(0,50);localStorage.setItem(_yfStickerKey(),JSON.stringify(s));return s;}
function removeMySticker(idx){var s=getMyStickers();s.splice(idx,1);localStorage.setItem(_yfStickerKey(),JSON.stringify(s));return s;}
function openStickerPicker(callback){
var s=getMyStickers();
var body='<div style="padding:6px 0">';
body+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><span style="font-size:13px;color:var(--text3)">点击添加或发送表情包</span><label style="background:var(--coral);color:#fff;padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer">+ 添加<input type="file" accept="image/*" style="display:none" onchange="handleStickerUpload(this)"></label></div>';
if(s.length===0){
body+='<div class="yf-empty" style="padding:30px 0"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#b2bec3" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><p>还没有表情包<br>点右上角添加自己喜欢的图</p></div>';
}else{
body+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:260px;overflow-y:auto;padding-right:4px">';
for(var i=0;i<s.length;i++){
body+='<div style="position:relative;background:var(--bg);border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden" onclick="closeModal();('+callback+')('+i+')">';
body+='<img src="'+s[i]+'" style="max-width:90%;max-height:90%;object-fit:contain">';
body+='<div style="position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;cursor:pointer" onclick="event.stopPropagation();event.preventDefault();deleteStickerAndRefresh('+i+',\''+callback+'\')">×</div>';
body+='</div>';
}
body+='</div>';
}
body+='</div>';
openModal('我的表情包',body,'<button class="btn btn-outline" onclick="closeModal()">关闭</button>');
}
function handleStickerUpload(input){
try{
var f=input.files[0];if(!f)return;
compressImg(f,300,0.7).then(function(d){
addMySticker(d);
showToast('表情包已添加','success');
closeModal();
}).catch(function(e){console.error(e);showToast('图片处理失败，请换一张','error');});
input.value='';
}catch(e){showToast('添加失败','error');}
}
function deleteStickerAndRefresh(idx,callback){
removeMySticker(idx);
showToast('已删除','info');
closeModal();
}
function insertStickerMarker(idx){
var s=getMyStickers();if(idx<0||idx>=s.length)return;
var inp=document.getElementById('cmIn');if(!inp)return;
var marker='[sticker:'+s[idx]+']';
if(document.selection){inp.focus();var sel=document.selection.createRange();sel.text=marker;sel.select();}
else if(inp.selectionStart||inp.selectionStart===0){var a=inp.selectionStart,b=inp.selectionEnd;inp.value=inp.value.substring(0,a)+marker+inp.value.substring(b);inp.selectionStart=inp.selectionEnd=a+marker.length;}
else{inp.value+=marker;}
inp.focus();
}
function parseStickerMarkers(txt){
if(!txt)return txt;
return txt.replace(/\[sticker:([^\]]+)\]/g,function(m,url){return '<img src="'+url+'" class="cm-sticker" onload="if(this.naturalHeight>120)this.style.height=\'120px\'">';});
}

function renderCommentText(txt){
if(!txt)return '';
var parts=txt.split(/(\[sticker:[^\]]+\])/g);
var out='';
for(var i=0;i<parts.length;i++){
var p=parts[i];
if(p.indexOf('[sticker:')===0){
var url=p.replace(/^\[sticker:/,'').replace(/\]$/,'');
out+='<img src="'+yfEsc(url)+'" class="cm-sticker" onload="if(this.naturalHeight>120)this.style.height=\'120px\'">';
}else{
out+=yfEsc(p).replace(/\n/g,'<br>');
}
}
return out;
}

function togLk(id){
try{
var b=document.getElementById("lkB"+id),c=document.getElementById("lkC"+id);
if(!b||!c)return;
if(b.classList.contains("liked")){
b.classList.remove("liked");c.textContent=parseInt(c.textContent)-1;

}
}
}catch(e){}
}

YangFanData.addReply(postId,commentId,{n:currentUser?currentUser.name:'我',t:txt,userId:currentUser?currentUser.id:0,pending:(typeof YfBackend!=='undefined'&&YfBackend&&YfBackend.enabled())?true:false});
var p=YangFanData.getPost(postId);
if(p){

notifyUser(c.userId,'reply',(currentUser?currentUser.name:'有人')+'回复了你的评论：'+txt.substring(0,20));
}
}
showPost(postId);
}

function yfSetBackend(mode){
  try{ localStorage.setItem('yf_backend', mode); }catch(e){}

function yfSendPhoneCode(){
  try{
    var inp=document.getElementById('yfPhoneInput');
    var phone=inp?inp.value.trim():'';
    if(!/^1\d{10}$/.test(phone)){ var m=document.getElementById('syncMsg'); if(m)m.textContent='请输入正确的 11 位手机号'; return; }
    var btn=document.getElementById('yfSendCodeBtn'); if(btn){btn.disabled=true;btn.textContent='发送中...';}
    YfBackend.sendPhoneCode(phone).then(function(){
      if(btn){btn.textContent='已发送';setTimeout(function(){if(btn){btn.textContent='重新获取';btn.disabled=false;}},60000);}
      var m=document.getElementById('syncMsg'); if(m)m.textContent='验证码已发送，请查收短信（若长时间未收到，确认环境已开启短信登录）';
    }).catch(function(e){
      if(btn){btn.disabled=false;btn.textContent='获取验证码';}
      var m=document.getElementById('syncMsg'); if(m)m.textContent='发送失败：'+(e&&e.message?e.message:'网络异常或环境未开启短信登录');
    });
  }catch(e){console.error(e);}
}
function yfPhoneLogin(){
  try{
    var inp=document.getElementById('yfPhoneInput');
    var codeInp=document.getElementById('yfPhoneCodeInput');
    var phone=inp?inp.value.trim():'';
    var code=codeInp?codeInp.value.trim():'';
    if(!/^1\d{10}$/.test(phone)){ var m=document.getElementById('syncMsg'); if(m)m.textContent='请输入正确的 11 位手机号'; return; }
    if(!code){ var m2=document.getElementById('syncMsg'); if(m2)m2.textContent='请输入短信验证码'; return; }
    var m=document.getElementById('syncMsg'); if(m)m.textContent='登录中...';
    YfBackend.phoneSignUp(phone, code).then(function(u){ yfAfterPhoneLogin(phone); })
      .catch(function(e){
        YfBackend.phoneSignIn(phone, code).then(function(u){ yfAfterPhoneLogin(phone); })
          .catch(function(e2){ var m3=document.getElementById('syncMsg'); if(m3)m3.textContent='登录失败：'+(e2&&e2.message?e2.message:'验证码错误或已过期'); });
      });
  }catch(e){console.error(e);}
}
function yfAfterPhoneLogin(phone){
  var m=document.getElementById('syncMsg'); if(m)m.textContent='登录成功：'+phone;
  showToast('手机号登录成功','success');
  openSyncPanel();
}

function yfSaveCbConfig(){
  var envInp=document.getElementById('yfCbEnvInput');
  var env=envInp?envInp.value.trim():'';
  if(!env){ var m=document.getElementById('syncMsg'); if(m)m.textContent='请先填写环境 ID'; return; }
  try{ localStorage.setItem('yf_cb_env', env); localStorage.setItem('yf_backend','cloudbase'); localStorage.setItem('yf_cloud_sync_enabled','1'); }catch(e){}
  if(YfBackend._needPhone()){
    var m=document.getElementById('syncMsg'); if(m)m.textContent='已保存环境，请先用上方手机号登录后再同步'; return;
  }
  var m2=document.getElementById('syncMsg'); if(m2)m2.textContent='已保存，正在连接腾讯云...';
  yfSyncNow(true);
}
function yfToggleCloudSync(){
  var cur=YfBackend.enabled();
  var next=!cur;
  try{ localStorage.setItem('yf_cloud_sync_enabled', next?'1':'0'); }catch(e){}
  var toggle=document.getElementById('syncToggle'); if(toggle)toggle.classList.toggle('on',next);
  var dot=document.getElementById('syncStatusDot'); if(dot){dot.classList.remove('on','off','loading','error');dot.classList.add(next?'on':'off');}
  var txt=document.getElementById('syncStatusText'); if(txt)txt.textContent=next?'已开启腾讯云同步':'腾讯云同步已关闭';
  var m=document.getElementById('syncMsg'); if(m)m.textContent=next?'已开启，操作后自动同步':'已关闭，数据仅本机';
  if(next)yfSyncNow();
}
function yfToggleAnonSync(){
  try{
    var next=!(localStorage.getItem('yf_cloud_anon')==='1');
    if(next && YfBackend.backend!=='cloudbase'){ var mm=document.getElementById('syncMsg'); if(mm)mm.textContent='请先选择「腾讯云 CloudBase」后端'; return; }
    if(next && !YfBackend.cbEnv){ var m2=document.getElementById('syncMsg'); if(m2)m2.textContent='请先在上方填写环境 ID，再开启匿名同步'; return; }
    localStorage.setItem('yf_cloud_anon', next?'1':'0');
    var t=document.getElementById('anonSyncToggle'); if(t)t.classList.toggle('on',next);
    if(next){ try{ localStorage.setItem('yf_cloud_sync_enabled','1'); }catch(e){} var tg=document.getElementById('syncToggle'); if(tg)tg.classList.add('on'); }
    var m=document.getElementById('syncMsg'); if(m)m.textContent=next?'已开启匿名同步，正在拉取云端内容…':'已关闭匿名同步，数据仅本机';
    if(next)yfSyncNow();
  }catch(e){}
}
function yfSyncNow(showToastAfter){
  if(!YfBackend.enabled()){
    var m=document.getElementById('syncMsg'); if(m)m.textContent='当前为本地优先模式，未启用云端同步'; return;
  }
  if(YfBackend._needPhone()){
    var m0=document.getElementById('syncMsg'); if(m0)m0.textContent='请先在「数据同步」中用手机号登录后再同步'; return;
  }

    var a=document.createElement('a');a.href=url;a.download='qingfan_backup_'+_yfToday()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);

  }catch(e){showToast('导出失败','error');}

function yfImportData(file){
  try{
    var rd=new FileReader();
    rd.onload=function(e){
      var data=JSON.parse(e.target.result);
      yfApplyData(data);
      var m=document.getElementById('syncMsg');if(m)m.textContent='恢复成功！正在刷新...';
      setTimeout(function(){location.reload();},600);
    };
    rd.readAsText(file);
  }catch(err){showToast('文件无效','error');}
}
function yfGenSyncCode(){
  try{
    var data=yfCollectData();
    var code=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    var area=document.getElementById('syncCodeArea');if(area)area.value=code;
    try{navigator.clipboard.writeText(code);}catch(e){}
    var m=document.getElementById('syncMsg');if(m)m.textContent='同步码已生成并复制到剪贴板';
  }catch(e){showToast('生成失败','error');}
}
function yfRestoreCode(){
  try{
    var area=document.getElementById('syncCodeArea');if(!area||!area.value.trim()){showToast('请先粘贴同步码','warn');return;}
    var json=decodeURIComponent(escape(atob(area.value.trim())));
    var data=JSON.parse(json);
    yfApplyData(data);
    var m=document.getElementById('syncMsg');if(m)m.textContent='恢复成功！正在刷新...';
    setTimeout(function(){location.reload();},600);
  }catch(e){showToast('同步码无效','error');}
}

var _yfQuizState={step:0,scores:{E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0}};

function openMbtiQuiz(){
_yfQuizState={step:0,scores:{E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0}};

}
function renderMbtiQuiz(){
var s=_yfQuizState;
var total=_YF_MBTI_QUIZ.length;
if(s.step>=total){renderMbtiResult();return;}

var pct=Math.round((s.step/total)*100);
var body='<div style="padding:4px 0">';
body+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:12px;color:var(--text3)">第 '+(s.step+1)+' / '+total+' 题</span><span style="font-size:12px;color:#6c5ce7;font-weight:600">'+pct+'%</span></div>';
body+='<div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:24px"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#6c5ce7,#a29bfe);border-radius:3px;transition:width .3s"></div></div>';
body+='<div style="font-size:17px;font-weight:600;line-height:1.6;margin-bottom:24px;color:var(--text1)">'+q.q+'</div>';
body+='<div style="display:flex;flex-direction:column;gap:12px">';
body+='<div onclick="answerMbtiQuiz(\''+q.a.t+'\')" class="quiz-opt" style="padding:16px;background:var(--bg);border:2px solid var(--border);border-radius:12px;cursor:pointer;font-size:14px;line-height:1.5;transition:all .2s">'+q.a.text+'</div>';
body+='<div onclick="answerMbtiQuiz(\''+q.b.t+'\')" class="quiz-opt" style="padding:16px;background:var(--bg);border:2px solid var(--border);border-radius:12px;cursor:pointer;font-size:14px;line-height:1.5;transition:all .2s">'+q.b.text+'</div>';
body+='</div>';
if(s.step>0){body+='<div onclick="_yfQuizState.step--;renderMbtiQuiz()" style="text-align:center;margin-top:18px;font-size:13px;color:var(--text3);cursor:pointer">‹ 上一题</div>';}

openModal('性格测试',body,foot);

function yfAnimateEnergyBars(){
try{
var bars=document.querySelectorAll('[data-target]');

(function(bar){
var t=parseFloat(bar.getAttribute('data-target'))||0;

})(bars[i]);

/* ---------- 通用工具 ---------- */
// 公历日期 → 日序号（proleptic Gregorian ordinal，1970-01-01 = 719163）
function yfDayNumber(y, m, d) {
  return Math.floor(Date.UTC(y, m - 1, d) / 86400000) + 719163;
}
function yfGZ(idx) {
  var i = ((idx % 60) + 60) % 60;
  return { gan: _YF_GAN[i % 10], zhi: _YF_ZHI[i % 12], text: _YF_GAN[i % 10] + _YF_ZHI[i % 12], idx: i };
}
function yfGanIdx(g) { return _YF_GAN.indexOf(g); }
function yfZhiIdx(z) { return _YF_ZHI.indexOf(z); }

/* ---------- 天文节气（牛顿迭代求太阳视黄经对应时刻） ---------- */
function yfSunAppLon(t) {
  var e = Astronomy.Ecliptic(Astronomy.GeoVector(Astronomy.Body.Sun, t, true));
  return ((e.elon % 360) + 360) % 360;
}
function yfMakeTime(date) { return new Astronomy.MakeTime(date); }

// 求太阳视黄经 == targetLon 的时刻（从 approx 起迭代）
function yfFindSolarLon(targetLon, approxDate) {
  var t = yfMakeTime(approxDate);
  for (var i = 0; i < 60; i++) {
    var lon = yfSunAppLon(t);
    var diff = ((targetLon - lon + 540) % 360) - 180;   // 归一到 (-180, 180]
    if (Math.abs(diff) < 1e-9) break;
    var dd = diff / 0.985647;                            // 太阳黄经日变率近似
    if (dd > 45) dd = 45; if (dd < -45) dd = -45;
    t = yfMakeTime(new Date(t.date.getTime() + dd * 86400000));
  }
  return t;
}

// 取某一年的 24 个节气时刻（真实 UTC，顺序：小寒…冬至）
function yfSolarTerms(year, tz) {
  var tzMin = (typeof tz === 'number' && isFinite(tz)) ? tz : 480;
  var out = [];
  // 从小寒（黄经 285，约 1/5）开始，逐节气推进
  var order = [285, 300, 315, 330, 345, 0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240, 255, 270];
  var t = yfFindSolarLon(order[0], new Date(Date.UTC(year, 0, 6, 0, 0, 0) - tzMin * 60000));
  for (var i = 0; i < order.length; i++) {
    t = yfFindSolarLon(order[i], t.date);
    var jq = { lon: order[i] };
    for (var k = 0; k < _YF_JIEQI.length; k++) if (_YF_JIEQI[k].lon === order[i]) { jq = _YF_JIEQI[k]; break; }
    out.push({ name: jq.name, lon: order[i], time: t.date });
  }
  return out;
}

/* ---------- 八字主算法 ---------- */
/**
 * @param {string} dateStr  'YYYY-MM-DD'
 * @param {string} timeStr  'HH:mm'
 * @param {number} lon      出生地经度（东经为正），用于真太阳时修正
 * @param {boolean} useTrueSolar 是否做真太阳时修正
 */
function yfCalcBazi(dateStr, timeStr, lon, useTrueSolar, tzOffsetMinutes) {
  var p = dateStr.split('-'), tt = (timeStr || '12:00').split(':');
  var y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]);
  var hh = parseInt(tt[0]), mi = parseInt(tt[1] || 0);

  // wallMs：把钟表上的「墙上时间」按 UTC 分量暂存，便于做日历运算（非真实时刻）
  var wallMs = Date.UTC(y, m - 1, d, hh, mi);

  // 真太阳时：出生地经度与标准时区经度之差修正，每度 4 分钟。
  // 页面默认为东八区（120°E）。例如北京 116.4°E 需 -14 分钟。
  var solarMs = wallMs;
  if (useTrueSolar && typeof lon === 'number' && isFinite(lon)) {
    solarMs = wallMs + (lon - 120) * 4 * 60000;
  }
  var solarDate = new Date(solarMs);
  var sy = solarDate.getUTCFullYear(), sm = solarDate.getUTCMonth() + 1, sd = solarDate.getUTCDate();
  var shh = solarDate.getUTCHours(), smi = solarDate.getUTCMinutes();

  // 真实 UTC 时刻（用于与天文节气时刻比较——节气算出来的是真实 UTC）
  var tz = (typeof tzOffsetMinutes === 'number' && isFinite(tzOffsetMinutes)) ? tzOffsetMinutes : 480;
  var utcMs = solarMs - tz * 60000;

  /* --- 年柱：以立春为界 --- */
  var y0 = yfFindSolarLon(315, new Date(Date.UTC(sy, 1, 4, 0, 0, 0) - tz * 60000)).date;   // 当年立春（真实 UTC）
  var yearGzIdx;
  if (utcMs >= y0.getTime()) yearGzIdx = ((sy - 4) % 60 + 60) % 60;
  else yearGzIdx = ((sy - 5) % 60 + 60) % 60;
  var yearPillar = yfGZ(yearGzIdx);

  /* --- 月柱：以节气为界 --- */
  var jqThis = yfSolarTerms(sy, tz);
  var jqPrev = yfSolarTerms(sy - 1, tz);
  var all = jqPrev.concat(jqThis);     // 前一年 + 当年，覆盖小寒到冬至
  // 找出生时刻落在哪两个节气之间（比较必须用真实 UTC）
  var curTerm = null;
  for (var i = 0; i < all.length; i++) {
    if (all[i].time.getTime() <= utcMs) { curTerm = all[i]; }
  }
  var zhiIdx = 0;
  for (var k = 0; k < _YF_JIEQI.length; k++) {
    if (curTerm && _YF_JIEQI[k].name === curTerm.name) { zhiIdx = _YF_JIEQI_MONTH_ZHI[k]; break; }
  }
  // 月序：寅月=1 … 丑月=12
  var monthOrder = ((zhiIdx - 2) % 12 + 12) % 12 + 1;
  // 五虎遁：寅月天干 = (年干 % 5) * 2 + 2
  var ganIdx = (((yearPillar.gan ? yfGanIdx(yearPillar.gan) : 0) % 5) * 2 + 2 + (monthOrder - 1)) % 10;
  var monthPillar = { gan: _YF_GAN[ganIdx], zhi: _YF_ZHI[zhiIdx], text: _YF_GAN[ganIdx] + _YF_ZHI[zhiIdx] };

  /* --- 日柱：(日序号 + 14) % 60，按真太阳时的日历日 --- */
  var dn = yfDayNumber(sy, sm, sd);
  var dayPillar = yfGZ((dn + 14) % 60);

  /* --- 时柱 ---
     晚子时（23:00–24:00）采用「子正换日」流派：日柱不进位，时柱按次日日干起五鼠遁。
     此口径已与 lunar-python 独立库对撞一致（2000-12-31 23:30 → 日柱癸亥、时柱甲子）。 */
  var hourZhi = Math.floor(((shh + 1) % 24) / 2);        // 23-1 子(0)，1-3 丑(1)…
  var nextDayGz = yfGZ((dn + 14 + 1) % 60);              // 次日日柱，仅供晚子时推时干
  var baseGan = (shh >= 23) ? nextDayGz.gan : dayPillar.gan;
  var hourGan = ((yfGanIdx(baseGan) % 5) * 2 + hourZhi) % 10;
  var timePillar = { gan: _YF_GAN[hourGan], zhi: _YF_ZHI[hourZhi], text: _YF_GAN[hourGan] + _YF_ZHI[hourZhi] };

  /* --- 十神 --- */
  var dayGan = dayPillar.gan, dayGanIdx = yfGanIdx(dayGan), dayYin = _YF_GAN_YY[dayGanIdx];
  function shishen(g) {
    var gi = yfGanIdx(g), gy = _YF_GAN_YY[gi];
    var wxMe = _YF_GAN_WX[dayGanIdx], wxO = _YF_GAN_WX[gi];
    var rel = yfWxRelation(wxMe, wxO);   // 'same'|'produce'|'produced'|'restrain'|'restrained'
    var same = (gy === dayYin);
    if (rel === 'same') return same ? '比肩' : '劫财';
    if (rel === 'produce') return same ? '食神' : '伤官';
    if (rel === 'restrain') return same ? '偏财' : '正财';
    if (rel === 'restrained') return same ? '七杀' : '正官';
    if (rel === 'produced') return same ? '偏印' : '正印';
    return '';
  }
  var pillars = [
    { key: 'year', label: '年柱', p: yearPillar, ss: shishen(yearPillar.gan), wx: _YF_GAN_WX[yfGanIdx(yearPillar.gan)] + _YF_ZHI_WX[hz(yearPillar.zhi)] },
    { key: 'month', label: '月柱', p: monthPillar, ss: shishen(monthPillar.gan), wx: _YF_GAN_WX[yfGanIdx(monthPillar.gan)] + _YF_ZHI_WX[hz(monthPillar.zhi)] },
    { key: 'day', label: '日柱', p: dayPillar, ss: '日主', wx: _YF_GAN_WX[yfGanIdx(dayPillar.gan)] + _YF_ZHI_WX[hz(dayPillar.zhi)] },
    { key: 'time', label: '时柱', p: timePillar, ss: shishen(timePillar.gan), wx: _YF_GAN_WX[yfGanIdx(timePillar.gan)] + _YF_ZHI_WX[hz(timePillar.zhi)] }
  ];
  function hz(z) { return yfZhiIdx(z); }

  /* --- 藏干与五行力量 --- */
  var wxCount = { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 };
  var cangList = [];
  for (var i = 0; i < pillars.length; i++) {
    var zhi = pillars[i].p.zhi;
    var cang = _YF_ZHI_CANG[zhi] || [];
    for (var c = 0; c < cang.length; c++) {
      var w = _YF_CANG_WEIGHT[c] || 0.35;
      wxCount[_YF_GAN_WX[yfGanIdx(cang[c])]] += w;
      cangList.push({ from: pillars[i].label, zhi: zhi, gan: cang[c], weight: w, ss: shishen(cang[c]) });
    }
    wxCount[_YF_GAN_WX[yfGanIdx(pillars[i].p.gan)]] += 1;
  }

  /* --- 身强弱 --- */
  var meWx = _YF_GAN_WX[dayGanIdx];
  var helpWx = yfWxProduce(meWx);      // 生我（印）
  var sameWx = meWx;                   // 同我（比劫）
  var drainWx = yfWxProducedBy(meWx);  // 我生（食伤）
  var costWx = yfWxRestrainedBy(meWx); // 我克（财）
  var killWx = yfWxRestrain(meWx);     // 克我（官杀）
  var shengScore = wxCount[sameWx] + wxCount[helpWx];
  var xieScore = wxCount[drainWx] + wxCount[costWx] + wxCount[killWx];
  var total = shengScore + xieScore;
  var ratio = total > 0 ? shengScore / total : 0.5;
  var strength, strengthNote;
  if (ratio >= 0.62) { strength = '身强'; strengthNote = '帮扶力量占优，喜克泄耗：官杀、食伤、财为用。'; }
  else if (ratio <= 0.38) { strength = '身弱'; strengthNote = '克泄力量占优，喜生扶：印星、比劫为用。'; }
  else { strength = '中和'; strengthNote = '扶抑力量接近，用神随大运流年而转，宜顺势调候。'; }
  var yongshen = ratio > 0.5 ? [killWx, drainWx, costWx] : [helpWx, sameWx];

  /* --- 大运（阳男阴女顺排，阴男阳女逆排；未采集性别时按年干阴阳顺排） --- */
  var dayun = yfCalcDayun(pillars[1], curTerm, utcMs, sy, tz, yfGanIdx(yearPillar.gan) % 2 === 0);

  return {
    pillars: pillars,
    dayMaster: dayGan,
    dayMasterWx: meWx,
    cang: cangList,
    wxCount: wxCount,
    strength: strength,
    strengthNote: strengthNote,
    ratio: Math.round(ratio * 100),
    yongshen: yongshen,
    curTerm: curTerm ? curTerm.name : '',
    dayun: dayun,
    solarTime: shh + ':' + (smi < 10 ? '0' + smi : smi)
  };
}

// 五行关系：以 me 为"我"
function yfWxRelation(me, other) {
  if (me === other) return 'same';
  var produce = { 木: '火', 火: '土', 土: '金', 金: '水', 水: '木' };
  var restrain = { 木: '土', 土: '水', 水: '火', 火: '金', 金: '木' };
  if (produce[me] === other) return 'produce';      // 我生
  if (produce[other] === me) return 'produced';     // 生我
  if (restrain[me] === other) return 'restrain';    // 我克
  if (restrain[other] === me) return 'restrained';  // 克我
  return 'same';
}
function yfWxProduce(wx) { var p = { 木: '水', 火: '木', 土: '火', 金: '土', 水: '金' }; return p[wx]; }   // 生我
function yfWxProducedBy(wx) { var p = { 木: '火', 火: '土', 土: '金', 金: '水', 水: '木' }; return p[wx]; } // 我生
function yfWxRestrain(wx) { var p = { 木: '土', 火: '金', 土: '水', 金: '木', 水: '火' }; return p[wx]; }  // 我克
function yfWxRestrainedBy(wx) { var p = { 木: '金', 火: '水', 土: '木', 金: '火', 水: '土' }; return p[wx]; } // 克我

// 大运：阳年男/阴年女顺排，否则逆排
function yfCalcDayun(monthPillar, curTerm, utcMs, year, tz, isYang) {
  try {
    var all = yfSolarTerms(year, tz).concat(yfSolarTerms(year + 1, tz));
    var nextTerm = null, prevTerm = null;
    for (var i = 0; i < all.length; i++) {
      if (all[i].time.getTime() > utcMs && !nextTerm) nextTerm = all[i];
      if (all[i].time.getTime() <= utcMs) prevTerm = all[i];
    }
    // 起运：三天折一岁，即一天四个月
    var days;
    if (isYang) days = nextTerm ? (nextTerm.time.getTime() - utcMs) / 86400000 : 0;
    else days = prevTerm ? (utcMs - prevTerm.time.getTime()) / 86400000 : 0;
    var startAge = days / 3;                        // 天 → 年
    var mg = yfGanIdx(monthPillar.gan), mz = yfZhiIdx(monthPillar.zhi);
    var out = [];
    for (var n = 1; n <= 8; n++) {
      var step = isYang ? (n - 1) : -(n - 1);
      var gi = ((mg + step) % 10 + 10) % 10;
      var zi = ((mz + step) % 12 + 12) % 12;
      out.push({
        text: _YF_GAN[gi] + _YF_ZHI[zi],
        age: Math.round(startAge + (n - 1) * 10)
      });
    }
    return { startAge: startAge.toFixed(1), list: out };
  } catch (e) { return { startAge: '0', list: [] }; }
}

// 地心视黄经
function yfHdLon(body, t) {

  if (body === 'SouthNode') return (yfMeanNorthNode(t.date) + 180) % 360;
  var b = Astronomy.Body[body];
  var e = Astronomy.Ecliptic(Astronomy.GeoVector(b, t, true));
  return ((e.elon % 360) + 360) % 360;

  var authority, authorityDesc;

  else if (sacral) { authority = '荐骨权威'; authorityDesc = '用声音回应（嗯/嗯哼 vs 呃/不行）当场判断'; }
  else if (definedCenters['Spleen']) { authority = '脾脏权威'; authorityDesc = '相信身体的第一直觉，它只说一次'; }
  else if (definedCenters['Heart']) { authority = '意志力权威'; authorityDesc = '问自己是否真的愿意为这件事投入与承诺'; }

  var pSun = null, dSun = null;

    if (rows[r].body === 'Sun' && rows[r].side === 'personality') pSun = rows[r];
    if (rows[r].body === 'Sun' && rows[r].side === 'design') dSun = rows[r];
  }
  var profile = (pSun && dSun) ? (pSun.line + '/' + dSun.line) : '';
  // 12 种有效组合（Design 与 Personality 相差 88° 太阳弧，决定了只能是这 12 种）
  var VALID_PROFILE = ['1/3', '1/4', '2/4', '2/5', '3/5', '3/6', '4/6', '4/1', '5/1', '5/2', '6/2', '6/3'];

  /* --- 定义方式（Definition） --- */
  var definition = yfHdDefinitionType(activeChannels, definedList);

  return {
    birthUtc: birthUtc.date,
    designUtc: designT.date,
    designDays: Math.round((birthUtc.date.getTime() - designT.date.getTime()) / 86400000),
    rows: rows,

    definition: definition
  };
}

// 出生时间 → 真实 UTC 毫秒
function yfMakeUtcMs(dateStr, timeStr, offsetMinutes) {
  var p = dateStr.split('-'), t = (timeStr || '12:00').split(':');
  var tz = (typeof offsetMinutes === 'number' && isFinite(offsetMinutes)) ? offsetMinutes : 480;
  return Date.UTC(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]), parseInt(t[0]), parseInt(t[1] || 0)) - tz * 60000;
}

// 定义方式：单一 / 分裂 / 三分 / 四分
function yfHdDefinitionType(channels, definedList) {
  if (channels.length === 0) return '无定义（反映者）';
  if (definedList.length === 0) return '无定义（反映者）';
  // 以中心为节点、通道为边做连通分量计数
  var adj = {};
  definedList.forEach(function (c) { adj[c] = []; });
  channels.forEach(function (ch) {
    var a = _YF_HD_GATE_CENTER[ch.gates[0]], b = _YF_HD_GATE_CENTER[ch.gates[1]];
    if (a && b && a !== b) { if (adj[a]) adj[a].push(b); if (adj[b]) adj[b].push(a); }
  });
  var seen = {}, groups = 0;
  definedList.forEach(function (c) {
    if (seen[c]) return;
    groups++;
    var stack = [c];
    seen[c] = 1;
    while (stack.length) {
      var cur = stack.pop();
      (adj[cur] || []).forEach(function (n) { if (!seen[n]) { seen[n] = 1; stack.push(n); } });
    }
  });
  return ['', '单一定义', '分裂定义', '三分定义', '四分定义'][Math.min(groups, 4)] || groups + ' 分定义';
}

function yfWxRel(me,other){
  if(me===other) return 'same';
  if(YF_WX_PRODUCE[me]===other) return 'produce';
  if(YF_WX_PRODUCED[me]===other) return 'produced';
  if(YF_WX_RESTRAIN[me]===other) return 'restrain';
  if(YF_WX_RESTRAINED[me]===other) return 'restrained';
  return 'same';
}

function yfDailyFortune(bazi){
  try{
    var now=new Date();
    var tDn=yfDayNumber(now.getFullYear(),now.getMonth()+1,now.getDate());
    var tGZ=yfGZ((tDn+14)%60);
    var todayGan=tGZ.gan, todayWx=_YF_GAN_WX[yfGanIdx(todayGan)];
    var dmGan=bazi.dayMaster, dmWx=bazi.dayMasterWx;
    var rel=yfWxRel(dmWx,todayWx);
    var sameYin=_YF_GAN_YY[yfGanIdx(todayGan)]===_YF_GAN_YY[yfGanIdx(dmGan)];
    var ssName;
    if(rel==='same') ssName=sameYin?'比肩':'劫财';
    else if(rel==='produce') ssName=sameYin?'食神':'伤官';
    else if(rel==='restrain') ssName=sameYin?'偏财':'正财';
    else if(rel==='restrained') ssName=sameYin?'七杀':'正官';
    else ssName=sameYin?'偏印':'正印';
    var f=YF_FORTUNE_MAP[ssName];
    var colorMap={木:'绿色系',火:'红色系',土:'黄色系',金:'白色系',水:'蓝色系'};
    var numMap={木:[3,8],火:[2,7],土:[5,0],金:[4,9],水:[1,6]};
    return{
      todayGZ:tGZ,
      ss:ssName,
      ssName:f.name,
      emoji:f.emoji,
      do:f.do,
      dont:f.dont,
      color:colorMap[todayWx],
      nums:numMap[todayWx],
      todayWx:todayWx
    };
  }catch(e){console.error('yfDailyFortune:',e);return null;}
}

function yfWxTenGod(dmGan, targetWx) {

function yfRenderWxRing(bz) {
  try {
    var C = { '木': '#3aa76d', '火': '#e8543f', '土': '#c99a3a', '金': '#8b8fa3', '水': '#3d7fd6' };
    var base = ['火', '土', '金', '水', '木'];
    var di0 = base.indexOf(bz.dayMasterWx); if (di0 < 0) di0 = 0;
    var order = [];
    for (var oi = 0; oi < 5; oi++) order.push(base[(di0 + oi) % 5]);
    var total = 0, k;
    for (k in bz.wxCount) total += bz.wxCount[k];
    var w = 320, h = 336, cx = 160, cy = 174, R = 100, nr = 33;
    function pt(r, deg) { var a = (deg - 90) * Math.PI / 180; return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:340px;height:auto;display:block;margin:0 auto">';
    svg += '<defs>';
    svg += '<marker id="wxArP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bda88a"/></marker>';
    svg += '<marker id="wxArK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c5beb2"/></marker>';
    svg += '</defs>';
    var i, a1, a2, p1, p2, mx, my;
    // 相克弦（垫底，五角星弦：木克土 土克水 水克火 火克金 金克木 → order 序 +2）
    for (i = 0; i < 5; i++) {
      a1 = i * 72; a2 = ((i + 2) % 5) * 72;
      p1 = pt(R, a1); p2 = pt(R, a2);
      var dx = p2.x - p1.x, dy = p2.y - p1.y, dd = Math.sqrt(dx * dx + dy * dy), pad = nr + 7;
      var q1 = { x: p1.x + dx / dd * pad, y: p1.y + dy / dd * pad };
      var q2 = { x: p2.x - dx / dd * pad, y: p2.y - dy / dd * pad };
      svg += '<line x1="' + q1.x.toFixed(1) + '" y1="' + q1.y.toFixed(1) + '" x2="' + q2.x.toFixed(1) + '" y2="' + q2.y.toFixed(1) + '" stroke="#cfc8bb" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#wxArK)"/>';
      mx = (q1.x + q2.x) / 2; my = (q1.y + q2.y) / 2;
      svg += '<text x="' + mx.toFixed(1) + '" y="' + (my + 3.5).toFixed(1) + '" text-anchor="middle" font-size="10" fill="#a89f8d" stroke="#fff" stroke-width="3" paint-order="stroke">克</text>';
    }
    // 相生外弧（order 相邻即相生：木→火→土→金→水→木，末→首也生）
    for (i = 0; i < 5; i++) {
      var s = i * 72 + 29, e = ((i + 1) % 5) * 72 - 29;
      var sp = pt(R, s), ep = pt(R, e);
      svg += '<path d="M ' + sp.x.toFixed(1) + ' ' + sp.y.toFixed(1) + ' A ' + R + ' ' + R + ' 0 0 1 ' + ep.x.toFixed(1) + ' ' + ep.y.toFixed(1) + '" fill="none" stroke="#bda88a" stroke-width="1.6" marker-end="url(#wxArP)"/>';
      var mid = (s + e) / 2, tp = pt(R + 19, mid);
      svg += '<text x="' + tp.x.toFixed(1) + '" y="' + (tp.y + 3.5).toFixed(1) + '" text-anchor="middle" font-size="10.5" fill="#bda88a" stroke="#fff" stroke-width="3" paint-order="stroke">生</text>';
    }
    // 节点
    for (i = 0; i < 5; i++) {
      var wxn = order[i], ang = i * 72, pp = pt(R, ang);
      var raw = bz.wxCount[wxn] || 0;
      var pct = total > 0 ? Math.round(raw / total * 100) : 0;
      var isMe = (wxn === bz.dayMasterWx);
      svg += '<circle cx="' + pp.x.toFixed(1) + '" cy="' + pp.y.toFixed(1) + '" r="' + nr + '" fill="' + C[wxn] + (isMe ? '26' : '14') + '" stroke="' + C[wxn] + '" stroke-width="' + (isMe ? 2 : 1.4) + '"/>';
      svg += '<text x="' + pp.x.toFixed(1) + '" y="' + (pp.y - 3).toFixed(1) + '" text-anchor="middle" font-size="17" font-weight="700" fill="' + C[wxn] + '">' + wxn + '</text>';
      svg += '<text x="' + pp.x.toFixed(1) + '" y="' + (pp.y + 15).toFixed(1) + '" text-anchor="middle" font-size="12.5" font-weight="600" fill="' + C[wxn] + '" opacity=".85">' + pct + '%</text>';
      var tg = yfWxTenGod(bz.dayMaster, wxn), tpp = pt(R + nr + 17, ang);
      svg += '<text x="' + tpp.x.toFixed(1) + '" y="' + (tpp.y + 4).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="600" fill="#9b8a6e" stroke="#fff" stroke-width="3.5" paint-order="stroke">' + tg + '</text>';
      if (isMe) {
        svg += '<rect x="' + (pp.x - 21).toFixed(1) + '" y="' + (pp.y + nr - 5).toFixed(1) + '" width="42" height="16" rx="8" fill="#d64541" stroke="#fff" stroke-width="1.5"/>';
        svg += '<text x="' + pp.x.toFixed(1) + '" y="' + (pp.y + nr + 6.5).toFixed(1) + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">日主</text>';
      }
    }
    svg += '</svg>';
    return svg;
  } catch (e) { console.error('yfRenderWxRing:', e); return ''; }
}

function yfRenderXiuRing(x) {
  try {
    var siColor = { '东': '#3aa76d', '北': '#3d7fd6', '西': '#8b8fa3', '南': '#e8543f' };
    var w = 320, cx = 160, cy = 160, rOut = 148, rIn = 122, step = 360 / 28;
    var rot = -x.idx * step;
    function pt(r, deg) { var a = (deg - 90) * Math.PI / 180; return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + w + '" style="width:100%;max-width:330px;height:auto;display:block;margin:0 auto">';
    var s, i;
    // 四象环带
    var siKeys = ['东', '北', '西', '南'];
    for (s = 0; s < 4; s++) {
      var a0 = rot + s * 7 * step - step / 2, a1 = rot + (s + 1) * 7 * step - step / 2;
      var o0 = pt(rOut, a0), o1 = pt(rOut, a1), i1 = pt(rIn, a1), i0 = pt(rIn, a0);
      svg += '<path d="M ' + o0.x.toFixed(1) + ' ' + o0.y.toFixed(1) + ' A ' + rOut + ' ' + rOut + ' 0 0 1 ' + o1.x.toFixed(1) + ' ' + o1.y.toFixed(1) + ' L ' + i1.x.toFixed(1) + ' ' + i1.y.toFixed(1) + ' A ' + rIn + ' ' + rIn + ' 0 0 0 ' + i0.x.toFixed(1) + ' ' + i0.y.toFixed(1) + ' Z" fill="' + siColor[siKeys[s]] + '1f"/>';
      var b0 = pt(rIn, a0), b1 = pt(rOut, a0);
      svg += '<line x1="' + b0.x.toFixed(1) + '" y1="' + b0.y.toFixed(1) + '" x2="' + b1.x.toFixed(1) + '" y2="' + b1.y.toFixed(1) + '" stroke="#fff" stroke-width="1.5"/>';
    }
    // 装饰虚线圈
    svg += '<g><circle cx="' + cx + '" cy="' + cy + '" r="106" fill="none" stroke="#e3e8f0" stroke-width="1" stroke-dasharray="2 4"/><animateTransform attributeName="transform" type="rotate" from="0 ' + cx + ' ' + cy + '" to="360 ' + cx + ' ' + cy + '" dur="50s" repeatCount="indefinite"/></g>';
    svg += '<g opacity=".5"><circle cx="' + cx + '" cy="' + cy + '" r="113" fill="none" stroke="#dfe5ee" stroke-width="1" stroke-dasharray="1 7"/><animateTransform attributeName="transform" type="rotate" from="360 ' + cx + ' ' + cy + '" to="0 ' + cx + ' ' + cy + '" dur="80s" repeatCount="indefinite"/></g>';
    // 28 宿
    for (i = 0; i < 28; i++) {
      var ang = rot + i * step, c = siColor[_YF_XIU_SI[i]];
      var isMe = (i === x.idx);
      var pp = pt((rOut + rIn) / 2, ang);
      if (isMe) {
        svg += '<circle cx="' + pp.x.toFixed(1) + '" cy="' + pp.y.toFixed(1) + '" r="14.5" fill="#fff" stroke="' + c + '" stroke-width="2.2"/>';
        svg += '<text x="' + pp.x.toFixed(1) + '" y="' + (pp.y + 5).toFixed(1) + '" text-anchor="middle" font-size="14.5" font-weight="800" fill="' + c + '">' + _YF_XIU[i] + '</text>';
      } else {
        svg += '<text x="' + pp.x.toFixed(1) + '" y="' + (pp.y + 4.2).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + c + '" opacity=".88">' + _YF_XIU[i] + '</text>';
      }
    }
    // 中心
    var mc = siColor[x.xiang];
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="66" fill="#fff" stroke="' + mc + '" stroke-width="1.5"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="58" fill="none" stroke="' + mc + '33" stroke-width="1"/>';
    svg += '<text x="' + cx + '" y="' + (cy - 10) + '" text-anchor="middle" font-size="34" font-weight="800" fill="' + mc + '">' + x.name + '</text>';
    svg += '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#8a94a6">' + x.full + ' · 本命宿</text>';
    svg += '<text x="' + cx + '" y="' + (cy + 32) + '" text-anchor="middle" font-size="10.5" fill="#a5aebd">' + x.xiangName + ' · ' + x.yuan + '曜 · ' + x.luck + '</text>';
    svg += '</svg>';
    return svg;
  } catch (e) { console.error('yfRenderXiuRing:', e); return ''; }
}

/* ---------- 人类图人体图 SVG（9 中心 + 36 通道）---------- */
function yfHdBodyGraphSVG(hd) {
  // 中心坐标与形状（viewBox 0 0 260 420）
  var C = {
    Head: { x: 130, y: 34, shape: 'tri', w: 34 },
    Ajna: { x: 130, y: 88, shape: 'triDown', w: 34 },
    Throat: { x: 130, y: 140, shape: 'sq', w: 32 },
    G: { x: 130, y: 214, shape: 'dia', w: 30 },
    Heart: { x: 194, y: 214, shape: 'triRight', w: 28 },
    Spleen: { x: 66, y: 214, shape: 'triLeft', w: 28 },
    Sacral: { x: 130, y: 292, shape: 'sq', w: 32 },
    SP: { x: 194, y: 292, shape: 'triRight', w: 28 },
    Root: { x: 130, y: 366, shape: 'sq', w: 32 }
  };
  var names = { Head: '头脑', Ajna: '逻辑', Throat: '喉咙', G: 'G', Heart: '意志', Sacral: '骶骨', Spleen: '脾', SP: '情绪', Root: '根部' };
  var defined = hd.definedCenters || {};
  // 已激活通道的两端闸门
  var activePairs = {};
  (hd.channels || []).forEach(function (ch) { activePairs[ch.gates[0] + '-' + ch.gates[1]] = 1; });

  var s = '<svg viewBox="0 0 260 420" style="width:100%;height:auto;max-width:300px;display:block;margin:0 auto">';

  // 1. 先画所有 36 条通道的连线
  for (var i = 0; i < _YF_HD_CHANNELS.length; i++) {
    var ch = _YF_HD_CHANNELS[i];
    var ca = _YF_HD_GATE_CENTER[ch[0]], cb = _YF_HD_GATE_CENTER[ch[1]];
    if (!ca || !cb || ca === cb || !C[ca] || !C[cb]) continue;
    var a = C[ca], b = C[cb];
    var keyA = ch[0] + '-' + ch[1], keyB = ch[1] + '-' + ch[0];
    var on = (activePairs[keyA] || activePairs[keyB]);
    s += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' +
      (on ? '#c8963e' : 'rgba(120,124,140,.22)') + '" stroke-width="' + (on ? '3.4' : '1.2') + '" stroke-linecap="round"/>';
  }

  // 2. 再画中心（盖在连线上）
  for (var k in C) {
    var c = C[k], isDef = !!defined[k], w = c.w;
    var fill = isDef ? '#c8963e' : 'rgba(255,255,255,.9)';
    var stroke = isDef ? '#c8963e' : 'rgba(120,124,140,.5)';
    var txt = isDef ? '#fff' : '#6a6e80';
    var pts = '';
    if (c.shape === 'tri') pts = (c.x) + ',' + (c.y - w / 2) + ' ' + (c.x + w / 2) + ',' + (c.y + w / 2) + ' ' + (c.x - w / 2) + ',' + (c.y + w / 2);
    else if (c.shape === 'triDown') pts = (c.x) + ',' + (c.y + w / 2) + ' ' + (c.x + w / 2) + ',' + (c.y - w / 2) + ' ' + (c.x - w / 2) + ',' + (c.y - w / 2);
    else if (c.shape === 'triRight') pts = (c.x + w / 2) + ',' + (c.y) + ' ' + (c.x - w / 2) + ',' + (c.y - w / 2) + ' ' + (c.x - w / 2) + ',' + (c.y + w / 2);
    else if (c.shape === 'triLeft') pts = (c.x - w / 2) + ',' + (c.y) + ' ' + (c.x + w / 2) + ',' + (c.y - w / 2) + ' ' + (c.x + w / 2) + ',' + (c.y + w / 2);
    if (pts) {
      s += '<polygon points="' + pts + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.6"/>';
    } else if (c.shape === 'dia') {
      pts = (c.x) + ',' + (c.y - w / 2) + ' ' + (c.x + w / 2) + ',' + (c.y) + ' ' + (c.x) + ',' + (c.y + w / 2) + ' ' + (c.x - w / 2) + ',' + (c.y);
      s += '<polygon points="' + pts + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.6"/>';
    } else {
      s += '<rect x="' + (c.x - w / 2) + '" y="' + (c.y - w / 2) + '" width="' + w + '" height="' + w +
        '" rx="5" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.6"/>';
    }
    s += '<text x="' + c.x + '" y="' + (c.y + 4) + '" text-anchor="middle" font-size="11" fill="' + txt +
      '" font-weight="600" style="pointer-events:none">' + names[k] + '</text>';
  }
  s += '</svg>';
  return s;
}

function saveBirthInfo(){
try{
var dateEl=document.getElementById('ybBirthDate');
var timeEl=document.getElementById('ybBirthTime');
var provEl=document.getElementById('ybProv');
var cityEl=document.getElementById('ybCity');
if(!dateEl||!dateEl.value){showToast('请选择出生日期','error');return;}
if(!timeEl||!timeEl.value){showToast('请选择出生时间','error');return;}
if(!cityEl||!cityEl.value){showToast('请选择出生城市','error');return;}
var cityName=cityEl.value;
var countyEl=document.getElementById('ybCounty');
var countyName=(countyEl&&!countyEl.disabled&&countyEl.value)?countyEl.value:'';
if(countyEl&&!countyEl.disabled&&countyEl.options.length>0&&!countyEl.value){showToast('请选择出生区县','error');return;}
var lon=null,lat=null;
if(countyName&&window.YF_REGION_DB&&YF_REGION_DB[provEl.value]&&YF_REGION_DB[provEl.value][cityName]){
var cts=YF_REGION_DB[provEl.value][cityName];
for(var ci=0;ci<cts.length;ci++){if(cts[ci][0]===countyName){lon=cts[ci][1];lat=cts[ci][2];break;}}
}
var data={birthDate:dateEl.value,birthTime:timeEl.value,birthCity:cityName,birthProvince:provEl.value};
if(countyName)data.birthCounty=countyName;
if(lat===null){
var arr=PROV_CITY_LON[provEl.value]||[];
for(var i=0;i<arr.length;i++){if(arr[i][0]===cityName)lon=arr[i][1];}
var city=yfFindCity(cityName);
if(city){lat=city.lat;if(city.lon!==undefined&&city.lon!==null)lon=city.lon;}
}
if(lon!==null)data.birthLon=lon;
if(lat!==null)data.birthLat=lat;
data.birthOffset=480;
// 确保存在当前用户（未登录时自动建一个本地用户，避免保存后回退到引导页）
if(!currentUser||!currentUser.id){
try{
var _nu=YangFanData.createUser({name:(currentUser&&currentUser.name)||'扬帆少年',phone:''});
currentUser={id:_nu.id,name:_nu.name,phone:_nu.phone,account:_nu.account,points:_nu.points};
}catch(e){currentUser=currentUser||{};currentUser.id='local_'+Date.now();}
}
// 关键修复：若 currentUser.id 在 users 表中不存在（旧数据/局部清理导致），补建一条记录，
// 否则 updateUser 会找不到目标， birth 信息只写在 currentUser 里，页面再读时又被判为无数据。
var existing=YangFanData.getUser(currentUser.id);
if(!existing){
var _nu2=YangFanData.createUser({
name:currentUser.name||'扬帆少年',
phone:currentUser.phone||'',
account:currentUser.account||currentUser.phone||'',
role:currentUser.role||'student',
points:currentUser.points!==undefined?currentUser.points:200
});
currentUser={id:_nu2.id,name:_nu2.name,phone:_nu2.phone,account:_nu2.account,points:_nu2.points,role:_nu2.role};
}
YangFanData.updateUser(currentUser.id,data);
for(var k in data){currentUser[k]=data[k];}
lsSet('currentUser',currentUser);
closeModal();
openPersonalityPage();
showToast('星图已生成','success');
}catch(e){console.error(e);showToast('保存失败','error');}
}

function renderRankList(type){
var users=YangFanData.getUsers();
var posts=YangFanData.getPosts({});
var data=[];
var colors=['linear-gradient(135deg,#6BC9F5,#00AEEC)','linear-gradient(135deg,#ff6b6b,#ff8e8e)','linear-gradient(135deg,#00b894,#55efc4)','linear-gradient(135deg,#6c5ce7,#a29bfe)','linear-gradient(135deg,#ffa502,#fdcb6e)','linear-gradient(135deg,#e17055,#d63031)','linear-gradient(135deg,#00cec9,#0984e3)'];
var myName=currentUser?currentUser.name:'扬帆少年';
for(var i=0;i<users.length;i++){
var u=users[i];
var userPosts=posts.filter(function(p){return p.author===u.name;});
var val=0,desc='';
if(type==='score'){val=u.points||0;desc=val+'积分';}
else if(type==='active'){val=userPosts.length;desc='发帖'+val+'篇';}
else{var likes=0;for(var j=0;j<userPosts.length;j++)likes+=(userPosts[j].likes||0);val=likes;desc='获赞'+val;}
data.push({name:u.name,av:colors[i%colors.length],val:val,desc:desc});
}
data.sort(function(a,b){return b.val-a.val;});
var h='';
for(var i=0;i<data.length;i++){
var d=data[i];var noCls=i===0?'top1':(i===1?'top2':(i===2?'top3':''));var isMe=d.name===myName;
h+='<div class="rank-item"'+(isMe?' style="border:1.5px solid var(--pri)"':'')+'><div class="rank-no '+noCls+'">'+(i+1)+'</div><div class="rank-av" style="background:'+d.av+'">'+d.name[0]+'</div><div class="rank-info"><h4>'+d.name+(isMe?' (我)':'')+'</h4><p>'+d.desc+'</p></div><div class="rank-val">'+d.val+'</div></div>';
}
return h;
}

function compressImg(file,maxW,quality){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){function tryCompress(w,h,q){var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);var d=canvas.toDataURL('image/jpeg',q);if(d.length>40000&&q>0.35){var nw=Math.round(w*0.8),nh=Math.round(h*0.8);return tryCompress(nw,nh,q-0.1);}if(d.length>40000&&w>320){return tryCompress(Math.round(w*0.7),Math.round(h*0.7),q);}return d;}var w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}resolve(tryCompress(w,h,quality));};/* [G2] 解码失败不再回退原图 base64（防超大字符串撑爆配额），改为 reject 由上层提示 */img.onerror=function(){reject(new Error('图片解码失败'));};img.src=e.target.result;};reader.onerror=function(){reject(new Error('图片读取失败'));};reader.readAsDataURL(file);});}
function handlePubImgs(input){try{if(pubVideo)removePubVideo();var files=input.files;if(!files)return;for(var i=0;i<files.length&&pubImgs.length<9;i++){(function(file){compressImg(file,1280,0.7).then(function(dataUrl){pubImgs.push(dataUrl);renderPubImgsPreview();}).catch(function(e){console.error(e);showToast('图片处理失败，请换一张','error');});})(files[i]);}input.value="";}catch(e){}}

function handlePubVideo(input){

if(!/^video\//.test(f.type||'')){showToast('请选择视频文件','warn');return;}

var url=URL.createObjectURL(f);

v.onerror=function(){showToast('无法读取该视频，请换一个文件','warn');try{URL.revokeObjectURL(url);}catch(e2){}};
v.onloadedmetadata=function(){
try{
var dur=Math.round(v.duration||0);
if(!dur||dur>60){showToast('视频时长不能超过60秒','warn');try{URL.revokeObjectURL(url);}catch(e2){}return;}
v.onseeked=function(){
try{
var cv=document.createElement('canvas');
var w=Math.min(640,v.videoWidth||640);
cv.width=w;cv.height=Math.max(1,Math.round(w*(v.videoHeight||360)/(v.videoWidth||640)));

if(pubImgs.length){pubImgs=[];renderPubImgsPreview();}

pubVideo={file:f,objUrl:url,poster:poster,dur:dur,size:f.size,name:f.name||'视频'};

}catch(e){showToast('视频封面生成失败，但视频可用','warn');if(pubImgs.length){pubImgs=[];renderPubImgsPreview();}pubVideo={file:f,objUrl:url,poster:'',dur:dur,size:f.size,name:f.name||'视频'};renderPubVideoPreview();}
};
v.currentTime=Math.min(0.8,(v.duration||1)/3);
}catch(e){showToast('视频读取异常','warn');}
};
}catch(e){}
}

async function yfUploadVideoToCloud(file){

var app=await YfBackend._ensureReady();
var ext=(file.name&&file.name.indexOf('.')>-1)?file.name.split('.').pop().toLowerCase():'mp4';
