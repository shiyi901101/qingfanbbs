async function yfResolveVideoUrls(fids){
try{
if(!YfBackend.enabled()||!fids||!fids.length)return{};
var need=fids.filter(function(x){return x&&!_yfVidUrlCache[x];});
if(need.length){
var app=await YfBackend._ensureReady();
var res=await app.getTempFileURL({fileList:need});
var list=(res&&res.fileList)||[];
for(var i=0;i<list.length;i++){if(list[i]&&list[i].fileID&&list[i].tempFileURL)_yfVidUrlCache[list[i].fileID]=list[i].tempFileURL;}
}
var out={};
for(var j=0;j<fids.length;j++){if(fids[j]&&_yfVidUrlCache[fids[j]])out[fids[j]]=_yfVidUrlCache[fids[j]];}
return out;
}catch(e){console.warn('[yfVideo] 解析视频地址失败:',e&&e.message);return{};}
}
async function yfHydrateVideos(root){
try{
if(!YfBackend.enabled())return;
var scope=root||document;
var vids=scope.querySelectorAll('video[data-fid]');
if(!vids||!vids.length)return;
var fids=[];for(var i=0;i<vids.length;i++){var fid=vids[i].getAttribute('data-fid');if(fid&&fids.indexOf(fid)<0)fids.push(fid);}
if(!fids.length)return;
var map=await yfResolveVideoUrls(fids);
for(var k=0;k<vids.length;k++){
var f2=vids[k].getAttribute('data-fid');
if(f2&&map[f2]){vids[k].src=map[f2];vids[k].removeAttribute('data-fid');}
}
}catch(e){console.warn('[yfVideo] hydrate失败:',e&&e.message);}
}

var comments=0;
try{var msgs=YangFanData.getMessages?YangFanData.getMessages():[];comments=msgs.length;}catch(e){}
var likes=0;for(var i=0;i<myPosts.length;i++)likes+=(myPosts[i].likes||0);
var myGroups=(lsGet('myGroups',[])||[]).length;
var favs=(lsGet('favoritePosts',[])||[]).length;

var points=getMyPoints();
var level=YangFanData.getLevelByPoints(points).level;
var loginDays=parseInt(localStorage.getItem('yf_login_days')||'0');

var answers=parseInt(yfUGet('yf_answers','0'));
var events=parseInt(yfUGet('yf_events','0'));
return {posts:myPosts.length,comments:comments,likes:likes,groups:myGroups,favorites:favs,featured:featured,points:points,level:level,login_days:loginDays,login_streak:streak,invites:invites,reports:reports,donations:donations,answers:answers,events:events};

function getMedalCurrent(cond,stats){
switch(cond.type){
case 'posts':return stats.posts;
case 'comments':return stats.comments;
case 'likes':return stats.likes;
case 'points':return stats.points;
case 'groups':return stats.groups;
case 'favorites':return stats.favorites;
case 'featured':return stats.featured;
case 'role':return (currentUser&&currentUser.role==='mentor')?1:0;
case 'login_days':return stats.login_days;
case 'login_streak':return stats.login_streak;
case 'invites':return stats.invites;
case 'reports':return stats.reports;
case 'donations':return stats.donations;
case 'answers':return stats.answers;
case 'events':return stats.events;
case 'level':return stats.level;
case 'founder':return (yfUGet('yf_founder','')==='1')?1:0;
case 'special':return (yfUGet('yf_special','')==='1')?1:0;

}
}
function computeAndUnlockMedals(){
try{

var uid=currentUser.id;
var stats=getMedalStats();
var allMedals=YangFanData.getMedals();
var um=YangFanData.getUserMedals(uid);
var newlyUnlocked=[];
for(var i=0;i<allMedals.length;i++){
var m=allMedals[i];
if(um.unlocked.indexOf(m.id)>-1)continue;
if(m.cond.type==='role'){
if(currentUser.role==='mentor'||m.cond.value==='mentor'){if(stats.level>=0){}}
}
var cur=getMedalCurrent(m.cond,stats);
var met=false;
if(m.cond.type==='role'){met=(currentUser.role==='mentor'||m.cond.value==='mentor');}
else if(m.cond.type==='special'||m.cond.type==='founder'){met=cur>=1;}
else{met=cur>=m.cond.value;}
if(met){
var r=YangFanData.unlockMedal(uid,m.id);
if(r&&r.newly)newlyUnlocked.push(m);
}
}
um.progress={};
for(var j=0;j<allMedals.length;j++){
var mm=allMedals[j];
um.progress[mm.id]=getMedalCurrent(mm.cond,stats);
}
YangFanData.saveUserMedals(uid,um);
if(newlyUnlocked.length){
(function(list,idx){
function showNext(){
if(idx>=list.length)return;
var m=list[idx];
showCelebrate('解锁勋章：'+m.name,m.desc||'恭喜获得新勋章','继续',function(){idx++;showNext();});
}
showNext();
})(newlyUnlocked,0);
}
}catch(e){console.warn('computeMedals error',e);}
}

function startOnboarding(){
if(localStorage.getItem('yf_onboarded_v5')==='1')return;
setTimeout(function(){
try{
_onboardIdx=0;
var mask=document.getElementById('onboardMask');
if(!mask)return;
mask.classList.add('show');
renderOnboardStep();
}catch(e){console.warn(e);}
},800);

function renderOnboardStep(){
var step=_onboardSteps[_onboardIdx];
var el=step?document.querySelector(step.sel):null;
var spot=document.getElementById('onboardSpot');
var tip=document.getElementById('onboardTip');
var titleEl=document.getElementById('onboardTitle');
var descEl=document.getElementById('onboardDesc');
var dots=document.getElementById('onboardDots');
var btn=document.getElementById('onboardNextBtn');
if(!el||!spot||!tip||!titleEl||!descEl||!dots||!btn){_onboardIdx++;if(_onboardIdx<_onboardSteps.length)renderOnboardStep();else finishOnboarding();return;}
var r=el.getBoundingClientRect();
var pad=6;
spot.style.left=(r.left-pad)+'px';spot.style.top=(r.top-pad)+'px';
spot.style.width=(r.width+pad*2)+'px';spot.style.height=(r.height+pad*2)+'px';
titleEl.textContent=step.title;descEl.textContent=step.desc;
var dh='';for(var i=0;i<_onboardSteps.length;i++){dh+='<div class="onboard-dot'+(i===_onboardIdx?' on':'')+'"></div>';}
dots.innerHTML=dh;
btn.textContent=_onboardIdx===_onboardSteps.length-1?'完成':'下一步';
var tipW=260;
var tipLeft=r.left+r.width/2-tipW/2;if(tipLeft<10)tipLeft=10;if(tipLeft+tipW>window.innerWidth-10)tipLeft=window.innerWidth-tipW-10;
var tipTop=r.bottom+14;
if(tipTop+160>window.innerHeight)tipTop=r.top-160;
tip.style.left=tipLeft+'px';tip.style.top=tipTop+'px';
}
function nextOnboard(){
_onboardIdx++;
if(_onboardIdx>=_onboardSteps.length)finishOnboarding();
else renderOnboardStep();
}
function skipOnboard(){finishOnboarding();}
function finishOnboarding(){
var mask=document.getElementById('onboardMask');
if(mask)mask.classList.remove('show');
localStorage.setItem('yf_onboarded_v5','1');
}

window.handleProfileBgImg=function(input){
try{
var f=input.files[0];if(!f)return;
if(f.size>8*1024*1024){showToast('图片不能超过8MB','warn');input.value='';return;}
showToast('正在处理图片...','info');
var reader=new FileReader();
reader.onload=function(e){
var img=new Image();
img.onload=function(){
try{
var canvas=document.createElement('canvas');
var W=Math.min(img.width,750),H=Math.round(W*4/3);
if(img.height<img.width*4/3){H=Math.min(img.height,1000);W=Math.round(H*3/4);}
canvas.width=W;canvas.height=H;
var ctx=canvas.getContext('2d');
var scale=Math.max(W/img.width,H/img.height);
var sw=W/scale,sh=H/scale;
var sx=(img.width-sw)/2,sy=(img.height-sh)/2;
ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
var dataUrl=canvas.toDataURL('image/jpeg',0.8);
var saved=false;
try{localStorage.setItem('yf_profile_bg',dataUrl);saved=true;}catch(qe){}
if(!saved){
canvas.width=Math.round(W*0.5);canvas.height=Math.round(H*0.5);
ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
try{dataUrl=canvas.toDataURL('image/jpeg',0.6);localStorage.setItem('yf_profile_bg',dataUrl);saved=true;}catch(qe2){}
}
if(!saved){
canvas.width=360;canvas.height=Math.round(360*H/W);
ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
try{dataUrl=canvas.toDataURL('image/jpeg',0.5);localStorage.setItem('yf_profile_bg',dataUrl);saved=true;}catch(qe3){}
}
if(!saved){showToast('存储空间已满，请先清理相册图片或帖子图片后再上传','warn');return;}
applyProfileBg(dataUrl);
var chips=document.querySelectorAll('.bg-chip');
for(var k=0;k<chips.length;k++){chips[k].style.outline='none';chips[k].style.boxShadow='none';}
var btn=document.getElementById('bgRemoveBtn');if(btn)btn.style.display='inline-block';
var st=document.getElementById('bgImgStatus');if(st){st.textContent='已上传图片';st.style.color='#00b894';}
showToast('背景已设置','success');
}catch(err){console.error(err);showToast('图片处理失败：'+err.message,'error');}
};
img.onerror=function(){showToast('图片加载失败','error');};
img.src=e.target.result;
};
reader.onerror=function(){showToast('文件读取失败','error');};
reader.readAsDataURL(f);
input.value='';
}catch(e){console.error(e);showToast('上传失败：'+e.message,'error');}
};
window.removeProfileBgImg=function(){
try{
localStorage.setItem('yf_profile_bg',PROFILE_BG_GRADIENTS[0]);
applyProfileBg(PROFILE_BG_GRADIENTS[0]);
var chips=document.querySelectorAll('.bg-chip');
if(chips[0]){chips[0].style.outline='2px solid #fff';chips[0].style.outlineOffset='1px';chips[0].style.boxShadow='0 0 0 2px #00AEEC';}
var btn=document.getElementById('bgRemoveBtn');if(btn)btn.style.display='none';
var st=document.getElementById('bgImgStatus');if(st){st.textContent='建议竖图 750x1000';st.style.color='var(--text3)';}
}catch(e){}
};
window.applyProfileBg=function(bg){
var el=document.querySelector('.pr-bg');
if(!el)return;
if(bg.indexOf('url(')===0||bg.indexOf('data:image')===0){
el.style.background='url("'+bg+'") center/cover no-repeat';

var mask=document.getElementById('bgPickerMask');

function doCheckin(){
var today=_yfToday();
var ci=v6State.checkin;
if(ci.lastDate===today){showToast('今天已经签到过啦~','info');return;}
var yesterday=new Date(Date.now()-86400000);
var ys=yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');
if(ci.lastDate===ys){ci.streak++;}else{ci.streak=1;}
ci.lastDate=today;ci.totalDays++;
if(ci.history.indexOf(today)===-1)ci.history.push(today);
if(ci.streak>0&&ci.streak%7===0){
ci.makeupCards=(ci.makeupCards||0)+1;
addMyPoints(100);
showCelebrate('周签到达人！','连续签到'+ci.streak+'天，获得100积分和补签卡x1！','太棒了',function(){});
YangFanData.unlockMedal(currentUser.id,'checkin_weekly');
}else{
addMyPoints(10);
var msg=V6_ENCOURAGE[Math.floor(Math.random()*V6_ENCOURAGE.length)];
showToast('签到成功！+10积分 '+msg,'success');
}
yfSafeSet('checkin',ci);
v6State.checkin=ci;
if(currentUser){YangFanData.updateUser(currentUser.id,{checkinDays:ci.totalDays,lastLogin:today});}
try{renderDiscover();}catch(e){}
try{renderProfile();}catch(e){}
}

function useMakeupCard(){
var ci=v6State.checkin;
if(!ci.makeupCards||ci.makeupCards<=0){showToast('没有补签卡','info');return;}
var yesterday=new Date(Date.now()-86400000);
var ys=yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');
if(ci.history.indexOf(ys)>-1){showToast('昨天已签到','info');return;}
ci.makeupCards--;ci.streak++;ci.totalDays++;ci.history.push(ys);
yfSafeSet('checkin',ci);showToast('补签成功！','success');
}

function fallbackCopy(text){

}catch(e){showToast('复制失败，请长按选择','error');}
}

if(e.touches.length===2){_ivStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
});
document.addEventListener('touchmove',function(e){
var v=document.getElementById('imgViewer');
if(!v||!v.classList.contains('show'))return;
if(e.touches.length===2&&_ivStartDist){
var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
_ivScale=Math.max(0.5,Math.min(3,_ivScale*(dist/_ivStartDist)));
document.getElementById('imgViewerImg').style.transform='scale('+_ivScale+')';
_ivStartDist=dist;
}
});
document.addEventListener('touchend',function(){_ivStartDist=0;});

/* ===== v6：文字生图（小红书式文字卡片） ===== */
var _tigTpl='basic';
var TIG_TPLS=[
{k:'basic',n:'基础',bg:'linear-gradient(160deg,#FFF5F7,#FFE9EF)'},
{k:'diffuse',n:'弥散',bg:'linear-gradient(140deg,#F3F0FF,#FDEFF5)'},
{k:'hand',n:'手写',bg:'#FDFBF2'},
{k:'light',n:'光影',bg:'linear-gradient(150deg,#EAF3FC,#FDF3E7)'},
{k:'note',n:'便签',bg:'#EFF3F8'},
{k:'grid',n:'手帐',bg:'#FFFEF6'}
];
function openTextImgGen(){
try{
if(!document.getElementById('textImgOv'))return;
var ta=document.getElementById('tigText');
var pc=document.getElementById('pubC');
if(ta&&!ta.value&&pc&&pc.value)ta.value=pc.value;
_tigTpl='basic';
var box=document.getElementById('tigTpls');if(box)box.innerHTML=tigTplHtml();
document.getElementById('textImgOv').classList.add('show');
setTimeout(tigPreview,60);
}catch(e){console.warn('tig:',e);}
}
function tigTplHtml(){
var h='';
for(var i=0;i<TIG_TPLS.length;i++){var t=TIG_TPLS[i];
h+='<div class="tig-tpl'+(t.k===_tigTpl?' on':'')+'" onclick="tigSetTpl(\''+t.k+'\')" style="background:'+t.bg+'"><i>'+t.n+'</i></div>';
}
return h;
}
function tigSetTpl(k){_tigTpl=k;var box=document.getElementById('tigTpls');if(box)box.innerHTML=tigTplHtml();tigPreview();}
function tigClose(){var ov=document.getElementById('textImgOv');if(ov)ov.classList.remove('show');}
function tigGetText(){
var ta=document.getElementById('tigText');var t=ta?ta.value.trim():'';
return t;
}
function tigPreview(){
try{
var cv=document.getElementById('tigCanvas');if(!cv)return;
var ctx=cv.getContext('2d');
var W=cv.width,H=cv.height;
ctx.clearRect(0,0,W,H);
var text=tigGetText();
if(!text){text='在这里写下你想说的话\n生成一张好看的卡片图';}
yfTigDraw(ctx,_tigTpl,text,W,H);
}catch(e){console.warn('tigPreview:',e);}
}
function yfTigWrap(ctx,text,maxW){
var lines=[];
var raw=String(text).split('\n');
for(var r=0;r<raw.length;r++){
var cur='';
var seg=raw[r];
for(var i=0;i<seg.length;i++){
var test=cur+seg[i];
if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=seg[i];}
else cur=test;
}
lines.push(cur);
}
return lines;
}
function yfTigFont(tpl){
if(tpl==='hand')return '"Kaiti SC","STKaiti","KaiTi","Noto Sans SC",serif';
return '"Noto Sans SC","PingFang SC",sans-serif';
}
function yfTigDraw(ctx,tpl,text,W,H){
var F=yfTigFont(tpl);
var pad=110,maxW=W-pad*2;
// 底
if(tpl==='basic'){
ctx.fillStyle='#FFF5F7';ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(244,143,177,.35)';
ctx.font='900 200px Georgia,serif';ctx.fillText('\u201C',70,290);
ctx.fillStyle='#F6CBD9';ctx.fillRect(W-190,H-200,80,14);
}else if(tpl==='diffuse'){
ctx.fillStyle='#F5F2FF';ctx.fillRect(0,0,W,H);
function blob(x,y,r,c){var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
blob(140,180,420,'rgba(251,114,153,.34)');
blob(950,420,460,'rgba(0,174,236,.26)');
blob(300,1250,480,'rgba(255,214,10,.22)');
blob(860,1180,380,'rgba(108,92,231,.22)');
}else if(tpl==='hand'){
ctx.fillStyle='#FDFBF2';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(180,160,110,.22)';ctx.lineWidth=2;
for(var ly=400;ly<H-140;ly+=120){ctx.beginPath();ctx.moveTo(90,ly);ctx.lineTo(W-90,ly);ctx.stroke();}
ctx.fillStyle='rgba(214,158,110,.5)';ctx.fillRect(64,90,10,H-180);
}else if(tpl==='light'){
var lg=ctx.createLinearGradient(0,0,W,H);
lg.addColorStop(0,'#EAF3FC');lg.addColorStop(1,'#FDF3E7');
ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-0.5);
var sg=ctx.createLinearGradient(-200,0,200,0);
sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.55)');sg.addColorStop(1,'rgba(255,255,255,0)');
ctx.fillStyle=sg;ctx.fillRect(-260,-H,520,H*2);ctx.restore();
}else if(tpl==='note'){
ctx.fillStyle='#EFF3F8';ctx.fillRect(0,0,W,H);
ctx.save();ctx.shadowColor='rgba(60,80,120,.18)';ctx.shadowBlur=40;ctx.shadowOffsetY=16;
ctx.fillStyle='#FFFFFF';ctx.fillRect(80,150,W-160,H-330);ctx.restore();
ctx.fillStyle='rgba(251,113,133,.75)';
ctx.save();ctx.translate(W/2,150);ctx.rotate(-0.03);ctx.fillRect(-150,-38,300,76);ctx.restore();
ctx.fillStyle='rgba(255,120,140,.4)';ctx.fillRect(140,240,4,H-460);
}else{ // grid
ctx.fillStyle='#FFFEF6';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(190,180,140,.25)';ctx.lineWidth=1.5;
for(var gx=48;gx<W;gx+=48){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
for(var gy=48;gy<H;gy+=48){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
ctx.strokeStyle='rgba(214,120,90,.6)';ctx.lineWidth=3;
ctx.strokeRect(36,36,W-72,H-72);
}
// 字号自适应
var size=76;
if(text.length>40)size=64;
if(text.length>70)size=54;
if(text.length>100)size=48;
ctx.font='700 '+size+'px '+F;
var lines=yfTigWrap(ctx,text,maxW);
var lh=size*1.62;
var totalH=lines.length*lh;
var cy;
if(tpl==='hand'||tpl==='note'){
ctx.fillStyle=tpl==='hand'?'#5B5240':'#3E4A5A';
ctx.textAlign='left';
var sy=tpl==='hand'?400:300;
if(totalH<H-620){sy+=(H-680-totalH)/2;}
if(sy+totalH>H-160)sy=Math.max(300,H-160-totalH);
for(var li=0;li<lines.length;li++){ctx.fillText(lines[li],pad,sy+li*lh);}
}else{
ctx.textAlign='center';
ctx.fillStyle=tpl==='basic'?'#4A4A52':'#3C3C46';
cy=H/2-totalH/2+size*0.4;
if(cy<300)cy=300;
for(var ci=0;ci<lines.length;ci++){ctx.fillText(lines[ci],W/2,cy+ci*lh);}
}
// 页脚水印
ctx.textAlign='center';
ctx.font='500 30px '+F;
ctx.fillStyle=tpl==='note'?'rgba(90,110,140,.5)':'rgba(120,120,130,.45)';
ctx.fillText('青帆社区 · 扬帆计划',W/2,H-96);
}
function tigUse(){
try{
var text=tigGetText();
if(!text){showToast('先写点文字再生成','warn');return;}
if(pubImgs.length>=9){showToast('图片最多9张，先删一张','warn');return;}
var cv=document.getElementById('tigCanvas');

}

/* ===== v6：全站右滑手势返回 ===== */
(function(){
var sx=0,sy=0,st=0,tracking=false;
function isEditable(t){
if(!t||!t.tagName)return false;
var tag=t.tagName;
if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return true;
if(t.isContentEditable)return true;
return false;
}
document.addEventListener('touchstart',function(e){
if(e.touches.length!==1)return;
var t=e.touches[0];
if(t.clientX>56)return;
if(isEditable(e.target))return;
sx=t.clientX;sy=t.clientY;st=Date.now();tracking=true;
},{passive:true});
document.addEventListener('touchmove',function(e){
if(!tracking)return;
var t=e.touches[0];
var dx=t.clientX-sx,dy=t.clientY-sy;
var h=document.getElementById('swBackHint');
if(h){
if(dx>24&&Math.abs(dy)<44){h.style.opacity='.9';h.style.top=Math.max(40,Math.min(window.innerHeight-120,t.clientY-28))+'px';}
else{h.style.opacity='0';}
}
},{passive:true});
document.addEventListener('touchend',function(e){
var h=document.getElementById('swBackHint');if(h)h.style.opacity='0';
if(!tracking)return;tracking=false;
var t=e.changedTouches[0];
var dx=t.clientX-sx,dy=t.clientY-sy;
if(dx<70||Math.abs(dy)>64||dx<Math.abs(dy)*1.2)return;
if(Date.now()-st>1200)return;
yfGestureBack();
},{passive:true});
})();

var rg=document.getElementById('regGuideOv');
