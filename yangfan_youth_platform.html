<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>青帆社区 - 扬帆青年的成长部落</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4facfe">
<link rel="apple-touch-icon" href="icon-192.svg">
<style>

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#4facfe;--pri-d:#3a8fd8;--pri-l:#7ec8ff;
  --coral:#ff6b6b;--coral-l:#ff8e8e;--orange:#ffa502;
  --bg:#f8f9fa;--white:#fff;--card:#fff;
  --text:#2d3436;--text2:#636e72;--text3:#b2bec3;
  --border:#eef1f5;--shadow:0 2px 8px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Segoe UI','Microsoft YaHei',sans-serif;
  --r:10px;--r2:14px
}
html,body{height:100%;font-family:var(--font);font-weight:400;background:#eee;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{text-decoration:none;color:inherit}
button{border:none;background:none;font-family:var(--font);cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font-family:var(--font);outline:none;border:none}
::-webkit-scrollbar{width:0;height:0}

#app{width:100%;max-width:430px;height:100vh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){#app{box-shadow:0 0 60px rgba(79,172,254,.15)}}

#loginPage{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#4facfe 0%,#7ec8ff 40%,#a8e6ff 100%);overflow:hidden}
#loginPage.hidden{display:none}
.ln-sail{position:absolute;opacity:.65}
.ln-sail:nth-child(1){left:8%;bottom:95px;animation:sf 4s ease-in-out infinite}
.ln-sail:nth-child(2){left:52%;bottom:115px;animation:sf 5s ease-in-out infinite .6s}
.ln-sail:nth-child(3){right:8%;bottom:85px;animation:sf 3.5s ease-in-out infinite 1.2s}
@keyframes sf{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes wave{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ln-wave{position:absolute;bottom:0;left:0;width:200%;animation:wave 8s linear infinite}
.ln-title{color:#fff;font-size:30px;font-weight:600;margin-bottom:6px;text-shadow:0 2px 20px rgba(0,0,0,.15);z-index:2;letter-spacing:1px}
.ln-sub{color:rgba(255,255,255,.85);font-size:14px;margin-bottom:36px;z-index:2}
.ln-form{width:85%;max-width:320px;z-index:2}
.ln-input{width:100%;padding:14px 16px;margin-bottom:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25);border-radius:12px;color:#fff;font-size:15px;backdrop-filter:blur(8px);transition:border .2s}
.ln-input::placeholder{color:rgba(255,255,255,.55)}
.ln-input:focus{border-color:rgba(255,255,255,.6)}
.ln-btn{width:100%;padding:14px;background:var(--coral);border-radius:12px;color:#fff;font-size:16px;font-weight:600;margin-top:6px;transition:transform .12s;box-shadow:0 4px 15px rgba(255,107,107,.35)}
.ln-btn:active{transform:scale(.96)}
.ln-foot{color:rgba(255,255,255,.5);font-size:11px;margin-top:20px;z-index:2}

.ln-tabs{display:flex;gap:0;margin-bottom:18px;z-index:2;width:85%;max-width:320px}
.ln-tab{flex:1;text-align:center;padding:10px 0;color:rgba(255,255,255,.55);font-size:14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.ln-tab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.ln-switch{color:rgba(255,255,255,.65);font-size:12px;margin-top:14px;z-index:2;cursor:pointer;text-decoration:underline}
.ln-reg-form{width:85%;max-width:320px;z-index:2;display:none}
.ln-reg-form .ln-input{color:#fff}

.notif-dd{position:absolute;top:48px;right:8px;width:300px;max-height:400px;background:var(--white);border-radius:var(--r2);box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:999;overflow:hidden;display:none;flex-direction:column}
.notif-dd.show{display:flex}
.notif-dd-hdr{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.notif-dd-hdr h4{font-size:14px;font-weight:600}
.notif-dd-hdr span{font-size:11px;color:var(--pri);cursor:pointer}
.notif-dd-list{flex:1;overflow-y:auto;padding:6px 0}
.notif-item{display:flex;gap:10px;padding:10px 14px;cursor:pointer;transition:background .15s}
.notif-item:active{background:var(--bg)}
.notif-item.unread{background:rgba(79,172,254,.04)}
.notif-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.notif-body{flex:1;min-width:0}
.notif-body p{font-size:12px;line-height:1.5;color:var(--text)}
.notif-body span{font-size:10px;color:var(--text3);margin-top:2px;display:block}
.notif-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;background:var(--coral);color:#fff;border-radius:8px;font-size:10px;font-weight:600;padding:0 4px;position:absolute;top:-4px;right:-4px}

#mainContent{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page{display:none;min-height:100%;padding-bottom:64px}
.page.active{display:block}

.hdr{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;background:var(--white);position:sticky;top:0;z-index:10}
.hdr-title{font-size:19px;font-weight:600;background:linear-gradient(135deg,var(--pri),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-icons{display:flex;gap:10px;position:relative}
.hdr-ic{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg);transition:transform .1s;position:relative}
.hdr-ic:active{transform:scale(.88)}

.feed-tabs{display:flex;padding:0 16px;background:var(--white);border-bottom:1px solid var(--border)}
.feed-tab{padding:10px 16px;font-size:14px;color:var(--text3);position:relative;cursor:pointer;font-weight:500;transition:color .2s}
.feed-tab.on{color:var(--pri);font-weight:600}
.feed-tab.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:3px;background:var(--pri);border-radius:2px}

.srch{padding:8px 16px}
.srch-w{position:relative}
.srch-w svg{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.srch-i{width:100%;padding:10px 14px 10px 36px;background:var(--bg);border-radius:20px;font-size:13px;color:var(--text)}

.ann{display:flex;align-items:center;padding:4px 16px 8px;gap:8px;overflow:hidden}
.ann-t{white-space:nowrap;animation:marq 25s linear infinite;font-size:12px;color:var(--pri)}
@keyframes marq{0%{transform:translateX(80%)}100%{transform:translateX(-100%)}}

.tags{display:flex;gap:8px;padding:6px 16px;overflow-x:auto}
.tag{padding:5px 12px;border-radius:14px;font-size:12px;background:var(--white);color:var(--text2);white-space:nowrap;flex-shrink:0;transition:all .15s;border:1px solid var(--border);cursor:pointer}
.tag:active{transform:scale(.94)}
.tag.on{background:var(--pri);color:#fff;border-color:var(--pri)}

.ban{padding:6px 16px 10px;position:relative;width:100%;box-sizing:border-box}
.ban-viewport{position:relative;width:100%;height:160px;overflow:hidden;border-radius:var(--r2)}
.ban-slide{position:absolute;top:0;left:0;width:100%;height:160px;display:flex;align-items:flex-end;border-radius:var(--r2);overflow:hidden;box-sizing:border-box;background-size:cover;background-position:center;opacity:0;z-index:0}
.ban-slide.on{opacity:1;z-index:2}
.ban-slide::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.65));border-radius:var(--r2)}
.ban-text{position:relative;z-index:3;padding:16px 18px 18px;width:100%}
.ban-text h3{font-size:16px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;line-height:1.4}
.ban-dots{display:flex;justify-content:center;gap:5px;margin-top:8px}
.ban-dot{width:5px;height:5px;border-radius:50%;background:var(--border);transition:all .3s;cursor:pointer}
.ban-dot.on{background:var(--pri);width:18px;border-radius:3px}
.ban-tag{display:inline-block;font-size:10px;background:rgba(255,107,107,.9);padding:2px 8px;border-radius:10px;margin-bottom:6px;font-weight:600;color:#fff}

.feed{padding:8px 10px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.fc{border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer;transition:transform .12s;break-inside:avoid}
.fc:active{transform:scale(.97)}
.fc-img{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;position:relative}
.fc-img svg{opacity:.4;width:36px;height:36px}
.fc-body{padding:8px 10px 10px}
.fc-t{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.fc-meta{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.fc-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;flex-shrink:0;font-weight:600}
.fc-lk{margin-left:auto;display:flex;align-items:center;gap:2px}
.fc-img-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;display:flex;align-items:center;gap:2px;z-index:2}
.fc-pin{position:absolute;top:6px;left:6px;z-index:2;background:var(--coral);color:#fff;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700}
.fc-feat{position:absolute;top:6px;right:6px;z-index:2;background:var(--orange);color:#fff;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700}

.ov{position:fixed;top:0;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--white);z-index:100;transform:translateX(100%);transition:transform .28s ease;overflow-y:auto}
.ov.show{transform:translateX(0)}
.dv-hdr{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:2}
.dv-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-right:6px;cursor:pointer}
.dv-back:active{background:var(--bg)}

.pd-body{padding:16px}
.pd-author{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pd-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600}
.pd-name{font-size:14px;font-weight:600}
.pd-time{font-size:11px;color:var(--text3)}
.pd-title{font-size:17px;font-weight:600;margin-bottom:10px;line-height:1.4}
.pd-text{font-size:14px;line-height:1.8;color:var(--text2);margin-bottom:16px}
.pd-acts{display:flex;gap:20px;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:14px}
.pd-act{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text3);cursor:pointer;transition:color .2s}
.pd-act:active{transform:scale(.9)}
.pd-act.liked{color:var(--coral)}
.pd-act.faved{color:var(--orange)}
.cm-sec h3{font-size:14px;margin-bottom:10px}
.cm-item{display:flex;gap:8px;margin-bottom:12px}
.cm-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex-shrink:0}
.cm-body{flex:1}
.cm-name{font-size:12px;font-weight:600}
.cm-txt{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.5}
.cm-w{display:flex;gap:8px;margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
.cm-in{flex:1;padding:9px 14px;background:var(--bg);border-radius:18px;font-size:12px}
.cm-btn{padding:8px 14px;background:var(--pri);color:#fff;border-radius:18px;font-size:12px;cursor:pointer}
.cm-btn:active{transform:scale(.94)}

.flw{padding:4px 12px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid var(--pri);color:var(--pri);background:transparent}
.flw:active{transform:scale(.92)}
.flw.on{background:var(--bg);color:var(--text3);border-color:var(--border)}

.st-banner{padding:36px 20px 40px;background:linear-gradient(135deg,#4facfe,#7ec8ff);color:#fff;text-align:center;position:relative;overflow:hidden}
.st-banner::after{content:"";position:absolute;bottom:-30px;left:-10%;width:120%;height:50px;background:var(--bg);border-radius:50%}
.st-banner h2{font-size:20px;font-weight:600;margin-bottom:6px;position:relative;z-index:1}
.st-banner p{font-size:13px;opacity:.85;position:relative;z-index:1}
.st-tabs{display:flex;padding:10px 16px;gap:8px;background:var(--white);border-bottom:1px solid var(--border)}
.st-tab{padding:6px 14px;border-radius:16px;font-size:12px;background:var(--bg);color:var(--text2);cursor:pointer;transition:all .15s;font-weight:500}
.st-tab.on{background:var(--pri);color:#fff}
.st-tab:active{transform:scale(.94)}
.st-filter{display:flex;gap:6px;padding:8px 16px;overflow-x:auto}
.st-list{padding:8px 16px}
.st-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--white);border-radius:var(--r2);margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.st-card:active{transform:scale(.98)}
.st-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:600;flex-shrink:0}
.st-info{flex:1;min-width:0}
.st-info h4{font-size:14px;font-weight:600;margin-bottom:2px}
.st-info p{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-role{font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(79,172,254,.1);color:var(--pri);white-space:nowrap;flex-shrink:0}
.st-carousel{padding:10px 16px;overflow-x:auto;display:flex;gap:10px}
.st-cc{min-width:180px;background:var(--white);border-radius:var(--r2);padding:14px;box-shadow:var(--shadow);cursor:pointer;flex-shrink:0}
.st-cc:active{transform:scale(.97)}
.st-cc-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600;margin-bottom:8px}
.st-cc h4{font-size:14px;margin-bottom:3px}
.st-cc p{font-size:11px;color:var(--text2);line-height:1.4}

.sd-banner{padding:24px 16px;background:linear-gradient(135deg,#4facfe,#7ec8ff);color:#fff;display:flex;align-items:center;gap:14px}
.sd-av{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:600;flex-shrink:0}
.sd-info h2{font-size:18px;font-weight:600;margin-bottom:2px}
.sd-info p{font-size:12px;opacity:.85}
.sd-sec{padding:14px 16px}
.sd-sec h3{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--pri-d)}
.sd-sec p{font-size:13px;line-height:1.8;color:var(--text2);margin-bottom:8px}
.sd-ask{display:block;margin:12px 16px;padding:12px;background:linear-gradient(135deg,var(--coral),var(--coral-l));color:#fff;border-radius:var(--r);font-size:14px;font-weight:600;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(255,107,107,.25)}
.sd-ask:active{transform:scale(.97)}
.sd-qa{padding:0 16px 14px}
.sd-qa-item{padding:10px;background:var(--bg);border-radius:var(--r);margin-bottom:8px}
.sd-qa-q{font-size:12px;font-weight:600;margin-bottom:4px}
.sd-qa-a{font-size:12px;color:var(--text2);line-height:1.5}
.sd-task{padding:0 16px 14px}
.sd-task-item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.sd-task-item:active{background:var(--border)}
.sd-task-t{flex:1;font-size:12px}
.sd-task-p{font-size:11px;color:var(--pri);font-weight:600}

.qa-section{padding:10px 16px}
.qa-tabs{display:flex;gap:6px;margin-bottom:10px}
.qa-tab{padding:5px 14px;border-radius:14px;font-size:12px;background:var(--bg);color:var(--text2);cursor:pointer;font-weight:500;transition:all .15s}
.qa-tab.on{background:var(--pri);color:#fff}
.qa-ask-btn{display:block;margin:0 16px 10px;padding:10px;background:linear-gradient(135deg,var(--coral),var(--coral-l));color:#fff;border-radius:var(--r);font-size:13px;font-weight:600;text-align:center;cursor:pointer;box-shadow:0 3px 10px rgba(255,107,107,.2)}
.qa-card{padding:12px;background:var(--white);border-radius:var(--r2);margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.qa-card:active{transform:scale(.98)}
.qa-card-q{font-size:13px;font-weight:600;margin-bottom:6px;line-height:1.4}
.qa-card-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.qa-card-a{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text2);line-height:1.5}

.gr-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--white);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
.gr-hdr h2{font-size:17px;font-weight:600}
.gr-add{padding:6px 14px;background:var(--pri);color:#fff;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(79,172,254,.3)}
.gr-add:active{transform:scale(.94)}
.gr-sec{padding:10px 0 0}
.gr-sec-t{padding:0 16px 8px;font-size:13px;font-weight:600;color:var(--text)}
.gr-my{padding:0 16px 12px;overflow-x:auto;display:flex;gap:8px}
.gr-mc{min-width:120px;height:72px;border-radius:var(--r2);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;cursor:pointer;flex-shrink:0;position:relative;overflow:hidden}
.gr-mc:active{transform:scale(.97)}
.gr-mc h4{font-size:12px;font-weight:600;position:relative;z-index:1}
.gr-mc span{font-size:10px;opacity:.85;position:relative;z-index:1}
.gr-mc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.gr-mc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(0,0,0,.55));z-index:0}
.gr-cat{padding:6px 16px}
.gr-cat-t{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.gr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 12px}
.gr-gc{border-radius:var(--r2);overflow:hidden;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.gr-gc:active{transform:scale(.97)}
.gr-gc-cv{height:56px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gr-gc-cv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.15))}
.gr-gc-cv img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.gr-gc-cv svg{position:relative;z-index:1}
.gr-gc-bd{padding:6px 8px}
.gr-gc-bd h4{font-size:12px;font-weight:600;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-gc-bd p{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gd-hdr{padding:18px 16px;color:#fff;position:relative}
.gd-hdr.has-cover{padding:0;height:160px;overflow:hidden}
.gd-hdr.has-cover .gd-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gd-hdr.has-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.55) 100%)}
.gd-hdr.has-cover .gd-inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px}
.gd-hdr h2{font-size:18px;font-weight:600;margin-bottom:3px}
.gd-hdr p{font-size:12px;opacity:.85}
.gd-mem{font-size:11px;margin-top:4px;opacity:.7}

ime":"2025-01-20 11:30","excerpt":"学了三个月Python，终于做出了一个能用的东西！","content":"学了三个月Python，终于做出了一个能用的东西！我们村的苹果一直销路不好，我做了一个简单的销售小程序，可以在线下单查看物流。虽然界面还很粗糙，但村里的叔叔阿姨们用得很开心。","status":"approved","tag":"技能打卡","images":["https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=900&q=80"],"likes":302,"comments":[],"cbg":"linear-gradient(135deg,#00cec9,#0984e3)","abg":"linear-gradient(135deg,#00cec9,#0984e3)","icon":"code","featured":true,"pinned":true},{"id":6,"title":"支教日记：孩子们教给我的比我还教的多","author":"赵一诺","time":"2025-01-20 15:00","excerpt":"支教的第15天，一个叫小杰的男孩递给我一张纸条...","content":"支教的第15天，一个叫小杰的男孩递给我一张纸条，上面写着：老师你以后还会来吗？那一刻眼泪差点掉下来。这些孩子让我明白，教育的本质不是灌输知识，而是点燃希望。","status":"approved","tag":"实践感悟","images":[],"likes":176,"comments":[],"cbg":"linear-gradient(135deg,#fab1a0,#e17055)","abg":"linear-gradient(135deg,#fab1a0,#e17055)","icon":"heart","featured":false,"pinned":false},{"id":7,"title":"科普写作入门：把复杂的事说简单","author":"刘子轩","time":"2025-01-21 10:00","excerpt":"加入扬帆科普写作小组一个月了，从最初写得像论文到现在能写出朋友圈爆款...","content":"加入扬帆科普写作小组一个月了，从最初写得像论文到现在能写出朋友圈爆款。秘诀就是先想清楚读者是谁，再用他们听得懂的话讲。比如不要说光合作用是植物利用光能将CO2转化为有机物的过程，而要说植物晒太阳就能吃饱！","status":"approved","tag":"学习分享","images":[],"likes":64,"comments":[],"cbg":"linear-gradient(135deg,#a29bfe,#6c5ce7)","abg":"linear-gradient(135deg,#dfe6e9,#b2bec3)","icon":"edit","featured":false,"pinned":false},{"id":8,"title":"社区公益活动：为老人教智能手机","author":"孙雅琪","time":"2025-01-21 14:30","excerpt":"上周末在社区教老人们使用智能手机...","content":"上周末在社区教老人们使用智能手机。最让我感动的是70岁的王奶奶，学会视频通话后第一件事就是给在外地的孙子打电话。科技不应该成为代沟，而应该成为连接的桥梁。","status":"approved","tag":"志愿服务","images":[],"likes":143,"comments":[],"cbg":"linear-gradient(135deg,#55efc4,#00b894)","abg":"linear-gradient(135deg,#ffeaa7,#fdcb6e)","icon":"users","featured":false,"pinned":false},{"id":9,"title":"从零基础到独立完成纪录片的影像之路","author":"周文博","time":"2025-01-22 08:00","excerpt":"一年前我连手机录像都不会，现在居然独立完成了一部15分钟的乡村纪录片...","content":"一年前我连手机录像都不会，现在居然独立完成了一部15分钟的乡村纪录片。最难忘的是在海拔3000米的山上拍日出，冻得手都僵了，但看到成片的那一刻，值了！","status":"approved","tag":"拍摄日记","images":["https://images.unsplash.com/photo-1492724441997-5dc865305da7?w=900&q=80"],"likes":231,"comments":[],"cbg":"linear-gradient(135deg,#74b9ff,#0984e3)","abg":"linear-gradient(135deg,#81ecec,#00cec9)","icon":"film","featured":true,"pinned":true},{"id":10,"title":"考研经验分享：如何制定科学的复习计划","author":"吴佳怡","time":"2025-01-22 13:00","excerpt":"成功上岸985！分享复习时间线...","content":"成功上岸985！分享复习时间线：3-6月打基础每天6小时；7-9月强化每天8小时；10-12月冲刺每天10小时。关键是每周留出半天休息，保证效率比堆时间重要。","status":"approved","tag":"学习分享","images":["https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=900&q=80"],"likes":189,"comments":[],"cbg":"linear-gradient(135deg,#fd79a8,#e84393)","abg":"linear-gradient(135deg,#fd79a8,#e84393)","icon":"target","featured":true,"pinned":true},{"id":11,"title":"策划校园环保活动，参与人数超预期3倍","author":"黄子豪","time":"2025-01-23 09:30","excerpt":"在扬帆学到了项目策划方法论，决定在学校试一次...","content":"在扬帆学到了项目策划方法论，决定在学校试一次。从立项到执行用了两周，原本预计100人参加，结果来了300多人！成功的秘诀是找到同学们真正关心的切入点。","status":"approved","tag":"实践感悟","images":[],"likes":98,"comments":[],"cbg":"linear-gradient(135deg,#00b894,#00cec9)","abg":"linear-gradient(135deg,#00b894,#55efc4)","icon":"layers","featured":false,"pinned":false},{"id":12,"title":"乡村教育的未来：一个支教老师的深度思考","author":"郑晓峰","time":"2025-01-23 16:00","excerpt":"支教两年，我越来越觉得乡村教育缺的不是硬件而是有热情懂方法的老师...","content":"支教两年，我越来越觉得乡村教育缺的不是硬件而是有热情懂方法的老师。扬帆计划正在做的就是培养这样的火种。我希望更多年轻人能加入进来，哪怕只是短暂的陪伴，也能照亮孩子们的路。","status":"approved","tag":"成长思考","images":["https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=900&q=80"],"likes":267,"comments":[],"cbg":"linear-gradient(135deg,#6c5ce7,#a29bfe)","abg":"linear-gradient(135deg,#6c5ce7,#a29bfe)","icon":"globe","featured":true,"pinned":true},{"id":13,"title":"我的第一次社会实践经历","author":"李明","time":"2025-01-24 14:30","excerpt":"这个暑假我参加了扬帆计划的社会实践活动，第一次走进社区...","content":"这个暑假我参加了扬帆计划的社会实践活动，第一次走进社区，和居民面对面交流。感触很深，也更加坚定了自己投身公益的决心。","status":"approved","tag":"实践感悟","images":[],"likes":45,"comments":[],"cbg":"linear-gradient(135deg,#4facfe,#7ec8ff)","abg":"linear-gradient(135deg,#4facfe,#00 function _yfSeedAll(){
var seeds={posts:_YF_SEED_posts,stars:_YF_SEED_stars,groups:_YF_SEED_groups,opps:_YF_SEED_opps,banners:_YF_SEED_banners,announces:_YF_SEED_announces,tags:_YF_SEED_tags,users:_YF_SEED_users,audit_logs:[],tasks:_YF_SEED_tasks,shop_items:_YF_SEED_shop_items,exchanges:[],notifications:[],reports:[],bad_words:_YF_SEED_bad_words,messages:[]};
var ver=localStorage.getItem(_YF_VER);
var curVer=parseInt(ver)||0;
if(!ver){
for(var k in seeds){if(!_yfLoad(k)){_yfSave(k,seeds[k]);}}
}else{
var configKeys=['banners','tags','bad_words'];
for(var ck=0;ck<configKeys.length;ck++){_yfSave(configKeys[ck],seeds[configKeys[ck]]);}
for(var k2 in seeds){if(!_yfLoad(k2)){_yfSave(k2,seeds[k2]);}}
if(curVer<6){
try{
var _u6=_yfLoad('users')||[];
for(var _ui=0;_ui<_u6.length;_ui++){
if(!_u6[_ui].signature)_u6[_ui].signature='';
if(!_u6[_ui].mood)_u6[_ui].mood='';
if(!_u6[_ui].moodDate)_u6[_ui].moodDate='';
if(!_u6[_ui].favorites)_u6[_ui].favorites=[];
if(!_u6[_ui].following)_u6[_ui].following=[];
if(_u6[_ui].followers===undefined)_u6[_ui].followers=0;
if(!_u6[_ui].lastLogin)_u6[_ui].lastLogin='';
if(!_u6[_ui].checkinDays)_u6[_ui].checkinDays=0;
}
_yfSave('users',_u6);
var _p6=_yfLoad('posts')||[];
for(var _pi=0;_pi<_p6.length;_pi++){
if(!_p6[_pi].reactions)_p6[_pi].reactions={};
if(!_p6[_pi].edited)_p6[_pi].edited=false;
if(!_p6[_pi].challengeTag)_p6[_pi].challengeTag='';
if(!_p6[_pi].userId)_p6[_pi].userId=0;
}
_yfSave('posts',_p6);
}catch(e){console.warn('V6 migration error:',e);}
}
if(curVer<7){
try{
var _p7=_yfLoad('posts')||[];
var _hasPin=false;
for(var _pi7=0;_pi7<_p7.length;_pi7++){if(_p7[_pi7].pinned){_hasPin=true;break;}}
if(!_hasPin&&_p7.length){
var _sorted=_p7.slice().sort(function(a,b){return (b.likes||0)-(a.likes||0);});
for(var _si=0;_si<Math.min(5,_sorted.length);_si++){
for(var _pj=0;_pj<_p7.length;_pj++){if(_p7[_pj].id==_sorted[_si].id){_p7[_pj].pinned=true;break;}}
}
_yfSave('posts',_p7);
}
var _g7=_yfLoad('groups')||[];
var _gChanged=false;
for(var _gi7=0;_gi7<_g7.length;_gi7++){
if(!_g7[_gi7].cover)_g7[_gi7].cover='';
if(!_g7[_gi7].posts)_g7[_gi7].posts=[];
_gChanged=true;
}
if(_gChanged)_yfSave('groups',_g7);
}catch(e){console.warn('V7 migration error:',e);}
}
if(curVer<8){
try{
var _p8=_yfLoad('posts')||[];
if(_p8.length){
var _pinnedCount=0;
for(var _pc=0;_pc<_p8.length;_pc++){if(_p8[_pc].pinned)_pinnedCount++;}
if(_pinnedCount<5){
var _sorted8=_p8.slice().sort(function(a,b){return (b.likes||0)-(a.likes||0);});
var _toPin=5-_pinnedCount;
var _pinned8=0;
for(var _si8=0;_si8<_sorted8.length&&_pinned8<_toPin;_si8++){
if(!_sorted8[_si8].pinned){
for(var _pj8=0;_pj8<_p8.length;_pj8++){
if(_p8[_pj8].id==_sorted8[_si8].id){_p8[_pj8].pinned=true;break;}
}
_pinned8++;
}
}
_yfSave('posts',_p8);
}
}
var _g8=_yfLoad('groups')||[];
var _gChanged8=false;
for(var _gi8=0;_gi8<_g8.length;_gi8++){
if(_g8[_gi8].cover===undefined){_g8[_gi8].cover='';_gChanged8=true;}
if(!_g8[_gi8].posts){_g8[_gi8].posts=[];_gChanged8=true;}
}
if(_gChanged8)_yfSave('groups',_g8);
}catch(e){console.warn('V8 migration error:',e);}
}
if(curVer<9){
try{
// V9：之前的5条置顶种子帖同步标记为精华，确保轮播有内容
var _p9=_yfLoad('posts')||[];
var _seedIds=[3,5,9,10,12];
var _changed9=false;
for(var _pi9=0;_pi9<_p9.length;_pi9++){
if(_seedIds.indexOf(_p9[_pi9].id)>=0&&!_p9[_pi9].featured){
_p9[_pi9].featured=true;
_p9[_pi9].pinned=true;
_changed9=true;
}
}
if(_changed9)_yfSave('posts',_p9);
}catch(e){console.warn('V9 migration error:',e);}
}
if(curVer<10){
try{
// V10：清除旧的rid_map缓存（字段名映射修正后，旧record_id映射可能指向错误记录）
localStorage.removeItem('yf_rid_map_posts');
localStorage.removeItem('yf_rid_map_users');
// 确保种子帖精华标记
var _p10=_yfLoad('posts')||[];
var _seedIds10=[3,5,9,10,12];
for(var _pi10=0;_pi10<_p10.length;_pi10++){
if(_seedIds10.indexOf(_p10[_pi10].id)>=0){_p10[_pi10].featured=true;_p10[_pi10].pinned=true;}
}
_yfSave('posts',_p10);
}catch(e){console.warn('V10 migration error:',e);}
}
}
localStorage.setItem('yf_growth_config',JSON.stringify(_YF_SEED_growth_config));
localStorage.setItem('yf_medals_config',JSON.stringify(_YF_SEED_medals));
localStorage.setItem(_YF_VER,_YF_CUR_VER);
}

function _yfLoadAll(){
for(var i=0;i<_YF_TABLES.length;i++){var k=_YF_TABLES[i];_YF_cache[k]=_yfLoad(k)||[];}
_YF_inited=true;
}

function _yfNextId(table){
var arr=_YF_cache[table]||[];var mx=0;
for(var i=0;i<arr.length;i++){var v=parseInt(arr[i].id)||0;if(v>mx)mx=v;}
var local=mx+1;
var ts=Date.now();
return Math.max(local,ts);
}

function _yfLog(action,detail){
var log=_YF_cache.audit_logs||[];
log.unshift({id:log.length+1,action:action,detail:detail,time:_yfNow()});
if(log.length>200)log=log.slice(0,200);
_YF_cache.audit_logs=log;_yfSave('audit_logs',log);
}

getPosts:function(filter){
var posts=_YF_cache.posts||[];

if(filter.status)posts=posts.filter(function(p){return p.status===filter.status;});

if(filter.pinned!==undefined)posts=posts.filter(function(p){return !!p.pinned===filter.pinned;});
}
return JSON.parse(JSON.stringify(posts));
},

try{YF_CLOUD.pushPost(np);}catch(e){}
return np;
},
updatePost:function(id,data){
var posts=_YF_cache.posts||[];

_YF_cache.posts=posts;_yfSave('posts',posts);

getStats:function(){
var users=_YF_cache.users||[];
var posts=_YF_cache.posts||[];
var stars=_YF_cache.stars||[];
var today=_yfToday();
var todayActive=0,newUsers=0,todayPosts=0;
var activeUserSet={};
for(var i=0;i<posts.length;i++){
var p=posts[i];
var pDay=(p.time||'').substring(0,10);
if(pDay===today){
todayPosts++;
if(p.author)activeUserSet[p.author]=1;
}
if(p.comments){for(var j=0;j<p.comments.length;j++){}}
}
for(var i=0;i<users.length;i++){
if((users[i].created||'').substring(0,10)===today)newUsers++;
}
todayActive=Object.keys(activeUserSet).length;
var userChart=[0,0,0,0,0,0,0],postChart=[0,0,0,0,0,0,0];
var now=new Date();
for(var i=0;i<7;i++){
var d=new Date(now);d.setDate(d.getDate()-(6-i));
var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
for(var j=0;j<users.length;j++){if((users[j].created||'').substring(0,10)===ds)userChart[i]++;}
for(var j=0;j<posts.length;j++){if((posts[j].time||'').substring(0,10)===ds)postChart[i]++;}
}
return{
totalUsers:users.length,todayActive:todayActive,newUsers:newUsers,
totalPosts:posts.length,todayPosts:todayPosts,
pendingPosts:posts.filter(function(p){return p.status==='pending';}).length,
totalStars:stars.length,
totalGroups:(_YF_cache.groups||[]).length,
totalExchanges:(_YF_cache.exchanges||[]).length,
totalReports:(_YF_cache.reports||[]).filter(function(r){return r.status==='pending';}).length,
userChart:userChart,postChart:postChart
};
},

pushPost:async function(post){
if(!this.proxyUrl)return;
try{
var tableId=this.tables.posts;
var path='/bitable/v1/apps/'+this.baseToken+'/tables/'+tableId+'/records';
var fields=this._toFeishuFields('posts',post);
var ridMap=this._getRidMap('posts');
var rid=ridMap[post.id];
if(rid){
await this.proxyFetch(path+'/'+rid,'PUT',{fields:fields});
}else{
var d=await this.proxyFetch(path,'POST',{fields:fields});
if(d&&d.data&&d.data.record&&d.data.record.record_id){ridMap[post.id]=d.data.record.record_id;this._setRidMap('posts',ridMap);}
}
}catch(e){console.warn('[YF_CLOUD] pushPost error:',e);}
},
pushUser:async function(user){
if(!this.proxyUrl)return;
try{
var tableId=this.tables.users;
var path='/bitable/v1/apps/'+this.baseToken+'/tables/'+tableId+'/records';
var fields=this._toFeishuFields('users',user);
var ridMap=this._getRidMap('users');
var rid=ridMap[user.id];
if(rid){
await this.proxyFetch(path+'/'+rid,'PUT',{fields:fields});
}else{
var d=await this.proxyFetch(path,'POST',{fields:fields});
if(d&&d.data&&d.data.record&&d.data.record.record_id){ridMap[user.id]=d.data.record.record_id;this._setRidMap('users',ridMap);}
}
}catch(e){console.warn('[YF_CLOUD] pushUser error:',e);}
},
deletePostCloud:async function(postId){
if(!this.proxyUrl)return;
try{
var tableId=this.tables.posts;
var path='/bitable/v1/apps/'+this.baseToken+'/tables/'+tableId+'/records';
var searchBody={filter:{conjunction:'and',conditions:[{field_name:'post_id',operator:'is',value:[String(postId)]}]}};
var searchResp=await this.proxyFetch(path+'/search?page_size=50','POST',searchBody);
var items=(searchResp&&searchResp.data&&searchResp.data.items)||[];
if(items.length>0){
await this.proxyFetch(path+'/batch_delete','POST',{records:[items[0].record_id]});
var ridMap=this._getRidMap('posts');
delete ridMap[postId];this._setRidMap('posts',ridMap);
}
}catch(e){console.warn('[YF_CLOUD] deletePostCloud error:',e);}
}
};

function startBanner(){
stopBanner();
bannerIdx=0;
var tk=document.getElementById("banTrack");
if(!tk)return;
var slides=tk.querySelectorAll(".ban-slide");
if(slides.length<2)return;
// ensure first is visible
for(var i=0;i<slides.length;i++){slides[i].classList.remove("on");slides[i].style.left="0";slides[i].style.opacity="0";slides[i].style.zIndex="0";}
slides[0].classList.add("on");slides[0].style.opacity="1";slides[0].style.zIndex="2";
bannerTmr=setInterval(function(){
try{
var tk2=document.getElementById("banTrack");if(!tk2)return;
var ss=tk2.querySelectorAll(".ban-slide");var bc=ss.length;if(bc<2)return;
var cur=bannerIdx;
var nxt=(bannerIdx+1)%bc;
// prepare next slide off-screen to the right
ss[nxt].style.transition="none";
ss[nxt].style.left="100%";
ss[nxt].style.opacity="1";
ss[nxt].style.zIndex="2";
ss[cur].style.zIndex="1";
// force reflow
void ss[nxt].offsetWidth;
// animate both: current slides left, next slides in
ss[nxt].style.transition="left .5s ease-out";
ss[cur].style.transition="left .5s ease-out";
ss[nxt].style.left="0";
ss[cur].style.left="-100%";
// update dots
var ds=document.querySelectorAll("#banDots .ban-dot");
for(var d=0;d<ds.length;d++){if(d===nxt)ds[d].classList.add("on");else ds[d].classList.remove("on");}
// after animation, clean up
setTimeout(function(){
ss[cur].classList.remove("on");
ss[cur].style.opacity="0";
ss[cur].style.zIndex="0";
ss[cur].style.transition="none";
ss[nxt].classList.add("on");
},520);
bannerIdx=nxt;
}catch(e){console.warn('banner error:',e);}
},4000);
}
function _setBanner(idx){
var tk=document.getElementById("banTrack");if(!tk)return;
var slides=tk.querySelectorAll(".ban-slide");if(slides.length===0)return;
var ds=document.querySelectorAll("#banDots .ban-dot");
if(idx<0)idx=0;if(idx>=slides.length)idx=slides.length-1;
for(var i=0;i<slides.length;i++){
if(i===idx){slides[i].classList.add("on");slides[i].style.opacity="1";slides[i].style.zIndex="2";slides[i].style.left="0";}
else{slides[i].classList.remove("on");slides[i].style.opacity="0";slides[i].style.zIndex="0";}
}
for(var j=0;j<ds.length;j++){if(j===idx)ds[j].classList.add("on");else ds[j].classList.remove("on");}
}
function goBanner(i){
var tk=document.getElementById("banTrack");if(!tk)return;
var slides=tk.querySelectorAll(".ban-slide");var bc=slides.length;if(bc===0)return;
var idx=((i%bc)+bc)%bc;
// jump to target without animation
for(var k=0;k<slides.length;k++){slides[k].style.transition="none";}
_setBanner(idx);
bannerIdx=idx;
// restart auto-play
stopBanner();
// force reflow then restart
void tk.offsetWidth;
startBanner();
}
function stopBanner(){if(bannerTmr){clearInterval(bannerTmr);bannerTmr=null;}}

function openMbtiQuiz(){

body+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:12px;color:var(--text3)">第 '+(s.step+1)+' / '+total+' 题</span><span style="font-size:12px;color:#6c5ce7;font-weight:600">'+pct+'%</span></div>';
body+='<div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:24px"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#6c5ce7,#a29bfe);border-radius:3px;transition:width .3s"></div></div>';
body+='<div style="font-size:17px;font-weight:600;line-height:1.6;margin-bottom:24px;color:var(--text1)">'+q.q+'</div>';

body+='</div>';

var foot='<button class="btn btn-outline" onclick="closeModal()">退出测试</button>';
openModal('性格测试',body,foot);

function compressImg(file,maxW,quality){return new Promise(function(resolve){var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){function tryCompress(w,h,q){var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);var d=canvas.toDataURL('image/jpeg',q);if(d.length>40000&&q>0.35){var nw=Math.round(w*0.8),nh=Math.round(h*0.8);return tryCompress(nw,nh,q-0.1);}if(d.length>40000&&w>320){return tryCompress(Math.round(w*0.7),Math.round(h*0.7),q);}return d;}var w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}resolve(tryCompress(w,h,quality));};img.onerror=function(){resolve(e.target.result);};img.src=e.target.result;};reader.readAsDataURL(file);});}
function handlePubImgs(input){try{var files=input.files;if(!files)return;for(var i=0;i<files.length&&pubImgs.length<9;i++){(function(file){compressImg(file,1280,0.7).then(function(dataUrl){pubImgs.push(dataUrl);renderPubImgsPreview();});})(files[i]);}input.value="";}catch(e){}}

function getMedalStats(){
var userName=currentUser?currentUser.name:'';
var allPosts=YangFanData.getPosts({});
var myPosts=allPosts.filter(function(p){return p.author===userName;});
var comments=0;
try{var msgs=YangFanData.getMessages?YangFanData.getMessages():[];comments=msgs.length;}catch(e){}
var likes=0;for(var i=0;i<myPosts.length;i++)likes+=(myPosts[i].likes||0);
var myGroups=(lsGet('myGroups',[])||[]).length;
var favs=(lsGet('favoritePosts',[])||[]).length;
var featured=myPosts.filter(function(p){return p.featured;}).length;
var points=getMyPoints();
var level=YangFanData.getLevelByPoints(points).level;
var loginDays=parseInt(localStorage.getItem('yf_login_days')||'0');
var streak=parseInt(localStorage.getItem('yf_login_streak')||'0');
var invites=parseInt(localStorage.getItem('yf_invites')||'0');
var reports=parseInt(localStorage.getItem('yf_reports')||'0');
var donations=parseInt(localStorage.getItem('yf_donations')||'0');
var answers=parseInt(localStorage.getItem('yf_answers')||'0');
var events=parseInt(localStorage.getItem('yf_events')||'0');
return {posts:myPosts.length,comments:comments,likes:likes,groups:myGroups,favorites:favs,featured:featured,points:points,level:level,login_days:loginDays,login_streak:streak,invites:invites,reports:reports,donations:donations,answers:answers,events:events};
}
function getMedalCurrent(cond,stats){
switch(cond.type){
case 'posts':return stats.posts;
case 'comments':return stats.comments;
case 'likes':return stats.likes;
case 'points':return stats.points;
case 'groups':return stats.groups;
case 'favorites':return stats.favorites;
case 'featured':return stats.featured;
case 'role':return (currentUser&&currentUser.role==='mentor')?1:0;
case 'login_days':return stats.login_days;
case 'login_streak':return stats.login_streak;
case 'invites':return stats.invites;
case 'reports':return stats.reports;
case 'donations':return stats.donations;
case 'answers':return stats.answers;
case 'events':return stats.events;
case 'level':return stats.level;
case 'founder':return (localStorage.getItem('yf_founder')==='1')?1:0;
case 'special':return (localStorage.getItem('yf_special')==='1')?1:0;
default:return 0;
}
}
function computeAndUnlockMedals(){
try{
if(!currentUser||!currentUser.id)return;
var uid=currentUser.id;
var stats=getMedalStats();
var allMedals=YangFanData.getMedals();
var um=YangFanData.getUserMedals(uid);
var newlyUnlocked=[];
for(var i=0;i<allMedals.length;i++){
var m=allMedals[i];
if(um.unlocked.indexOf(m.id)>-1)continue;
if(m.cond.type==='role'){
if(currentUser.role==='mentor'||m.cond.value==='mentor'){if(stats.level>=0){}}
}
var cur=getMedalCurrent(m.cond,stats);
var met=false;
if(m.cond.type==='role'){met=(currentUser.role==='mentor'||m.cond.value==='mentor');}
else if(m.cond.type==='special'||m.cond.type==='founder'){met=cur>=1;}
else{met=cur>=m.cond.value;}
if(met){
var r=YangFanData.unlockMedal(uid,m.id);
if(r&&r.newly)newlyUnlocked.push(m);
}
}
um.progress={};
for(var j=0;j<allMedals.length;j++){
var mm=allMedals[j];
um.progress[mm.id]=getMedalCurrent(mm.cond,stats);
}
YangFanData.saveUserMedals(uid,um);
if(newlyUnlocked.length){
(function(list,idx){
function showNext(){
if(idx>=list.length)return;
var m=list[idx];
showCelebrate('解锁勋章：'+m.name,m.desc||'恭喜获得新勋章','继续',function(){idx++;showNext();});
}
showNext();
})(newlyUnlocked,0);
}
}catch(e){console.warn('computeMedals error',e);}
}

function renderOnboardStep(){
var step=_onboardSteps[_onboardIdx];

if(!el){_onboardIdx++;if(_onboardIdx<_onboardSteps.length)renderOnboardStep();else finishOnboarding();return;}
var r=el.getBoundingClientRect();
var pad=6;
spot.style.left=(r.left-pad)+'px';spot.style.top=(r.top-pad)+'px';
spot.style.width=(r.width+pad*2)+'px';spot.style.height=(r.height+pad*2)+'px';
titleEl.textContent=step.title;descEl.textContent=step.desc;
var dh='';for(var i=0;i<_onboardSteps.length;i++){dh+='<div class="onboard-dot'+(i===_onboardIdx?' on':'')+'"></div>';}
dots.innerHTML=dh;
btn.textContent=_onboardIdx===_onboardSteps.length-1?'完成':'下一步';
var tipW=260;
var tipLeft=r.left+r.width/2-tipW/2;if(tipLeft<10)tipLeft=10;if(tipLeft+tipW>window.innerWidth-10)tipLeft=window.innerWidth-tipW-10;
var tipTop=r.bottom+14;

tip.style.left=tipLeft+'px';tip.style.top=tipTop+'px';
}

else renderOnboardStep();
}

function drawBlindbox(){
var bb=v6State.blindbox;
var today=_yfToday();
if(bb.lastDate!==today){bb.count=0;bb.lastDate=today;}
if(bb.count>=10){showToast('今日次数已用完','info');return;}
var pts=getMyPoints();
if(pts<10){showToast('积分不足','error');return;}
addMyPoints(-10);
bb.count++;
var total=0;for(var i=0;i<V6_BLINDBOX_REWARDS.length;i++)total+=V6_BLINDBOX_REWARDS[i].weight;
var r=Math.random()*total,cum=0,won=V6_BLINDBOX_REWARDS[0];
for(var i=0;i<V6_BLINDBOX_REWARDS.length;i++){cum+=V6_BLINDBOX_REWARDS[i].weight;if(r<cum){won=V6_BLINDBOX_REWARDS[i];break;}}
var btn=document.getElementById('bbBtn');if(btn)btn.disabled=true;
var anim=document.getElementById('bbAnim');
var emojis=['🎁','✨','🎊','💫','🌟'];var ei=0;
var iv=setInterval(function(){if(anim)anim.textContent=emojis[ei%emojis.length];ei++;},100);
setTimeout(function(){
clearInterval(iv);
if(anim)anim.textContent=won.points>0?'🎉':'😅';
if(won.points>0){addMyPoints(won.points);}
var resEl=document.getElementById('bbResult');
if(resEl)resEl.textContent=won.points>0?('恭喜获得：'+won.label+'！'):'谢谢参与，明天再来~';
bb.history.push({date:today,reward:won.points});
yfSafeSet('blindbox',bb);v6State.blindbox=bb;
if(won.points>0){YangFanData.unlockMedal(currentUser.id,'lucky_star');}
var btn2=document.getElementById('bbBtn');
if(btn2){btn2.disabled=bb.count>=10;btn2.textContent=bb.count>=10?'今日已用完':'再开一次';}
},1000);
}

});

var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
_ivScale=Math.max(0.5,Math.min(3,_ivScale*(dist/_ivStartDist)));

_ivStartDist=dist;
}
});

function discardDraft(type){
delete v6State.drafts[type];
yfSafeSet('drafts',v6State.drafts);
showToast('草稿已丢弃','info');
try{renderDiscover();}catch(e){}
}

var _ptrStart=0,_ptrActive=false;
function initPullToRefresh(containerId){
var el=document.getElementById(containerId);
if(!el)return;
el.addEventListener('touchstart',function(e){if(el.scrollTop===0)_ptrStart=e.touches[0].clientY;},{passive:true});
el.addEventListener('touchmove',function(e){
if(el.scrollTop===0&&_ptrStart>0){
var diff=e.touches[0].clientY-_ptrStart;
if(diff>60&&!_ptrActive){
_ptrActive=true;
var ptr=document.createElement('div');
ptr.className='ptr show';ptr.id='ptrInd';ptr.textContent='释放刷新...';
el.prepend(ptr);
}
}
},{passive:true});
el.addEventListener('touchend',function(){
if(_ptrActive){
_ptrActive=false;
var ind=document.getElementById('ptrInd');
if(ind){ind.textContent='刷新中...';setTimeout(function(){ind.remove();},800);}
try{
YangFanData.refresh();
if(containerId==='mainContent'){renderDiscover();}
}catch(e){}
}
_ptrStart=0;
});
}

function showSkeleton(){
return '<div style="padding:12px 16px">'+
'<div class="skel" style="height:140px;margin-bottom:10px"></div>'+
'<div style="display:flex;gap:8px;margin-bottom:10px"><div class="skel" style="height:30px;flex:1"></div><div class="skel" style="height:30px;flex:1"></div></div>'+
'<div class="skel" style="height:80px;margin-bottom:8px"></div>'+
'<div class="skel" style="height:80px;margin-bottom:8px"></div>'+
'<div class="skel" style="height:80px"></div></div>';
}

function startV6Onboarding(){
if(v6State.onboardedV6)return;
var users=YangFanData.getUsers({role:'student'}).filter(function(u){return u.id!=(currentUser?currentUser.id:0);}).slice(0,6);
if(users.length<3)return;
var h='<div class="onboard" id="v6OnboardMask" style="z-index:10000">';
h+='<div style="position:absolute;inset:0;background:rgba(0,0,0,.7)"></div>';
h+='<div style="position:absolute;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;padding:20px;z-index:1">';
h+='<h3 style="font-size:18px;font-weight:700;margin-bottom:6px">选择你感兴趣的人</h3>';
h+='<p style="font-size:13px;color:var(--text2);margin-bottom:14px">关注3位用户，获取他们的最新动态</p>';
h+='<div class="ob-follow-grid" id="v6FollowGrid">';
for(var i=0;i<users.length;i++){
h+='<div class="ob-follow-card" data-uid="'+users[i].id+'" onclick="this.classList.toggle(\'sel\')">';
h+='<div style="width:44px;height:44px;border-radius:50%;background:'+randColor(users[i].name)+';margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">'+users[i].name.charAt(0)+'</div>';
h+='<div class="ob-follow-name">'+yfEsc(users[i].name)+'</div></div>';
}
h+='</div>';
h+='<button onclick="finishV6Onboarding()" style="width:100%;padding:12px;background:var(--pri);color:#fff;border-radius:10px;font-weight:600;margin-top:14px">完成</button>';
h+='<div style="text-align:center;padding:8px;font-size:12px;color:var(--text3);cursor:pointer" onclick="skipV6Onboarding()">跳过</div>';
h+='</div></div>';
document.getElementById('app').insertAdjacentHTML('beforeend',h);
}
function finishV6Onboarding(){
var cards=document.querySelectorAll('#v6FollowGrid .ob-follow-card.sel');
for(var i=0;i<cards.length;i++){
var uid=parseInt(cards[i].dataset.uid);
if(currentUser&&uid){
YangFanData.followUser(currentUser.id,uid);
YangFanData.createNotification({userId:uid,type:'follow',text:currentUser.name+' 关注了你'});
}
}
yfSafeSet('onboarded_v6',true);v6State.onboardedV6=true;
var mask=document.getElementById('v6OnboardMask');if(mask)mask.remove();
showToast('欢迎加入青帆社区！','success');
}
function skipV6Onboarding(){
yfSafeSet('onboarded_v6',true);v6State.onboardedV6=true;
var mask=document.getElementById('v6OnboardMask');if(mask)mask.remove();
}

document.addEventListener('DOMContentLoaded',function(){
setTimeout(function(){
try{initPullToRefresh('mainContent');}catch(e){}
if(currentUser&&!v6State.onboardedV6){
setTimeout(startV6Onboarding,2000);
}
},500);
});

</script>
